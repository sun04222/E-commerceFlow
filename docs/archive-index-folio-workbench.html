<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>售后 Agent · 客服工作台</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* ═══ 设计变量：客服工作台（参考真实电商客服 Agent 项目的信息架构）═══
     浅色工作区 + 白卡片 + 细边框 + 单一蓝色强调。
     三栏：会话队列 / 对话流 / 处理建议。全部走系统字体，离线可用。 */
  :root {
    --bg: #f7f7f8;
    --surface: #ffffff;
    --surface-2: #f4f4f5;
    --surface-3: #eaeaed;
    --border: #e7e7ea;
    --border-2: #d6d6da;
    --ink: #18181b;
    --ink-2: #3f3f46;
    --muted: #71717a;
    --faint: #a1a1aa;
    --accent: #2563eb;
    --accent-2: #1d4ed8;
    --accent-soft: #eff6ff;
    --accent-line: #bfdbfe;
    --ok: #16a34a;
    --ok-soft: #f0fdf4;
    --bad: #dc2626;
    --bad-soft: #fef2f2;
    --warn: #d97706;
    --warn-soft: #fffbeb;
    --rail-bg: #1c1c1f;
    --rail-ink: #a1a1aa;
    --rail-ink-on: #ffffff;
    --shadow: 0 1px 2px rgb(0 0 0 / 4%);
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    --mono: ui-monospace, "Cascadia Mono", Consolas, "SF Mono", "Courier New", monospace;
  }
  html[data-theme="dark"] {
    --bg: #0c0c0e;
    --surface: #16161a;
    --surface-2: #1f1f24;
    --surface-3: #27272d;
    --border: #27272d;
    --border-2: #3f3f46;
    --ink: #f4f4f5;
    --ink-2: #d4d4d8;
    --muted: #a1a1aa;
    --faint: #71717a;
    --accent: #3b82f6;
    --accent-2: #60a5fa;
    --accent-soft: #172554;
    --accent-line: #1e3a8a;
    --ok: #4ade80;
    --ok-soft: #052e16;
    --bad: #f87171;
    --bad-soft: #450a0a;
    --warn: #fbbf24;
    --warn-soft: #451a03;
    --rail-bg: #101013;
    --shadow: none;
  }

  body {
    background: var(--bg); color: var(--ink);
    font: 13px/1.6 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  .spacer { flex: 1; }
  button { font-family: var(--sans); }

  /* ═══ 外壳：图标轨 / 会话队列 / 对话流 / 处理建议 ═══ */
  .app {
    display: grid;
    grid-template-columns: 58px 268px minmax(0, 1fr) 396px;
    height: 100vh;
  }
  .app.no-panel { grid-template-columns: 58px 268px minmax(0, 1fr); }
  .app.no-panel .panel { display: none; }

  /* ── 图标轨（深色） ── */
  .rail {
    background: var(--rail-bg); display: flex; flex-direction: column;
    align-items: center; padding: 12px 0; gap: 4px;
  }
  .rail-logo {
    width: 30px; height: 30px; border-radius: 8px; background: var(--accent);
    color: #fff; font-weight: 700; font-size: 15px;
    display: flex; align-items: center; justify-content: center; margin-bottom: 10px;
  }
  .rail-btn {
    width: 34px; height: 34px; border: none; background: none; border-radius: 8px;
    color: var(--rail-ink); cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: background .12s, color .12s;
  }
  .rail-btn:hover { background: #ffffff14; color: var(--rail-ink-on); }
  .rail-btn svg { width: 16px; height: 16px; }

  /* ── 会话队列 ── */
  .queue {
    background: var(--surface); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .q-head {
    flex: none; display: flex; align-items: center; gap: 8px;
    padding: 13px 14px 11px; border-bottom: 1px solid var(--border);
  }
  .q-title { font-size: 13.5px; font-weight: 650; }
  .q-count { font-size: 10.5px; color: var(--muted); background: var(--surface-2); border-radius: 8px; padding: 1px 7px; }
  .q-stats {
    flex: none; display: grid; grid-template-columns: 1fr 1fr; gap: 7px;
    padding: 11px 12px; border-bottom: 1px solid var(--border);
  }
  .q-stat { background: var(--surface-2); border-radius: 8px; padding: 7px 9px; }
  .q-stat b { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; display: block; }
  .q-stat span { font-size: 10px; color: var(--muted); }
  .q-stat.tone-ok b { color: var(--ok); }
  .q-stat.tone-warn b { color: var(--warn); }
  .q-stat.tone-bad b { color: var(--bad); }
  .q-list { flex: 1; overflow-y: auto; padding: 8px 8px 4px; }
  .crow {
    display: block; width: 100%; text-align: left; border: none; cursor: pointer;
    background: none; border-radius: 9px; padding: 9px 10px; margin-bottom: 2px;
    transition: background .12s;
  }
  .crow:hover { background: var(--surface-2); }
  .crow.active { background: var(--accent-soft); }
  .crow-top { display: flex; align-items: center; gap: 7px; }
  .crow-title { font-size: 12.5px; font-weight: 550; color: var(--ink); }
  .crow-snip {
    font-size: 11px; color: var(--muted); margin-top: 3px; line-height: 1.5;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .crow-foot { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
  .q-foot { flex: none; border-top: 1px solid var(--border); padding: 10px 12px; }
  .q-settings summary {
    font-size: 11px; color: var(--muted); cursor: pointer; list-style: none;
    display: flex; align-items: center; gap: 6px; user-select: none;
  }
  .q-settings summary::-webkit-details-marker { display: none; }
  .q-settings summary::before { content: "▸"; font-size: 9px; transition: transform .12s; }
  .q-settings[open] summary::before { transform: rotate(90deg); }
  .q-settings-body { margin-top: 10px; }
  .opt { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); cursor: pointer; margin-top: 8px; }
  .opt input { accent-color: var(--accent); }
  .sw { display: flex; align-items: center; gap: 9px; font-size: 12px; color: var(--ink-2); cursor: pointer; margin-top: 9px; }
  .sw input { display: none; }
  .sw-track {
    width: 30px; height: 18px; border-radius: 10px; background: var(--surface-3);
    position: relative; flex: none; transition: background .15s;
  }
  .sw-track::after {
    content: ""; position: absolute; width: 14px; height: 14px; border-radius: 50%;
    background: #fff; top: 2px; left: 2px; transition: left .15s; box-shadow: 0 1px 2px rgb(0 0 0 / 20%);
  }
  .sw input:checked + .sw-track { background: var(--accent); }
  .sw input:checked + .sw-track::after { left: 14px; }
  .mode-note { font-size: 10.5px; color: var(--faint); margin-top: 9px; line-height: 1.6; }

  /* ── 对话流 ── */
  .conv { display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }
  .conv-head {
    flex: none; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 13px 22px; border-bottom: 1px solid var(--border); background: var(--surface);
  }
  .conv-title { font-size: 14.5px; font-weight: 650; }
  .conv-scroll { flex: 1; overflow-y: auto; padding: 22px 26px 8px; }
  .conv-inner { max-width: 760px; margin: 0 auto; }

  .msg { display: flex; gap: 10px; margin-bottom: 18px; }
  .msg-avatar {
    width: 28px; height: 28px; border-radius: 8px; flex: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600;
  }
  .msg.customer .msg-avatar { background: var(--surface-3); color: var(--ink-2); }
  .msg.agent .msg-avatar { background: var(--accent); color: #fff; }
  .msg-body { min-width: 0; flex: 1; }
  .msg-meta { font-size: 10.5px; color: var(--faint); margin-bottom: 5px; display: flex; align-items: center; gap: 7px; }
  .msg-bubble {
    font-size: 13px; line-height: 1.75; padding: 11px 14px; border-radius: 11px;
    background: var(--surface); border: 1px solid var(--border); color: var(--ink-2);
    box-shadow: var(--shadow); white-space: pre-wrap;
  }
  .msg.agent .msg-bubble { background: var(--accent-soft); border-color: var(--accent-line); color: var(--ink); }
  .msg-status { font-size: 10.5px; margin-top: 6px; display: flex; align-items: center; gap: 6px; }

  .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }
  .dot.warn { background: var(--warn); } .dot.idle { background: var(--border-2); }

  .chip {
    font-size: 10.5px; padding: 2px 8px; border-radius: 999px; flex: none;
    background: var(--surface-2); border: 1px solid var(--border); color: var(--ink-2);
    white-space: nowrap; letter-spacing: .01em;
  }
  .chip.ok { color: var(--ok); background: var(--ok-soft); border-color: color-mix(in srgb, var(--ok) 25%, transparent); }
  .chip.bad { color: var(--bad); background: var(--bad-soft); border-color: color-mix(in srgb, var(--bad) 25%, transparent); }
  .chip.warn { color: var(--warn); background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 25%, transparent); }
  .chip.accent { color: var(--accent); background: var(--accent-soft); border-color: var(--accent-line); }

  /* 处理进度 */
  .progress { margin: 6px 0 24px; }
  .progress-label { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); margin-bottom: 12px; }
  .p-steps { display: flex; align-items: flex-start; }
  .p-step { flex: 1; display: flex; flex-direction: column; align-items: center; position: relative; min-width: 0; }
  .p-step::before {
    content: ""; position: absolute; top: 11px; left: -50%; width: 100%; height: 2px;
    background: var(--surface-3);
  }
  .p-step:first-child::before { display: none; }
  .p-step.done::before { background: var(--accent); }
  .p-step.bad::before { background: var(--bad); }
  .p-dot {
    width: 22px; height: 22px; border-radius: 50%; background: var(--surface);
    border: 2px solid var(--surface-3); position: relative; z-index: 1;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; color: var(--faint);
  }
  .p-step.done .p-dot { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .p-step.done.ok .p-dot { background: var(--accent); color: #fff; }
  .p-step.done.warn .p-dot { border-color: var(--warn); color: var(--warn); background: var(--warn-soft); }
  .p-step.done.bad .p-dot { border-color: var(--bad); color: var(--bad); background: var(--bad-soft); }
  .p-step.bad::before { background: var(--bad); }
  .p-name { font-size: 10.5px; color: var(--muted); margin-top: 7px; text-align: center; }
  .p-step.done .p-name { color: var(--ink-2); }
  .p-step.skip .p-name { color: var(--faint); }
  .p-state { font-size: 9.5px; margin-top: 2px; }
  .p-step.done.ok .p-state { color: var(--ok); }
  .p-step.done.warn .p-state { color: var(--warn); }
  .p-step.done.bad .p-state { color: var(--bad); }
  .p-step.skip .p-state { color: var(--faint); }

  .composer {
    flex: none; padding: 12px 22px 16px; border-top: 1px solid var(--border); background: var(--surface);
  }
  .composer-inner { max-width: 760px; margin: 0 auto; }
  .composer-row { display: flex; gap: 9px; align-items: flex-end; }
  textarea {
    width: 100%; background: var(--surface); color: var(--ink);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 9px 12px; font: 12.5px/1.6 var(--sans); resize: none; min-height: 42px; max-height: 120px;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  textarea::placeholder { color: var(--faint); }
  .btn {
    border-radius: 9px; font-size: 12.5px; padding: 8px 16px; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface); color: var(--ink-2);
    display: inline-flex; align-items: center; gap: 6px; transition: all .12s; flex: none;
  }
  .btn:hover { border-color: var(--border-2); background: var(--surface-2); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
  .btn:disabled { opacity: .5; cursor: default; }
  .composer-hint { font-size: 10.5px; color: var(--faint); margin-top: 7px; }

  /* ── 处理建议面板 ── */
  .panel {
    background: var(--surface); border-left: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .p-head {
    flex: none; display: flex; align-items: center; gap: 8px;
    padding: 13px 16px; border-bottom: 1px solid var(--border);
  }
  .p-title { font-size: 13px; font-weight: 650; }
  .icon-btn {
    width: 28px; height: 28px; border: none; background: none; border-radius: 7px;
    color: var(--muted); cursor: pointer; display: flex; align-items: center; justify-content: center; flex: none;
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--ink); }
  .icon-btn svg { width: 14px; height: 14px; }
  .p-scroll { flex: 1; overflow-y: auto; padding: 16px; }

  .verdict-banner {
    border-radius: 11px; padding: 14px 16px; margin-bottom: 14px;
    border: 1px solid var(--border); background: var(--surface-2);
  }
  .verdict-banner.ok { background: var(--ok-soft); border-color: color-mix(in srgb, var(--ok) 25%, transparent); }
  .verdict-banner.warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 25%, transparent); }
  .verdict-banner.bad { background: var(--bad-soft); border-color: color-mix(in srgb, var(--bad) 25%, transparent); }
  .vb-status { font-size: 16px; font-weight: 700; letter-spacing: -.01em; }
  .verdict-banner.ok .vb-status { color: var(--ok); }
  .verdict-banner.warn .vb-status { color: var(--warn); }
  .verdict-banner.bad .vb-status { color: var(--bad); }
  .vb-sub { font-size: 11.5px; color: var(--muted); margin-top: 5px; line-height: 1.6; }

  .p-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 11px;
    padding: 13px 15px; margin-bottom: 12px; box-shadow: var(--shadow);
  }
  .p-card-title { font-size: 11px; font-weight: 600; letter-spacing: .06em; color: var(--muted); margin-bottom: 10px; display: flex; align-items: center; gap: 7px; }
  .p-row { display: flex; align-items: baseline; gap: 12px; padding: 6px 0; font-size: 12.5px; }
  .p-row-k { color: var(--muted); flex: none; font-size: 11.5px; }
  .p-row-v { margin-left: auto; text-align: right; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .p-row-v.big { font-size: 16px; font-weight: 700; color: var(--ink); }
  .p-note { font-size: 11.5px; color: var(--muted); line-height: 1.7; margin-top: 6px; }
  .p-list { margin-top: 4px; }
  .p-list-item { font-size: 12px; color: var(--ink-2); line-height: 1.7; padding: 6px 0; border-bottom: 1px dashed var(--border); }
  .p-list-item:last-child { border-bottom: none; }
  .p-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .p-reply {
    font-size: 12.5px; line-height: 1.8; color: var(--ink-2);
    background: var(--surface-2); border-radius: 9px; padding: 11px 13px;
  }
  .p-card-foot { display: flex; align-items: center; gap: 8px; margin-top: 10px; }

  .empty { padding: 60px 24px; text-align: center; }
  .empty-t { font-size: 14px; font-weight: 600; margin-top: 10px; }
  .empty-s { font-size: 12px; color: var(--muted); margin-top: 8px; line-height: 1.7; }
  .loading { color: var(--faint); font-size: 12px; padding: 16px 0; }

  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    background: var(--surface); border: 1px solid var(--bad); color: var(--bad);
    padding: 9px 17px; border-radius: 9px; font-size: 12px; display: none; z-index: 99; max-width: 76%;
    box-shadow: 0 8px 28px rgb(0 0 0 / 12%);
  }
  .toast.ok { border-color: var(--ok); color: var(--ok); }

  /* 单文件演示横幅（构建脚本注入 .demo-banner 节点，样式在此） */
  .demo-banner {
    grid-column: 1 / -1;
    background: var(--accent-soft); border-bottom: 1px solid var(--accent-line);
    color: var(--accent); font-size: 11.5px; padding: 7px 16px;
    display: flex; gap: 9px; align-items: center; flex-wrap: wrap;
  }
  .demo-banner b { font-weight: 650; }
  .demo-banner code { font-family: var(--mono); font-size: 10.5px; background: color-mix(in srgb, var(--accent) 12%, transparent); padding: 1px 6px; border-radius: 4px; }

  @media (max-width: 1280px) {
    .app, .app.no-panel { grid-template-columns: 58px 240px minmax(0, 1fr) 360px; }
  }
  @media (max-width: 1120px) {
    .app, .app.no-panel { grid-template-columns: 58px 240px minmax(0, 1fr); }
    .panel { display: none; }
  }
  @media (max-width: 860px) {
    .app, .app.no-panel { grid-template-columns: 58px minmax(0, 1fr); }
    .queue { display: none; }
  }
</style>
</head>
<body>

<div class="app">

  <!-- ── 图标轨 ── -->
  <aside class="rail">
    <div class="rail-logo">售</div>
    <button class="rail-btn" id="btn-theme" title="浅色 / 深色">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/></svg>
    </button>
    <button class="rail-btn" id="btn-panel-toggle" title="收起 / 展开处理建议">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg>
    </button>
  </aside>

  <!-- ── 会话队列 ── -->
  <aside class="queue">
    <div class="q-head">
      <span class="q-title">会话队列</span>
      <span class="q-count" id="queue-count">8</span>
      <span class="spacer"></span>
      <button class="icon-btn" id="btn-refresh" title="重新处理全部会话">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v4h-4"/></svg>
      </button>
    </div>
    <div class="q-stats" id="queue-stats"></div>
    <div class="q-list" id="conv-list"><div class="loading">正在载入演示会话…</div></div>
    <div class="q-foot">
      <details class="q-settings" id="demo-settings">
        <summary>演示设置</summary>
        <div class="q-settings-body">
          <div class="p-card-title" style="margin-bottom:4px">判定方式</div>
          <label class="opt"><input type="radio" name="mode" value="offline" checked> 规则引擎（离线演示）</label>
          <label class="opt"><input type="radio" name="mode" value="model"> 智能模型（需可用密钥）</label>
          <label class="sw" style="margin-top:12px"><input type="checkbox" id="opt-approve" checked><span class="sw-track"></span>自动确认待确认项</label>
          <label class="sw"><input type="checkbox" id="opt-noreviewer"><span class="sw-track"></span>关闭合规复核（对照演示）</label>
          <div class="mode-note" id="mode-note"></div>
        </div>
      </details>
    </div>
  </aside>

  <!-- ── 对话流 ── -->
  <main class="conv">
    <header class="conv-head" id="conv-head"></header>
    <div class="conv-scroll" id="conv-scroll">
      <div class="conv-inner" id="conv-body"></div>
    </div>
    <div class="composer">
      <div class="composer-inner">
        <div class="composer-row">
          <textarea id="ask-text" placeholder="粘贴客户的一句原话，回车即可处理（例如：我8月8号买的那把椅子颜色跟图片差太多了要退钱）"></textarea>
          <button class="btn btn-primary" id="btn-ask">处理</button>
        </div>
        <div class="composer-hint">回车发送 · Shift+回车换行 · 演示会话的数据均为合成数据</div>
      </div>
    </div>
  </main>

  <!-- ── 处理建议 ── -->
  <aside class="panel" id="panel">
    <div class="p-head">
      <span class="p-title">处理建议</span>
      <span class="spacer"></span>
      <span class="chip" id="panel-mode-chip">规则引擎</span>
      <button class="icon-btn" id="btn-panel-close" title="收起面板">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 5l14 14M19 5 5 19"/></svg>
      </button>
    </div>
    <div class="p-scroll" id="panel-body">
      <div class="empty">
        <div class="empty-t">还没有选择会话</div>
        <div class="empty-s">从左侧会话队列点一个演示会话，<br>或直接在下方输入客户的一句原话。</div>
      </div>
    </div>
  </aside>

</div><!-- /.app -->

<div class="toast" id="toast"></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const state = {
  boot: null, cache: {}, current: null, selected: null, busy: false,
};

/* 运行模式单选 → 是否走离线规则。会话回放、新咨询都必须读这一个值，
   否则界面上选了「智能模型」实际还在跑规则版，属于骗人。 */
function modeOffline() {
  const el = document.querySelector('input[name="mode"]:checked');
  return !el || el.value !== "model";
}
/* 缓存键带上模式：同一会话在两种模式下结论可能不同，切模式必须重跑 */
function cacheKey(msgId) {
  return (modeOffline() ? "offline:" : "model:") + msgId;
}

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = (n) => (Number.isFinite(n) && n > 0 ? "¥" + Number(n).toFixed(2) : "");
/* 工具全限定名 → 人话（内部名不允许出现在界面上） */
const ACTION_NAME = {
  "aftersales.decide_refund": "退款处置",
  "aftersales.create_exchange": "换货工单",
  "aftersales.create_return_label": "退货运单",
};
/* 去掉内部规则编号前缀（如 "SR-01："），只留人话 */
const plain = (s) => String(s ?? "").replace(/^[A-Z]{1,3}-\d+[:：]?\s*/, "");
/* ── 文本净化：所有自由文本渲染前必须过这一层 ──
   引擎的说明文字里会带工具全限定名（aftersales.xxx）、内部枚举
   （APPROVE / PENDING_APPROVAL / AM-01 等），这些都是对内的工程语言，
   一个都不允许漏到使用者界面上。 */
function sanitize(s) {
  return plain(String(s ?? "")
    .replace(/aftersales\.\w+/g, (m) => ACTION_NAME[m] || "处置动作")
    .replace(/PENDING_APPROVAL/g, "待人工审批")
    .replace(/APPROVED/g, "已批准")
    .replace(/REJECTED/g, "已驳回")
    .replace(/PENDING/g, "待审批")
    .replace(/REJECT_FACT_CONFLICT/g, "信息与记录不符")
    .replace(/REJECT_AMOUNT/g, "退款金额超出实付")
    .replace(/REJECT_STAGE_VIOLATION/g, "处理流程不符")
    .replace(/REJECT_NO_CRITERIA/g, "缺少判断依据")
    .replace(/REJECT_MISSING_EVIDENCE/g, "关键凭证缺失")
    .replace(/WARN_AMBIGUOUS/g, "有不确定项")
    .replace(/CLARIFY_NEEDED/g, "需补充信息")
    .replace(/NEED_MORE_INFO/g, "需补充信息")
    .replace(/\bAPPROVE\b/g, "升级人工审批")
    .replace(/\bEXECUTE\b/g, "自动执行")
    .replace(/\bASK\b/g, "执行前确认")
    .replace(/\bAUTO\b/g, "无需审批")
    .replace(/[A-Z]{1,3}-\d+/g, ""))
    .replace(/[，。；：\s]{2,}/g, (m) => m[0]);
}

/* ── 术语映射：内部枚举 → 使用者语言 ── */
const VERDICT_TEXT = {
  PASS: { t: "复核通过", tone: "ok" },
  WARN_AMBIGUOUS: { t: "基本通过，有不确定项", tone: "warn" },
  CLARIFY_NEEDED: { t: "需补充信息", tone: "warn" },
  REJECT_FACT_CONFLICT: { t: "未通过：信息与记录不符", tone: "bad" },
  REJECT_AMOUNT: { t: "未通过：退款金额超出实付", tone: "bad" },
  REJECT_STAGE_VIOLATION: { t: "未通过：处理流程不符", tone: "bad" },
  REJECT_NO_CRITERIA: { t: "未通过：缺少判断依据", tone: "bad" },
  REJECT_MISSING_EVIDENCE: { t: "未通过：关键凭证缺失", tone: "bad" },
};
const TIER_TEXT = {
  EXECUTE: "已自动处理",
  ASK: "已确认后处理",
  APPROVE: "待人工审批",
  AUTO: "无需审批",
};
const DECISION_TEXT = {
  REFUND: "建议退款",
  EXCHANGE: "建议换货",
  INQUIRY: "物流查询",
  NEED_MORE_INFO: "需补充信息",
};
const SOURCE_TEXT = {
  orders: "订单", refunds: "退款单", sku_specs: "商品规格",
  logistics: "物流", tickets: "工单记录", action: "处置动作",
};
const PATH_TEXT = { full: "完整核查", light: "快速处理", clarify: "待澄清" };
const STEPS = ["理解需求", "核实订单", "拟定方案", "合规复核", "审批确认", "回复客户"];

function verdictText(v) {
  return VERDICT_TEXT[v] || { t: "复核完成", tone: "ok" };
}
/* 会话状态：列表徽章、对话头、状态横幅共用 */
function convStatus(r) {
  const v = r.review.verdict;
  if (v === "CLARIFY_NEEDED") return { t: "待补充信息", tone: "warn" };
  if (String(v).startsWith("REJECT")) return { t: "已拦截", tone: "bad" };
  if (r.auth && r.auth.tier === "APPROVE") return { t: "待人工审批", tone: "warn" };
  if (v === "WARN_AMBIGUOUS") return { t: "已处理 · 有提醒", tone: "warn" };
  return { t: "已处理", tone: "ok" };
}
function stepStates(r) {
  const clarify = r.review.verdict === "CLARIFY_NEEDED";
  const blocked = String(r.review.verdict).startsWith("REJECT");
  const reviewTone = blocked ? "bad" : r.review.verdict === "WARN_AMBIGUOUS" ? "warn" : "ok";
  return [
    { name: STEPS[0], state: "done", tone: "ok", label: "已完成" },
    { name: STEPS[1], state: clarify ? "skip" : "done", tone: "ok", label: clarify ? "未进行" : "已核实" },
    { name: STEPS[2], state: clarify ? "skip" : "done", tone: "ok", label: clarify ? "未进行" : "已拟定" },
    { name: STEPS[3], state: "done", tone: reviewTone, label: verdictText(r.review.verdict).t },
    { name: STEPS[4], state: clarify || blocked ? "skip" : "done", tone: "ok", label: clarify || blocked ? "未进入" : (r.auth ? TIER_TEXT[r.auth.tier] || "已确认" : "已确认") },
    { name: STEPS[5], state: "done", tone: "ok", label: "已回复" },
  ];
}

function toast(msg, ok) {
  const t = $("toast");
  t.textContent = msg;
  t.className = "toast" + (ok ? " ok" : "");
  t.style.display = "block";
  clearTimeout(t._h);
  t._h = setTimeout(() => (t.style.display = "none"), 3600);
}

async function api(path, body) {
  /* __DEMO_TRANSPORT__ */
  const res = await fetch(path, {
    method: body ? "POST" : "GET",
    headers: { "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || "请求失败");
  return data;
}

/* ── 主题 ── */
(function initTheme() {
  const saved = localStorage.getItem("aftersales-theme");
  if (saved) document.documentElement.dataset.theme = saved;
})();
$("btn-theme").addEventListener("click", () => {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  localStorage.setItem("aftersales-theme", next);
});

/* ── 面板收合 ── */
$("btn-panel-toggle").addEventListener("click", () => {
  document.querySelector(".app").classList.toggle("no-panel");
});
$("btn-panel-close").addEventListener("click", () => {
  document.querySelector(".app").classList.add("no-panel");
});

/* ── 启动 ── */
async function boot() {
  // 单文件演示模式：引擎没挂上时把真实原因抛出来，别让它退化成 fetch(file://) 的网络错误
  if (window.__ENGINE_ERROR__) {
    throw new Error("页内引擎启动失败：" + (window.__ENGINE_ERROR__.message || window.__ENGINE_ERROR__));
  }
  state.boot = await api("/api/bootstrap");
  const c = state.boot;
  $("mode-note").textContent = c.mode === "model"
    ? "已检测到可用密钥，演示设置里可切到智能模型判定。"
    : "未检测到可用密钥，当前为规则引擎演示；配置密钥并重启服务后可切换。";
  $("panel-mode-chip").textContent = modeOffline() ? "规则引擎" : "智能模型";
  await warmUp();
  renderQueue();
  // 默认打开内容最全的第一个会话，窗口落地即有内容可看
  selectConv(c.samples[0].msg_id);
}

/* 预热：8 个演示会话各处理一遍（固定规则引擎，保证首屏确定可复现），队列直接带出状态 */
async function warmUp() {
  const c = state.boot;
  const results = await Promise.all(c.samples.map((s) =>
    api("/api/run", { msgId: s.msg_id, offline: true, autoApproveAsk: true }).catch(() => null)));
  state.cache = {};
  results.forEach((r, i) => {
    if (r) state.cache["offline:" + c.samples[i].msg_id] = r.result;
  });
}
$("btn-refresh").addEventListener("click", async () => {
  $("conv-list").innerHTML = '<div class="loading">正在重新处理…</div>';
  await warmUp();
  renderQueue();
  if (state.selected) selectConv(state.selected, true);
  toast("已重新处理全部演示会话", true);
});

/* ── 会话队列 ── */
function renderQueue() {
  const c = state.boot;
  const stats = { clarify: 0, approval: 0, blocked: 0, done: 0 };
  c.samples.forEach((s) => {
    const r = state.cache["offline:" + s.msg_id];
    if (!r) return;
    const st = convStatus(r);
    if (st.t === "待补充信息") stats.clarify++;
    else if (st.t === "待人工审批") stats.approval++;
    else if (st.t === "已拦截") stats.blocked++;
    else stats.done++;
  });
  $("queue-count").textContent = c.samples.length;
  $("queue-stats").innerHTML = `
    <div class="q-stat tone-ok"><b>${stats.done}</b><span>已处理</span></div>
    <div class="q-stat tone-warn"><b>${stats.approval}</b><span>待人工审批</span></div>
    <div class="q-stat tone-bad"><b>${stats.blocked}</b><span>已拦截</span></div>
    <div class="q-stat tone-warn"><b>${stats.clarify}</b><span>待补充信息</span></div>`;

  $("conv-list").innerHTML = c.samples.map((s) => {
    const r = state.cache[cacheKey(s.msg_id)];
    const st = r ? convStatus(r) : null;
    return `<button class="crow ${state.selected === s.msg_id ? "active" : ""}" data-msg="${esc(s.msg_id)}">
      <div class="crow-top">
        <span class="dot ${st ? st.tone : "idle"}"></span>
        <span class="crow-title">${esc(s.display || s.title)}</span>
        <span class="spacer"></span>
        ${st ? `<span class="chip ${st.tone}">${st.t}</span>` : '<span class="chip">待处理</span>'}
      </div>
      <div class="crow-snip">${esc(s.text || "")}</div>
    </button>`;
  }).join("");
  $("conv-list").querySelectorAll(".crow").forEach((b) =>
    b.addEventListener("click", () => selectConv(b.dataset.msg)));
}

async function selectConv(msgId, force) {
  state.selected = msgId;
  renderQueue();
  let r = state.cache[cacheKey(msgId)];
  if (!r || force) {
    renderConversationShell("正在处理…");
    try {
      r = (await api("/api/run", { msgId, offline: modeOffline(), autoApproveAsk: $("opt-approve").checked })).result;
      state.cache[cacheKey(msgId)] = r;
    } catch (e) { toast(e.message); return; }
  }
  state.current = r;
  renderConversation(r);
  renderPanel(r);
}

/* ── 对话流 ── */
function renderConversationShell(loadingText) {
  const s = state.boot.samples.find((x) => x.msg_id === state.selected);
  $("conv-head").innerHTML = `
    <span class="conv-title">${esc(s ? (s.display || s.title) : "新咨询")}</span>
    <span class="chip">${loadingText}</span>`;
  $("conv-body").innerHTML = `<div class="loading">${esc(loadingText)}</div>`;
}

function renderConversation(r) {
  const s = state.boot.samples.find((x) => x.msg_id === r.msg_id);
  const st = convStatus(r);
  $("conv-head").innerHTML = `
    <span class="conv-title">${esc(s ? (s.display || s.title) : "新咨询")}</span>
    <span class="chip ${st.tone}">${st.t}</span>
    ${r.classification ? `<span class="chip">${esc(r.classification.case_name)}</span>` : ""}
    ${s ? "" : '<span class="chip accent">临时咨询</span>'}`;

  const steps = stepStates(r);
  const progress = `
    <div class="progress">
      <div class="progress-label">处理进度</div>
      <div class="p-steps">${steps.map((sp) => `
        <div class="p-step ${sp.state}${sp.state === "done" ? " " + sp.tone : ""}">
          <div class="p-dot">${sp.state === "done" ? (sp.tone === "bad" ? "✕" : sp.tone === "warn" ? "!" : "✓") : "–"}</div>
          <div class="p-name">${esc(sp.name)}</div>
          <div class="p-state">${esc(sp.label)}</div>
        </div>`).join("")}
      </div>
    </div>`;

  $("conv-body").innerHTML = `
    <div class="msg customer">
      <div class="msg-avatar">客户</div>
      <div class="msg-body">
        <div class="msg-meta">客户原话</div>
        <div class="msg-bubble">${esc(r.text)}</div>
      </div>
    </div>
    <div class="msg agent">
      <div class="msg-avatar">Agent</div>
      <div class="msg-body">
        <div class="msg-meta">售后 Agent · 处理结果 <span class="chip ${st.tone}">${st.t}</span></div>
        <div class="msg-bubble">${esc(sanitize(r.reply.customer_text))}</div>
        <div class="msg-status">
          <span class="dot ${st.tone}"></span>
          <span style="color:var(--muted);font-size:11.5px">${esc(statusLine(r))}</span>
        </div>
      </div>
    </div>
    ${progress}`;
  $("conv-scroll").scrollTop = 0;
}
function statusLine(r) {
  const st = convStatus(r);
  if (st.t === "已拦截") return "该请求未通过合规复核，未执行任何处置动作，建议按右侧意见与客户确认。";
  if (st.t === "待人工审批") return "涉及金额超出自动处理范围，已转人工审批，审批通过前不会执行。";
  if (st.t === "待补充信息") return "客户诉求不明确，已发出追问，暂未进入核查与处置。";
  if (r.reply.follow_up_required) return "已处理完成，存在需要人工跟进的事项。";
  return "已处理完成，回复已生成，可复制后发送给客户。";
}

/* ── 处理建议面板 ── */
function renderPanel(r) {
  const st = convStatus(r);
  const v = verdictText(r.review.verdict);
  const j = r.judge, a = r.auth, u = r.understanding;

  const amount = (Number.isFinite(j.amount) && j.amount > 0) ? money(j.amount) : "";
  const actionText = DECISION_TEXT[j.decision] || "";
  const bannerSub = {
    ok: "已按售后流程处理完成，可核对右侧建议后回复客户。",
    warn: st.t === "待人工审批"
      ? "涉及金额超出自动处理范围，已挂起等待人工审批，审批通过前不执行。"
      : "已处理，但存在需要留意的不确定项，建议人工过目。",
    bad: "该请求被合规复核拦下，未执行任何处置动作。",
  }[st.tone];

  const head = `
    <div class="verdict-banner ${st.tone}">
      <div class="vb-status">${st.t}${amount && st.tone !== "bad" ? " · " + actionText + " " + amount : ""}</div>
      <div class="vb-sub">${esc(bannerSub)}</div>
    </div>`;

  const decisionRows = [];
  if (actionText) decisionRows.push(row("建议动作", esc(actionText)));
  if (amount) decisionRows.push(row("涉及金额", `<span class="p-row-v big">${amount}</span>`));
  if (r.classification) decisionRows.push(row("会话类型", esc(r.classification.case_name)));
  if (r.classification && r.classification.sop_path) decisionRows.push(row("处理流程", esc(PATH_TEXT[r.classification.sop_path] || r.classification.sop_path)));
  if (j.rationale) decisionRows.push(`<div class="p-note">${esc(sanitize(j.rationale))}</div>`);

  const evidenceChips = (r.evidence_sources || []).map((s) =>
    `<span class="chip ok">✓ ${esc(SOURCE_TEXT[s] || s)}</span>`).join("");
  const requeryNote = r.requery_rounds
    ? `<div class="p-note">首轮核实后按合规复核意见补充了凭证（${(r.requery_tools || []).length} 项），再作判断。</div>` : "";
  const orderLine = (u && u.order_id) ? row("关联订单", `<span class="p-row-v" style="font-family:var(--mono);font-size:11.5px">${esc(u.order_id)}</span>`) : "";

  const findings = (r.review.findings || []).map((f) =>
    `<div class="p-list-item">${esc(sanitize(f.because))}</div>`).join("");
  const risks = []
    .concat((j.conflicts || []).map((x) => ({ t: x, tone: "bad" })))
    .concat((j.ambiguous || []).map((x) => ({ t: x, tone: "warn" })));
  const riskList = risks.map((x) => `<div class="p-list-item" style="color:var(--${x.tone})">${esc(sanitize(x.t))}</div>`).join("");
  const stageViolations = (r.review.stage_violations || []).map((x) =>
    `<div class="p-list-item" style="color:var(--bad)">${esc(sanitize(x))}</div>`).join("");

  const authCard = a ? `
    <div class="p-card">
      <div class="p-card-title">审批</div>
      ${row("当前状态", `<span class="p-row-v" style="color:var(--${a.tier === "APPROVE" ? "warn" : "ok"});font-weight:600">${esc(TIER_TEXT[a.tier] || a.tier)}</span>`)}
      ${a.because ? row("分档说明", esc(sanitize(a.because))) : ""}
      ${a.approver ? row("审批记录", `${esc(a.approver)} · ${esc(sanitize(a.approval_decision))}`) : ""}
      ${r.executed_tool ? row("已执行", `<span class="chip">${esc(actionName(r.executed_tool))}</span>`) : ""}
    </div>` : `
    <div class="p-card">
      <div class="p-card-title">审批</div>
      ${row("当前状态", '<span class="p-row-v" style="color:var(--muted)">未进入审批环节</span>')}
      <div class="p-note">${esc(sanitize(r.execution_outcome || "本案在审批前已结束。"))}</div>
    </div>`;

  $("panel-body").innerHTML = `
    ${head}
    <div class="p-card">
      <div class="p-card-title">处理结论</div>
      ${decisionRows.join("")}
    </div>
    <div class="p-card">
      <div class="p-card-title">核实依据</div>
      <div class="p-tags">${evidenceChips || '<span class="p-note">本案未进入订单核实环节。</span>'}</div>
      ${orderLine}${requeryNote}
    </div>
    <div class="p-card">
      <div class="p-card-title">合规复核 <span class="chip ${v.tone}">${v.t}</span></div>
      ${findings || '<div class="p-note">未触发复核规则。</div>'}
      ${riskList}${stageViolations}
    </div>
    ${authCard}
    <div class="p-card">
      <div class="p-card-title">建议回复</div>
      <div class="p-reply">${esc(sanitize(r.reply.customer_text))}</div>
      <div class="p-card-foot">
        <button class="btn" id="btn-copy-reply">复制回复</button>
        ${r.reply.follow_up_required ? '<span class="chip warn">需人工跟进</span>' : '<span class="chip ok">无需跟进</span>'}
        <span class="spacer"></span>
        <span class="p-note" style="margin:0">${esc(r.reply.internal_note ? sanitize(r.reply.internal_note).slice(0, 60) : "")}</span>
      </div>
    </div>`;

  $("btn-copy-reply").addEventListener("click", async () => {
    const text = sanitize(r.reply.customer_text);
    try {
      await navigator.clipboard.writeText(text);
      toast("回复已复制，可直接粘贴发送", true);
    } catch {
      const ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      let ok = false;
      try { ok = document.execCommand("copy"); } catch {}
      ta.remove();
      toast(ok ? "回复已复制，可直接粘贴发送" : "浏览器限制了复制，请手动选择文本复制", ok);
    }
  });
}
function row(k, v) { return `<div class="p-row"><span class="p-row-k">${k}</span><span class="p-row-v">${v}</span></div>`; }
/* 工具全限定名 → 人话（只在这一处出现，且不进界面） */
function actionName(fq) {
  const map = {
    "aftersales.decide_refund": "退款处置",
    "aftersales.create_exchange": "换货工单",
    "aftersales.create_return_label": "退货运单",
  };
  return map[fq] || String(fq).split(".").pop();
}

/* ── 新咨询 ── */
async function runAsk() {
  const text = $("ask-text").value.trim();
  if (!text) return toast("先输入客户的一句原话");
  state.selected = null;
  renderQueue();
  renderConversationShell("正在处理…");
  $("panel-body").innerHTML = '<div class="loading">正在生成处理建议…</div>';
  try {
    const r = (await api("/api/run", {
      text,
      offline: modeOffline(),
      autoApproveAsk: $("opt-approve").checked,
      disableReviewer: $("opt-noreviewer").checked,
    })).result;
    state.current = r;
    renderConversation(r);
    renderPanel(r);
    $("ask-text").value = "";
  } catch (e) { toast(e.message); }
}
$("btn-ask").addEventListener("click", runAsk);
$("ask-text").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); runAsk(); }
});

/* ── 切判定方式：缓存作废，当前会话按新模式重跑 ── */
document.querySelectorAll('input[name="mode"]').forEach((r) =>
  r.addEventListener("change", () => {
    state.cache = {};
    $("panel-mode-chip").textContent = modeOffline() ? "规则引擎" : "智能模型";
    renderQueue();
    if (state.selected) selectConv(state.selected, true);
  }),
);

boot().catch((e) => toast("启动失败：" + e.message));
</script>
</body>
</html>
