    intent: u.intent,
  });

  // ═══ 环节二 · 分类 ═════════════════════════════════════════════
  const cls = classify(u.intent.case_type, u.intent.order_id, store, sop);
  trace.append("accept", "classify", `分类结果：${cls.case_name}（${cls.sop_path} 路径）`, {
    classification: cls,
    why: cls.because,
  });

  const order = store.orders.find((o) => o.order_id === u.intent.order_id) ?? null;
  const refund = order ? store.refunds.find((r) => r.order_id === order.order_id) ?? null : null;

  const ctx = {
    order,
    refund,
    fetched: new Map                     (),
    created: []                                                       ,
  };

  const evidence                                                       = {};
  let judge          ;
  let rv              ;
  let requeryRounds = 0;
  const requeryTools           = [];
  /** 本次召回的历史同类案件（函数级：结果里要一并交给界面展示） */
  let memHits              = [];

  // ═══ 诉求不明：按 SOP 只追问，不进取证与判责 ═══════════════════
  // （simulateStageViolation 是负向验证开关：强行绕过本分支，让 Reviewer 去拦阶段违规）
  if (cls.sop_path === "clarify" && !opts.simulateStageViolation) {
    judge = judgeOffline({
      case_name: cls.case_name,
      case_type: cls.case_type,
      refund: null,
      evidence: {},
      policy,
    });
    rv = opts.disableReviewer
      ? ablateReviewer(trace)
      : review({
          refund: null,
          order: null,
          evidence: {},
          judge,
          policy,
          classification: cls,
          stages_completed: stages,
        });
    trace.append("accept", "review", `Reviewer 裁决：${rv.verdict}`, {
      findings: rv.findings,
      stage_violations: rv.stage_violations,
    });
  } else {
    // ═══ 环节三 · 取证：按环节装配，只读工具 ════════════════════
    stages.push("investigate");
    const evidenceTools = assemble(tools, "investigate");
    if (evidenceTools.some((t) => !t.readOnly)) {
      throw new Error("装配越界：取证环节出现了可执行工具");
    }
    trace.append("investigate", "plan", `取证环节装配：${evidenceTools.length} 个只读工具`, {
      assembled_tools: evidenceTools.map((t) => t.name),
      note: "取证环节的装配里不含任何可执行工具",
    });

    const fetchInto = (sources              , why        ) => {
      for (const s of sources) {
        trace.checkpoint();
        // 预算只掐「取证」这类读操作，绝不掐处置动作 —— 资金动作被预算挡住会出现
        // 「案子判了但没执行」的半成品，比慢一点危险得多。
        if (budget.tool_calls >= budget.tool_limit) {
          trace.append("investigate", "plan", `工具调用已达预算上限（${budget.tool_limit} 次），停止继续取证`, {
            tool_calls: budget.tool_calls,
            tool_limit: budget.tool_limit,
            stopped_at: why,
          });
          return;
        }
        const t = tools.find((x) => x.source === s && evidenceTools.includes(x));
        if (!t) throw new Error(`来源 ${s} 的工具在当前环节不可见`);
        const args = argsFor(s, ctx, msg);
        budget.tool_calls += 1;
        const { record, payload } = invoke(t, args, ctx);
        if (!payload) {
          trace.append("investigate", "tool_call", `${t.name} 未取到数据（${why}）`, { args: record.args });
          continue;
        }
        evidence[s] = record.fields_snapshot;
        ctx.fetched.set(s, payload);
        trace.append("investigate", "tool_call", `${t.name} 取数成功（${why}）`, {
          tool: t.name,
          args: record.args,
          args_hash: record.args_hash,
          fields_snapshot: record.fields_snapshot,
        });
      }
    };

    const firstRound = cls.required_sources.filter((s) => CONSERVATIVE.includes(s));
    fetchInto(firstRound, "首轮保守集");

    // ═══ 环节四 · 判责（三层上下文按需展开）══════════════════════
    const contextBundle = buildContext({
      phase: "judge",
      tools,
      policy,
      relevant_fields: cls.required_sources,
      progress: `已取证 ${Object.keys(evidence).join(" + ")}`,
    });
    trace.append("judge", "plan", `三层上下文披露：${disclosureStats(contextBundle)}`, {
      phase: "judge",
      layers: contextBundle.layers.map((l) => ({ layer: l.layer, disclosed: l.disclosed, chars: l.content.length })),
    });

    // ═══ 判据之前：翻一遍历史同类案件（只作参考）═════════════════
    // 记忆失败绝不能拖垮一次处置：整段包在 try 里，取不到就当没有经验。
    try {
      memHits = retrieveCases({
        case_type: cls.case_type,
        amount: refund?.applied_amount ?? null,
        text: msg.text,
        exclude_msg_id: msgId,
        limit: 3,
      });
    } catch (e) {
      trace.append("judge", "plan", `历史案件索引不可用，本次不带参考：${(e         ).message}`, {});
    }
    if (memHits.length) {
      trace.append("judge", "plan", `参考历史同类案件 ${memHits.length} 条（advisory：只作提示，不参与判定与授权）`, {
        advisory: true,
        hits: memHits.map((h) => ({
          msg_id: h.msg_id,
          score: Number(h.score.toFixed(2)),
          verdict: h.verdict,
          why: h.why,
        })),
      });
    }
    const judgeContext = contextBundle.rendered + renderMemoryBlock(memHits);

    const useModelJ = !opts.offline && canModel("判据归纳");
    trace.checkpoint();
    judge = await judgeOnce(
      msg,
      cls,
      refund,
      evidence,
      policy,
      judgeContext,
      useModelJ ? opts : { ...opts, offline: true },
    );
    stages.push("judge");
    trace.append("judge", "judge", `判据归纳完成（来源：${judge.judge_source}）`, {
      decision: judge.decision,
      amount: judge.amount,
      // 轨迹回读要用它区分「模型判的」与「规则判的」，别靠 summary 抠字
      judge_source: judge.judge_source,
      criteria: judge.criteria,
      conflicts: judge.conflicts,
      ambiguous: judge.ambiguous,
    });

    // ═══ 只读 Reviewer 复核 ══════════════════════════════════════
    rv = opts.disableReviewer
      ? ablateReviewer(trace)
      : review({ refund, order, evidence, judge, policy, classification: cls, stages_completed: stages });
    if (!opts.disableReviewer) {
      trace.append("judge", "review", `Reviewer 裁决：${rv.verdict}`, {
        // verdict 单独落一份：轨迹回读（案件索引）要按它归类，
        // 从 summary 里正则抠字符串太脆，字段就该是字段
        verdict: rv.verdict,
        findings: rv.findings,
        missing_evidence: rv.missing_evidence,
        stage_violations: rv.stage_violations,
        readonly: rv.readonly,
      });
    }

    // ═══ 补证：Reviewer 提出补查请求 → 取证方照单补 → 再判再审 ════
    // 原先只跑一轮（写死 1）。现在按预算跑：最多 requery_limit 轮，
    // 每轮之前都确认「轮次没超、工具还有余量、模型还能叫」，
    // 任何一项用尽就停下并留痕 —— 停下来的理由必须能被追问，不能悄悄少跑一轮。
    while (rv.missing_evidence.length) {
      trace.checkpoint();
      if (budget.requery_rounds >= budget.requery_limit) {
        trace.append("investigate", "plan", `补证已达轮次上限（${budget.requery_limit} 轮），停止继续补证`, {
          still_missing: rv.missing_evidence,
          requery_rounds: budget.requery_rounds,
        });
        break;
      }
      if (budget.tool_calls >= budget.tool_limit) {
        trace.append("investigate", "plan", "工具调用预算耗尽，停止补证", { still_missing: rv.missing_evidence });
        break;
      }
      budget.requery_rounds += 1;
      requeryRounds = budget.requery_rounds;
      for (const p of rv.requery_plan) if (!requeryTools.includes(p.tool)) requeryTools.push(p.tool);
      trace.append("investigate", "plan", `第 ${budget.requery_rounds} 轮补证：${rv.missing_evidence.join(" + ")}`, {
        requery_plan: rv.requery_plan,
        still_missing: rv.missing_evidence,
      });
      fetchInto(rv.missing_evidence, `第 ${budget.requery_rounds} 轮补证`);
      const useModelJ2 = !opts.offline && canModel("补证后重新归纳");
      judge = await judgeOnce(
        msg,
        cls,
        refund,
        evidence,
        policy,
        judgeContext,
        useModelJ2 ? opts : { ...opts, offline: true },
      );
      trace.append("judge", "judge", `补证后重新归纳判据（来源：${judge.judge_source}）`, {
        decision: judge.decision,
        amount: judge.amount,
        judge_source: judge.judge_source,
        conflicts: judge.conflicts,
        ambiguous: judge.ambiguous,
      });
      if (opts.disableReviewer) break; // 没有复核者就不会再产生补查请求，套娃没有意义
      rv = review({ refund, order, evidence, judge, policy, classification: cls, stages_completed: stages });
      trace.append("judge", "review", `补证后 Reviewer 裁决：${rv.verdict}`, {
        verdict: rv.verdict,
        findings: rv.findings,
        missing_evidence: rv.missing_evidence,
        stage_violations: rv.stage_violations,
      });
    }
  }

  // ═══ 环节五 · 审批：授权闸 + 审批回调回路 ══════════════════════
  let auth                        = null;
  let executedTool                = null;
  let executionOutcome = "";
  // 动作工具与参数在此冻结：停办转人工后，续办必须执行「同一次参数」，
  // 不能重新跑一遍让金额漂移——审批人批的是具体那笔钱，不是一类操作。
  let actionTool                  = null;
  let actionArgs                                 = null;
  let deferred                         = null;

  if (cls.sop_path === "clarify" && !opts.simulateStageViolation) {
    executionOutcome = "诉求不明，按 SOP 未进入审批与执行";
    trace.append("accept", "gate", executionOutcome, { sop_path: cls.sop_path });
  } else if (rv.verdict.startsWith("REJECT")) {
    executionOutcome = `被复核门禁阻断（${rv.verdict}），未进入授权执行`;
    trace.append("approve", "gate", executionOutcome, { verdict: rv.verdict, findings: rv.findings });
  } else if (!cls.money_action) {
    executionOutcome = "无不可逆动作，按 SOP 直接结单";
    trace.append("approve", "gate", executionOutcome, { case_type: cls.case_type });
  } else {
    // 资金动作之前最后一次取消检查点：过了这里就没有回头路了
    trace.checkpoint();
    stages.push("approve");
    const approveTools = assemble(tools, "approve");
    actionTool = approveTools.find((t) => t.name === cls.money_action) ?? null;
    if (!actionTool) throw new Error(`审批环节的装配里缺少动作工具 ${cls.money_action}`);

    trace.append("approve", "plan", "进入审批环节，装配发生变化", {
      assembled_tools: approveTools.map((t) => t.name),
      added: approveTools.filter((t) => !assemble(tools, "investigate").includes(t)).map((t) => t.name),
    });

    auth = classifyAuth(actionTool, judge.amount, policy);
    trace.append("approve", "auth", `授权分档：${auth.tier}（${auth.label}）`, {
      // 档位单独落一份：轨迹回读要按它归类，别去 summary 里正则抠
      tier: auth.tier,
      tool: auth.tool,
      amount: auth.amount,
      threshold: auth.threshold,
      needs_human: auth.needs_human,
      because: auth.because,
    });

    actionArgs =
      actionTool.short === "decide_refund"
        ? {
            refund_id: refund?.refund_id ?? "",
            decision: judge.decision,
            amount: judge.amount,
            criteria_ids: judge.criteria.map((c) => c.id),
          }
        : {
            order_id: order?.order_id ?? "",
            target_spec: String(u.intent.slots["目标规格"] ?? "同款"),
          };

    // 停办转审批的两种触发：
    //   ① 大额（APPROVE 档）—— Agent 本来就无权执行，一律交人；
    //   ② 关闭了「小额自动确认」—— 中额动作不再走「无人响应即挂起」的死路，
    //      而是正经生成审批单进审批中心，让人真的能处置。
    const deferThis = auth.needs_human && opts.deferApproval && (auth.tier === "APPROVE" || opts.autoApproveAsk === false);
    if (deferThis) {
      // 自主模式：不停不等，把这一次的参数冻结成待审批单交回宿主。
      // Agent 到这一步为止已经做完了全部能自己做的事（理解 / 取证 / 判责 / 复核），
      // 剩下的只是「这笔钱该不该出」——那是人的判断，不是 Agent 可以自我授权的。
      const at = new Date().toISOString();
      auth = { ...auth, approver: "待指定审批人", approval_decision: "PENDING", approval_at: at };
      executionOutcome =
        auth.tier === "APPROVE"
          ? "已停办并转入人工审批队列（该金额超出 Agent 自动处置范围）"
          : "已停办并转入人工审批队列（小额自动确认已关闭）";
      trace.append("approve", "gate", executionOutcome, {
        tier: auth.tier,
        pending: true,
        to_approval_center: true,
        agent_authorized: false,
      });
      deferred = buildPendingTicket({
        msgId,
        auth,
        judge,
        rv,
        cls,
        policy,
        text: msg.text,
        evidence,
        requested_at: at,
      });
    } else if (auth.needs_human) {
      const resolver                   =
        opts.approvalResolver ?? {
          kind: "scripted",
          resolve: async () => ({
            approved: opts.autoApproveAsk,
            approver: opts.autoApproveAsk ? "human(脚本自动确认)" : "human(未响应)",
            decision: opts.autoApproveAsk ? "APPROVED" : "PENDING",
          }),
        };
      auth = await requestApproval(auth, resolver, `案件 ${msgId}｜${cls.case_name}`);
      trace.append("approve", "auth", `审批回调结果：${auth.approval_decision}`, {
        // 留痕三件套：审批人 / 决策 / 时间，全部落进行内 detail，供按步回放
        approver: auth.approver,
        approval_decision: auth.approval_decision,
        approval_at: auth.approval_at,
        resolver_kind: resolver.kind,
      });
    }

    if (deferred) {
      // 已转审批中心：本轮到停办为止，不执行、不结单
    } else if (auth.outcome === "AUTO_EXECUTED" || (auth.needs_human === false && auth.tier !== "APPROVE")) {
      const { record } = invoke(actionTool, actionArgs, ctx);
      executedTool = actionTool.name;
      executionOutcome = `授权闸放行并执行 ${actionTool.name}`;
      trace.append("approve", "gate", executionOutcome, {
        tool: actionTool.name,
        args_hash: record.args_hash,
        tier: auth.tier,
      });
    } else {
      executionOutcome =
        auth.tier === "APPROVE"
          ? "挂起等待人工审批（Agent 无权执行）"
          : "挂起等待人工确认（未取得授权，不执行）";
      trace.append("approve", "gate", executionOutcome, {
        tier: auth.tier,
        pending: true,
        agent_authorized: auth.tier !== "APPROVE",
      });
    }
  }

  // ═══ 环节六 · 结单：结果反馈 ═══════════════════════════════════
  const replyInputFor = (finalAuth                       , followUpOverride          ) => ({
    case_type: cls.case_type,
    case_name: cls.case_name,
    text: msg.text,
    verdict: rv.verdict,
    auth: finalAuth,
    review: rv,
    created: ctx.created,
    follow_up_required:
      followUpOverride ??
      (rv.verdict.startsWith("REJECT") ||
        rv.verdict === "WARN_AMBIGUOUS" ||
        rv.verdict === "CLARIFY_NEEDED" ||
        (finalAuth?.needs_human ?? false)),
    logistics_signed: (evidence.logistics?.signed                       ) ?? null,
  });

  const packResult = (
    finalAuth                       ,
    finalExecuted               ,
    finalOutcome        ,
    reply                        ,
  )                => {
    // 先刷盘再读计数：调用方拿到 trace_path 时，文件必须已经写完；
    // trace_writes 也必须包含这一次刷盘，否则数字会少 1
    trace.flush();
    return {
      msg_id: msgId,
      text: msg.text,
      sample_id: null,
      grade: null,
      title: null,
      understanding: { ...u.intent, judge_source: u.judge_source },
      classification: cls,
      evidence_sources: Object.keys(evidence)                ,
      requery_rounds: requeryRounds,
      requery_tools: requeryTools,
      judge,
      review: rv,
      auth: finalAuth,
      executed_tool: finalExecuted,
      execution_outcome: finalOutcome,
      reply,
      stages_completed: [...stages],
      trace_path: resolve(trace.path),
      trace_writes: trace.flush_count,
      budget: { ...budget, degraded: [...budget.degraded] },
      memory_hits: memHits,
    };
  };

  /** 结单：正常路径与「人工审批后续办」路径共用，保证回执口径与留痕位置完全一致 */
  const close = async (
    finalAuth                       ,
    finalExecuted               ,
    finalOutcome        ,
    afterApproval         ,
  )                         => {
    if (!stages.includes("close")) stages.push("close");
    const input = replyInputFor(finalAuth);
    // 回执也吃预算：模型额度用尽时退回确定性回执 ——
    // 不能因为「没预算了」就不给客户答复，那是最差的降级方式。
    const useModelR = !opts.offline && canModel("结单回执", "close");
    const reply = useModelR ? await replyWithModel(input) : replyOffline(input);
    trace.append("close", "reply", afterApproval ? "人工审批后续办完成，结单回执已生成" : "结单回执已生成", {
      customer_text: reply.customer_text,
      internal_note: reply.internal_note,
      follow_up_required: reply.follow_up_required,
      reply_source: reply.reply_source,
      created_docs: ctx.created,
      after_approval: afterApproval,
    });
    return packResult(finalAuth, finalExecuted, finalOutcome, reply);
  };

  // ── 停办：本轮到审批中心为止。给客户一句确定性的过渡回执，不声称任何未完成的结果 ──
  if (deferred) {
    const ticket = deferred;
    const holding = replyOffline(replyInputFor(auth, true));
    const result = packResult(auth, null, executionOutcome, holding);
    return {
      status: "pending",
      result: { ...result, pending_approval: ticket },
      ticket,
      resume: async (approved         , approver        , note        ) => {
        const at = new Date().toISOString();
        const finalAuth               = {
          ...(auth                ),
          approver: approver?.trim() || "未署名审批人",
          approval_decision: approved ? "APPROVED" : "REJECTED",
          approval_at: at,
          outcome: approved ? "AUTO_EXECUTED" : "SKIPPED_BY_GATE",
          needs_human: !approved,
        };
        trace.append("approve", "auth", `人工审批结论：${approved ? "批准" : "驳回"}（审批人 ${finalAuth.approver}）`, {
          approver: finalAuth.approver,
          approval_decision: finalAuth.approval_decision,
          approval_at: at,
          approval_note: note || "",
          ticket_id: ticket.id,
          resolved_by: "human",
        });

        let finalExecuted                = null;
        let finalOutcome        ;
        if (approved) {
          const tool = actionTool            ;
          const { record } = invoke(tool, actionArgs                           , ctx);
          finalExecuted = tool.name;
          finalOutcome = `人工审批通过后执行 ${finalExecuted}（审批人 ${finalAuth.approver}）`;
          trace.append("approve", "gate", finalOutcome, {
            tool: finalExecuted,
            args_hash: record.args_hash,
            tier: finalAuth.tier,
            resolved_by: "human",
          });
        } else {
          finalOutcome = `人工审批驳回，未执行任何处置动作（审批人 ${finalAuth.approver}）`;
          trace.append("approve", "gate", finalOutcome, {
            tier: finalAuth.tier,
            resolved_by: "human",
            approval_note: note || "",
          });
        }
        return close(finalAuth, finalExecuted, finalOutcome, true);
      },
    };
  }

  return { status: "completed", result: await close(auth, executedTool, executionOutcome, false) };
}

/**
 * 审批单号：业务化的「日期-当日序号」，例如 20261015-01。
 * 刻意不用带系统前缀的字符串码——单号是要被客服在群里引用的东西，
 * 长得像一张单据号，而不是一段程序生成的键。
 */
let approvalSeq = 0;

function todayStamp()         {
  const d = new Date();
  return (
    d.getFullYear() +
    String(d.getMonth() + 1).padStart(2, "0") +
    String(d.getDate()).padStart(2, "0")
  );
}

function ticketId()         {
  return todayStamp() + "-" + String(++approvalSeq).padStart(2, "0");
}

/**
 * 用历史单号把当日序号续上。
 *
 * 为什么必须做：单号是「日期-当日序号」，而序号在进程内从 1 数起。
 * 一旦审批单落了盘，重启后再发一张就又变成 `-01`，与台账里那张重号；
 * 回放时「新单被裁决」会连带把旧单一起抹掉 —— 看起来像「重启后单子凭空消失」。
 * 这个 bug 只有把「持久化」和「按单号回放」凑到一起才会出现。
 */
function seedApprovalSeq(existingIds          )       {
  const stamp = todayStamp();
  let max = 0;
  for (const id of existingIds) {
    if (typeof id !== "string" || !id.startsWith(stamp + "-")) continue;
    const n = Number(id.slice(stamp.length + 1));
    if (Number.isFinite(n) && n > max) max = n;
  }
  if (max > approvalSeq) approvalSeq = max;
}

/**
 * 组装一张「能在 15 秒内做出判断」的待审批单。
 *
 * 参照人工审批控制台的四问：为什么停在这里 / 依据是什么 / 我能做什么 / 做完会怎样。
 * `uncertainties` 特意把 Agent 考虑过但不能据此强判的项也列出来——只给结论的审批界面
 * 会把人变成橡皮图章，把备选摊开才谈得上复核。
 */
function buildPendingTicket(args   
                
                     
                  
                   
                      
                 
               
                                                                 
                       
 )                  {
  const { msgId, auth, judge, rv, cls, policy, text, evidence, requested_at } = args;
  const autoLimit = Math.max(
    ...policy.amount_tiers.filter((t) => t.up_to !== null).map((t) => t.up_to          ),
  );
  const isRefund = auth.tool.endsWith("decide_refund");

  const basis           = [];
  for (const c of judge.criteria) basis.push(c.statement);
  const refundRow = evidence.refunds;
  const orderRow = evidence.orders;
  if (refundRow && typeof refundRow.applied_amount === "number") basis.push(`退款申请金额 ¥${refundRow.applied_amount}`);
  if (orderRow && typeof orderRow.paid_amount === "number") basis.push(`订单实付金额 ¥${orderRow.paid_amount}`);
  const lg = evidence.logistics;
  if (lg) {
    basis.push(
      lg.signed
        ? `物流状态：已签收（签收人 ${String(lg.signer ?? "未知")}）`
        : "物流状态：尚未签收",
    );
  }

  const uncertainties = Array.from(
    new Set([
      ...judge.ambiguous,
      ...rv.findings.filter((f) => f.verdict === "WARN_AMBIGUOUS").map((f) => f.because),
    ]),
  );

  return {
    id: ticketId(),
    msg_id: msgId,
    case_name: cls.case_name,
    customer_text: text,
    action: auth.tool,
    amount: auth.amount,
    auto_limit: autoLimit,
    tier: auth.tier,
    stop_reason:
      auth.tier === "APPROVE"
        ? `该笔处置金额 ¥${auth.amount} 超出 Agent 可自动处置上限 ¥${autoLimit}，按政策必须由人工审批后执行。`
        : `当前已暂停小额自动确认，金额 ¥${auth.amount} 的处置需要人工审批后执行。`,
    basis,
    uncertainties,
    if_approved: isRefund
      ? `执行退款 ¥${auth.amount}，向客户发送退款到账通知，本次会话直接结单。`
      : `生成换货工单并通知客户寄回与换发流程，本次会话直接结单。`,
    if_rejected: isRefund
      ? "不执行退款，改为转交专人跟进并向客户说明，本次会话结单。"
      : "不生成换货工单，改为转交专人跟进并向客户说明，本次会话结单。",
    holding_reply: "已受理，正在等待人工审批结果",
    requested_at,
  };
}

async function judgeOnce(
  msg            ,
  cls                                            ,
  refund                                                                                                ,
  evidence                                                      ,
  policy        ,
  contextBlock        ,
  opts            ,
)                    {
  if (opts.offline) {
    return judgeOffline({ case_name: cls.case_name, case_type: cls.case_type, refund: refund       , evidence, policy });
  }
  const { system, user } = buildJudgePrompt({
    text: msg.text,
    case_name: cls.case_name,
    refund: refund       ,
    evidence,
    policy,
    context_block: contextBlock,
  });
  const res = await callModel(system, user, 0);
  const raw = extractJson     (res.text);
  return normalize(refund, raw);
}

function normalize(refund                              , raw     )           {
  const allowed = new Set(["REFUND", "PARTIAL_REFUND", "EXCHANGE", "REJECT", "NEED_MORE_INFO", "INQUIRY"]);
  if (!allowed.has(raw?.decision)) {
    throw new ModelError(`模型返回的 decision 非法：${JSON.stringify(raw?.decision)}`, undefined, "bad_shape");
  }
  const amount = Number(raw?.amount);
  if (!Number.isFinite(amount)) {
    throw new ModelError(`模型返回的 amount 不是数字：${JSON.stringify(raw?.amount)}`, undefined, "bad_shape");
  }
  const criteria = Array.isArray(raw?.criteria)
    ? raw.criteria
        .filter((c     ) => c && typeof c.statement === "string")
        .map((c     , i        ) => ({
          id: String(c.id ?? `C${i + 1}`),
          statement: String(c.statement),
          basis: Array.isArray(c.basis) ? c.basis.map(String) : [],
        }))
    : [];
  return {
    refund_id: refund?.refund_id ?? null,
    decision: raw.decision,
    amount,
    criteria,
    conflicts: Array.isArray(raw?.conflicts) ? raw.conflicts.map(String) : [],
    ambiguous: Array.isArray(raw?.ambiguous) ? raw.ambiguous.map(String) : [],
    rationale: String(raw?.rationale ?? ""),
    judge_source: "model",
  };
}

/* ── 适配层：和 desktop/server.mjs 同一套 deps / 同一套 withTrace 语义 ── */
const { loadRegistry, loadStore, buildTools } = __req("tools.ts");

/* 单文件版没有独立进程可连 MCP 服务端。不假装联通：如实标注通道，取数走同一份数据文件的本地通路
   —— 校验、合并、判定与本地服务模式完全一致，只有「谁去取数」不同。 */
const MCP_OFF = {
  ready: false,
  problem: "单文件演示模式不能拉起独立进程；取数走本地数据文件通路（同一份数据、同一处校验）",
  serverInfo: null,
  tools: [],
  // 没有进程可拉，就没有「重连」这回事 —— 界面据此不摆这个按钮，而不是摆了再失败
  can_reconnect: false,
  namespace: conns.namespace,
  timeoutMs: 0,
};
const connectorViews = () => buildConnectorViews(conns, storeStats(store), MCP_OFF);
const __inboundLog = [];

/* 待审批队列：单文件版全在页内，用内存 Map 承载续办句柄（与 server.mjs 语义一致） */
const __pending = new Map();

/* 人工跟进台账（与服务端同口径）：认领 / 记录 / 按补充事实重新处置 / 结单 */
const __followups = new Map();
const __FU_STATUS = { todo: "待跟进", doing: "跟进中", waiting: "等客户回复", closed: "已结单" };

/* withTrace：Node 版是读盘，这里读 shim 捕获的写入内容，行结构完全一致 */
function withTrace(result) {
  let lines = [];
  try {
    lines = __node.fs.readFileSync(result.trace_path).trim().split("\n").map((l) => JSON.parse(l));
  } catch { /* 轨迹读取失败不影响主结果 */ }
  return { ...result, trace_lines: lines };
}

function decorate(payload, msgId) {
  const sample = samples.find((s) => s.msg_id === msgId) ?? null;
  if (sample) {
    payload.sample_id = sample.sample_id;
    payload.grade = sample.grade;
    payload.title = sample.title;
    payload.expected = sample.expect;
    payload.expect_errors = checkExpectation(sample, payload);
  }
  return payload;
}

const DEMO_NOTE = "单文件演示模式：只含离线规则引擎。模型模式需要 Node 服务端（node desktop/server.mjs）。";

window.__AFTERSALES_ENGINE__ = {
  note: DEMO_NOTE,
  call(path, body) {
    if (path === "/api/bootstrap") {
      return Promise.resolve({
        ok: true, node: "browser", port: 0, namespace: reg.namespace,
        mode: "offline", llm_problem: DEMO_NOTE,
        registry: { namespace: reg.namespace, tools: reg.tools },
        samples: samples.map((s) => ({
          sample_id: s.sample_id, grade: s.grade, msg_id: s.msg_id, title: s.title,
          display: s.display ?? s.title,
          text: store.messages.find((m) => m.msg_id === s.msg_id)?.text ?? "",
          expect: s.expect,
        })),
      });
    }
    if (path === "/api/run") {
      if (body && body.offline === false) {
        return Promise.reject(new Error("模型通道不可用：" + DEMO_NOTE));
      }
      let msgId = String((body && body.msgId) ?? "");
      if (!msgId && body && body.text) {
        msgId = "ADHOC-" + String(Date.now()).slice(-6);
        store.messages.push({ msg_id: msgId, text: String(body.text), known_order: null });
      }
      if (!msgId || !store.messages.some((m) => m.msg_id === msgId)) {
        return Promise.reject(new Error("缺少 msgId 或 text，或消息不存在"));
      }
      return runCaseDetailed(msgId, deps, {
        offline: true,
        autoApproveAsk: !body || body.autoApproveAsk !== false,
        disableReviewer: !!(body && body.disableReviewer),
        simulateStageViolation: !!(body && body.simulateStageViolation),
        deferApproval: !body || body.deferApproval !== false,
      }).then((outcome) => {
        let pending = null;
        if (outcome.status === "pending" && outcome.ticket && outcome.resume) {
          __pending.set(outcome.ticket.id, { ticket: outcome.ticket, resume: outcome.resume, msg_id: msgId });
          pending = outcome.ticket;
        }
        return { ok: true, result: decorate(withTrace(outcome.result), msgId), pending };
      });
    }
    if (path === "/api/approvals") {
      return Promise.resolve({ ok: true, items: Array.from(__pending.values()).map((x) => x.ticket) });
    }
    if (path === "/api/followups") {
      return Promise.resolve({
        ok: true,
        statuses: __FU_STATUS,
        items: Array.from(__followups.entries()).map(([key, v]) => Object.assign({ case_key: key }, v)),
      });
    }
    if (path === "/api/followup") {
      const key = String((body && body.case_key) || "").trim();
      const action = String((body && body.action) || "").trim();
      const by = String((body && body.by) || "").trim() || "未署名跟进人";
      const note = String((body && body.note) || "").trim();
      const target = String((body && body.target) || "").trim();
      const LABEL = {
        claim: "接手跟进",
        note: "记了一条跟进",
        wait: "已联系客户，等待客户补充",
        reassign: "转交跟进",
        rerun: "按补充事实重新处置",
        close: "核实完毕，结单",
      };
      if (!key) return Promise.reject(new Error("缺少 case_key"));
      if (!LABEL[action]) return Promise.reject(new Error("不认识的跟进动作：" + action));
      if (action === "note" && !note) return Promise.reject(new Error("跟进记录不能为空"));
      const cur = __followups.get(key) || { owner: "", status: "todo", log: [], case: null };
      if (body && body.case && typeof body.case === "object") cur.case = body.case;
      if (body && body.run_case && typeof body.run_case === "object") cur.run_case = body.run_case;
      cur.log.push({ at: new Date().toISOString(), by, action, label: LABEL[action], note, target });
      if (action === "claim" || action === "note" || action === "rerun" || action === "reassign") {
        if (action === "reassign" && target) cur.owner = target;
        else if (!cur.owner) cur.owner = by;
        if (cur.status === "todo" || cur.status === "waiting") cur.status = "doing";
        if (action === "reassign") cur.status = "doing";
      }
      if (action === "wait") { if (!cur.owner) cur.owner = by; cur.status = "waiting"; }
      if (action === "close") { if (!cur.owner) cur.owner = by; cur.status = "closed"; }
      __followups.set(key, cur);
      return Promise.resolve(Object.assign({ ok: true, case_key: key, status_text: __FU_STATUS[cur.status] }, cur));
    }
    if (path === "/api/config") {
      // 单文件版没有进程可以写回配置。如实标「不可编辑」，让界面收起表单 ——
      // 比在界面上摆一组填了也存不下去的输入框诚实。
      return Promise.resolve({
        ok: true, editable: false,
        usable: false, problem: DEMO_NOTE,
        reason: "单文件版只有一个离线规则引擎，没有可以写回配置的服务端进程。",
        env_file: "",
      });
    }
    if (path === "/api/config/test") {
      return Promise.reject(new Error("单文件版没有模型通道，无法测试连通：" + DEMO_NOTE));
    }
    if (path === "/api/connectors") {
      return Promise.resolve({
        ok: true,
        protocol: conns.protocol,
        namespace: conns.namespace,
        notice: conns.notice,
        server: conns.server,
        mcp: MCP_OFF,
        datasets: DATASETS.map((d) => ({
          dataset: d, label: DATASET_SPEC[d].label, rows: storeStats(store)[d],
          columns: datasetHeader(d), sample: DATASET_SAMPLE[d],
        })),
        stats: storeStats(store),
        connectors: connectorViews(),
      });
    }
    if (path === "/api/connectors/pull") {
      const want = String((body && body.id) || "").trim();
      const targets = !want || want === "*" ? conns.connectors : conns.connectors.filter((c) => c.id === want);
      if (!targets.length) return Promise.reject(new Error("没有这个数据源"));
      const pulled = [];
      for (const c of targets) {
        if (c.kind !== "mcp") continue;
        const reports = pullFromFiles(store, c);
        pulled.push({
          id: c.id, name: c.name, via: "file", reports,
          added: reports.reduce((n, r) => n + r.added, 0),
          updated: reports.reduce((n, r) => n + r.updated, 0),
          rejected: reports.reduce((n, r) => n + r.rejected, 0),
          errors: reports.reduce((a, r) => a.concat(r.errors), []),
        });
      }
      return Promise.resolve({ ok: true, pulled, stats: storeStats(store), connectors: connectorViews() });
    }
    if (path === "/api/mcp/reconnect") {
      // 界面上不摆这个按钮，但接口也不能沉默：万一有人直接调，得说清为什么做不到
      return Promise.reject(new Error("单文件演示模式没有独立进程可连，无法重连数据通道；取数请直接用本地文件通路"));
    }
    if (path === "/api/ingest") {
      const dataset = String((body && body.dataset) || "");
      if (DATASETS.indexOf(dataset) < 0) return Promise.reject(new Error("请选择要导入的数据表"));
      const report = ingestText(store, dataset, String((body && body.text) || ""));
      return Promise.resolve({ ok: true, report, stats: storeStats(store), connectors: connectorViews() });
    }
    if (path === "/api/inbound" && body === undefined) {
      return Promise.resolve({
        ok: true, connected: true, protocol: conns.protocol, notice: conns.notice,
        entries: __inboundLog.slice(-40).reverse().map((e, i) => (i < 8 ? e : { ...e, result: undefined })),
      });
    }
    if (path === "/api/inbound") {
      const text = String((body && body.text) || "").trim();
      if (!text) return Promise.reject(new Error("消息内容为空"));
      const from = String((body && body.from) || "").trim() || "微信客户";
      const channel = String((body && body.channel) || "").trim() || "微信小店";
      const at = new Date().toISOString();
      let msgId = String((body && body.msg_id) || "").trim();
      if (!msgId) {
        // 与 desktop/server.mjs 同口径：同一个人、同一个渠道、同一句话 = 同一条消息 → 判重
        const h = __node.crypto.createHash();
        h.update(from + "|" + channel + "|" + text);
        msgId = "WX-" + h.digest();
      }
      if (store.messages.some((m) => m.msg_id === msgId)) {
        __inboundLog.push({ msg_id: msgId, from, channel, text, at, status: "duplicate", note: "同一条消息已处理过，未重复执行" });
        return Promise.resolve({ ok: true, deduped: true, msg_id: msgId, from, channel, at, note: "该消息已处理过，未重复执行" });
      }
      store.messages.push({ msg_id: msgId, text, known_order: null });
      return runCaseDetailed(msgId, deps, { offline: true, autoApproveAsk: true, deferApproval: true }).then((outcome) => {
        let pending = null;
        if (outcome.status === "pending" && outcome.ticket && outcome.resume) {
          __pending.set(outcome.ticket.id, { ticket: outcome.ticket, resume: outcome.resume, msg_id: msgId });
          pending = outcome.ticket;
        }
        const payload = withTrace(outcome.result);
        payload.inbound = { msg_id: msgId, from, channel, at };
        __inboundLog.push({
          msg_id: msgId, from, channel, text, at,
          status: outcome.result.pending_approval ? "pending" : "handled",
          outcome: outcome.result.execution_outcome || "",
          result: payload,
        });
        return { ok: true, deduped: false, msg_id: msgId, from, channel, at, result: payload, pending };
      });
    }
    if (path === "/api/approve") {
      const id = String((body && body.id) ?? "");
      const entry = __pending.get(id);
      if (!entry) return Promise.reject(new Error("该审批单不存在或已处理"));
      const approved = !!(body && body.approved === true);
      const approver = String((body && body.approver) || "").trim() || "未署名审批人";
      const note = String((body && body.note) || "");
      // 先取出再删：避免续办抛错后重复执行同一笔处置
      __pending.delete(id);
      return entry.resume(approved, approver, note).then((result) => ({
        ok: true, approved, approver, note,
        result: decorate(withTrace(result), entry.msg_id),
        remaining: __pending.size,
      }));
    }
    if (path === "/api/gate") {
      if (body && body.offline === false) {
        return Promise.reject(new Error("模型通道不可用：" + DEMO_NOTE));
      }
      return Promise.all(samples.map((s) =>
        runCase(s.msg_id, deps, { offline: true, autoApproveAsk: true }).then((result) => {
          const payload = withTrace(result);
          payload.expect_errors = checkExpectation(s, result);

        })
      )).then((rows) => ({
        ok: true, total: rows.length,
        passed: rows.filter((r) => r.errors.length === 0).length,
        failed: rows.filter((r) => r.errors.length > 0).length,
        rows,
      }));
    }
    return Promise.reject(new Error("单文件演示模式不支持 " + path));
  },

  /* 流式：单文件版没有网络，但「过程事件」照样是真的 —— 引擎就在这个页面里跑，
     回调是同步发生的，不经过任何模拟。所以这里不是「假装流式」，
     而是把同一份 onEvent / signal 直接接上，界面因此只有一套逻辑。 */
  stream(path, body, handlers, opts) {
    if (path !== "/api/run/stream") {
      return Promise.reject(new Error("单文件演示模式不支持 " + path));
    }
    const h = handlers || {};
    const o = opts || {};
    if (body && body.offline === false) {
      return Promise.reject(new Error("模型通道不可用：" + DEMO_NOTE));
    }
    let msgId = String((body && body.msgId) ?? "");
    if (!msgId && body && body.text) {
      msgId = "ADHOC-" + String(Date.now()).slice(-6);
      store.messages.push({ msg_id: msgId, text: String(body.text), known_order: null });
    }
    if (!msgId || !store.messages.some((m) => m.msg_id === msgId)) {
      return Promise.reject(new Error("缺少 msgId 或 text，或消息不存在"));
    }
    if (h.onStart) h.onStart({ type: "start", msg_id: msgId, mode: "offline" });
    return runCaseDetailed(msgId, deps, {
      offline: true,
      autoApproveAsk: !body || body.autoApproveAsk !== false,
      deferApproval: !body || body.deferApproval !== false,
      signal: o.signal,
      onEvent: (line) => { if (h.onEvent) h.onEvent(line); },
    }).then((outcome) => {
      let pending = null;
      if (outcome.status === "pending" && outcome.ticket && outcome.resume) {
        __pending.set(outcome.ticket.id, { ticket: outcome.ticket, resume: outcome.resume, msg_id: msgId });
        pending = outcome.ticket;
      }
      return { type: "result", result: decorate(withTrace(outcome.result), msgId), pending };
    });
  },
};

} catch (e) {

  console.error("[单文件演示] 引擎启动失败：", e);
}

<script>
"use strict";

/* ═══════════ 基础工具 ═══════════ */
const $ = (id) => document.getElementById(id);
const on = (el, ev, fn) => el && el.addEventListener(ev, fn);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const yuan = (n) => "¥" + Number(n ?? 0).toLocaleString("zh-CN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const yuanShort = (n) => "¥" + Number(n ?? 0).toLocaleString("zh-CN", { maximumFractionDigits: 2 });

/* ═══════════ 术语净化：渲染前必须过这一层 ═══════════

   都在这里被翻成人话。防线放在渲染层而不是数据层：数据继续服务命令行与接口，
   展示层单独收口，改一处即全覆盖。 */
const TERM = [
  [/aftersales\.decide_refund/g, "退款处置"],
  [/aftersales\.create_exchange/g, "换货建单"],

  [/aftersales\.query_refund/g, "查询退款申请"],
  [/aftersales\.query_sku/g, "查询商品规格"],
  [/aftersales\.query_logistics/g, "查询物流"],
  [/aftersales\.query_ticket/g, "查询工单记录"],
  [/aftersales\.(notify_customer|send_notice)/g, "通知客户"],
  [/aftersales\.[a-z_]+/g, "处置动作"],
  [/\bdecide_refund\b/g, "退款处置"],
  [/\bcreate_exchange\b/g, "换货建单"],
  [/REJECT_FACT_CONFLICT/g, "未通过：信息与记录不符"],
  [/REJECT_AMOUNT/g, "未通过：金额超出实付"],
  [/REJECT_STAGE_VIOLATION/g, "未通过：处理顺序不符"],
  [/REJECT_MISSING_EVIDENCE/g, "未通过：关键凭证缺失"],
  [/REJECT_NO_CRITERIA/g, "未通过：缺少判断依据"],
  [/WARN_AMBIGUOUS/g, "基本通过，存在不确定项"],
  [/CLARIFY_NEEDED/g, "需补充信息"],
  [/PENDING_APPROVAL/g, "待人工审批"],
  [/PENDING_ASK/g, "待人工确认"],
  [/AUTO_EXECUTED/g, "已自动执行"],
  [/SKIPPED_BY_GATE/g, "未获授权未执行"],
  [/\bAPPROVED\b/g, "已批准"],
  [/\bREJECTED\b/g, "已驳回"],
  [/\bPENDING\b/g, "待审批"],
  [/\bPASS\b/g, "复核通过"],
  [/\bREJECT\b/g, "不予处置"],
  [/\bAPPROVE\b/g, "人工审批"],
  [/\bEXECUTE\b/g, "直接执行"],
  [/\bASK\b/g, "执行前确认"],
  [/\bAUTO\b/g, "无需审批"],
  [/\bBY_AMOUNT\b/g, "按金额分档"],
  [/\bfull\b/g, "完整核查"],
  [/\blight\b/g, "快速处理"],
  [/\bclarify\b/g, "待澄清"],
  [/\boffline_rule\b/g, "规则判定"],

  [/\bREFUND_ONLY\b/g, "仅退款"],

  [/\bsigner\s*=/g, "签收人 "],
  // 审批凭据里的内部标记：界面上只留「人话」，标识本身留给日志与接口

function sanitize(s) {
  let t = String(s ?? "");
  for (const pair of TERM) t = t.replace(pair[0], pair[1]);
  // 收尾：清掉净化后残留的空洞与重复标点
  return t.replace(/\s+([，。；：、])/g, "$1").replace(/([，。；：、])\s*\1+/g, "$1").replace(/[ \t]{2,}/g, " ").trim();
}
const S = (s) => esc(sanitize(s));

/* ═══════════ 传输层 ═══════════
   失败要分得清是哪一类，否则界面只能把「Failed to fetch」原样丢给人看：
     net    —— 根本没连上（服务退了 / 端口被占 / 断网），这时该提示「怎么把它叫回来」
     server —— 服务在，但它内部崩了（5xx），这是我们的问题，不该让人去改配置
     client —— 请求本身不成立（4xx），通常带一句能照做的中文原因
     model  —— 模型通道不可用，出口是「去接口设置」
   调用方拿 e.kind 决定给什么出口，而不是去正则匹配英文错误。 */
async function api(path, body, opts) {
  const opt = opts || {};
  if (window.__AFTERSALES_ENGINE__) return window.__AFTERSALES_ENGINE__.call(path, body);
  let r;
  try {
    r = await fetch(path, {
      method: body === undefined ? "GET" : "POST",
      headers: { "Content-Type": "application/json" },
      body: body === undefined ? undefined : JSON.stringify(body),
      signal: opt.signal,
    });
  } catch (e) {
    if (e && e.name === "AbortError") throw e; // 取消是用户动作，不是故障
    const err = new Error("连不上工作台服务");
    err.kind = "net";
    throw err;
  }
  let j = null;
  try { j = await r.json(); } catch (e) { /* 非 JSON 响应 */ }
  if (!r.ok || !j || j.ok === false) {
    const msg = (j && j.error) || ("请求失败（HTTP " + r.status + "）");
    const err = new Error(msg);
    err.status = r.status;
    err.kind = r.status >= 500 ? "server" : (/模型通道|密钥|接口地址|模型名称/.test(msg) ? "model" : "client");
    throw err;
  }
  return j;
}

/**
 * 流式跑一个案件：过程事件一条条到，最后给结果。
 *
 * 两种交付形态、两种运输，上层只有这一处代码：
 *   · 服务端形态：POST /api/run/stream，前端读 NDJSON 行
 *   · 单文件形态：页内引擎，回调直接就是引擎的回调（同一个进程，本来就是真的）
 * 单文件那条由构建脚本把下面这行「传输缝」替换成页内调用 —— 界面上不写两套逻辑。
 */
async function apiStream(path, body, handlers, opts) {
  const h = handlers || {};
  const opt = opts || {};
  if (window.__AFTERSALES_ENGINE__) return window.__AFTERSALES_ENGINE__.stream(path, body, handlers, opts);
  let r;
  try {
    r = await fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
      signal: opt.signal,
    });
  } catch (e) {
    if (e && e.name === "AbortError") throw e;
    const err = new Error("连不上工作台服务");
    err.kind = "net";
    throw err;
  }
  if (!r.ok || !r.body) {
    let j = null;
    try { j = await r.json(); } catch (e) { /* 非 JSON 响应 */ }
    const msg = (j && j.error) || ("请求失败（HTTP " + r.status + "）");
    const err = new Error(msg);
    err.status = r.status;
    err.kind = r.status >= 500 ? "server" : (/模型通道|密钥|接口地址|模型名称/.test(msg) ? "model" : "client");
    throw err;
  }

  const reader = r.body.getReader();
  const dec = new TextDecoder();
  let buf = "";
  let final = null;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    const parts = buf.split("\n");
    buf = parts.pop();
    for (const raw of parts) {
      if (!raw.trim()) continue;
      let msg;
      try { msg = JSON.parse(raw); } catch (e) { continue; }
      if (msg.type === "start") { if (h.onStart) h.onStart(msg); }
      else if (msg.type === "event") { if (h.onEvent) h.onEvent(msg.line); }
      else if (msg.type === "result") final = msg;
      else if (msg.type === "cancelled") {
        const err = new Error(msg.error || "已取消");
        err.name = "AbortError";
        throw err;
      } else if (msg.type === "error") {
        const err = new Error(msg.error || "服务端出错");
        err.kind = "server";
        throw err;
      }
    }
  }
  if (!final) {
    const err = new Error("过程流在没有结果的情况下就结束了");
    err.kind = "server";
    throw err;
  }
  return final;
}

/** 把任何异常收敛成「能给人看的三件事」：原因 / 下一步 / 出口类型。不编来源，只说已知的 */
function errOf(e) {
  const msg = (e && e.message) || "未知错误";
  let kind = (e && e.kind) || "unknown";
  if (kind === "unknown" && /模型通道|密钥|接口地址|模型名称/.test(msg)) kind = "model";
  const hint = (e && e.hint) || ({
    net: "服务进程可能已退出，或端口被别的程序占用。回到启动它的那个窗口看看，或重新运行启动脚本。",
    server: "这是工作台服务内部的错误，跟你的操作无关。启动窗口的报错日志能定位到原因。",
    model: "模型通道现在不可用。填齐接口地址、模型名称、访问密钥，或先切回规则判定。",
  }[kind] || "");
  return { msg, hint, kind };
}

/* 这条是不是「Agent 交不出来、要人接」的案子 —— 决定右栏是否出现跟进台账 */
function needsFollowUp(r) {
  if (!r) return false;
  const s = statusOf(r);
  if (s === "blocked" || s === "clarify" || s === "rejected") return true;
  return !!(r.reply && r.reply.follow_up_required);
}
function fuKey(s) { return (s && (s.msgId || s.id)) || ""; }
function fuOf(s) { const k = fuKey(s); return (k && st.followups[k]) || null; }
const FU_STATUS_TEXT = { todo: "待跟进", doing: "跟进中", waiting: "等客户回复", closed: "已结单" };
const FU_ACTION_TEXT = {
  claim: "接手跟进",
  note: "记了一条跟进",
  wait: "已联系客户，等待客户补充",
  reassign: "转交跟进",
  rerun: "按补充事实重新处置",
  close: "核实完毕，结单",
};

function statusOf(r) {
  if (!r) return "run";
  if (r.pending_approval) return "pending";
  const v = r.review && r.review.verdict;
  if (v && v.indexOf("REJECT") === 0) return "blocked";
  if (v === "CLARIFY_NEEDED") return "clarify";
  if (r.auth && r.auth.approval_decision === "REJECTED" && !r.executed_tool) return "rejected";
  return "done";
}
const STATUS_TEXT = {
  run: { cls: "run", txt: "处理中" },
  done: { cls: "ok", txt: "已处理" },
  pending: { cls: "wait", txt: "待人工审批" },
  blocked: { cls: "bad", txt: "已拦截" },
  rejected: { cls: "bad", txt: "审批未通过" },
  clarify: { cls: "mute", txt: "需补充信息" },
  fail: { cls: "bad", txt: "未跑通" },
};

/**
 * 会话级状态。和 statusOf(result) 的区别在于它能表达「压根没拿到结果」。
 *
 * 为什么必须分开：result 为 null 时 statusOf 只能返回 "run"，
 * 于是一条已经失败、永远不会再变绿的记录会一直显示「处理中」——
 * 队列里看着像在跑、指标里算进「处理中」、重试入口也没有。这不是慢，是死。
 */
function sessStatus(s) {
  if (!s) return "run";
  if (s.error) return "fail";
  return statusOf(s.result);
}

/* ═══════════ 六步执行流 ═══════════ */
function stepsFor(r) {
  const out = [];
  const u = r.understanding || {};
  const cls = r.classification || {};
  const j = r.judge || {};
  const rv = r.review || {};
  const auth = r.auth;
  const v = rv.verdict || "";
  const blocked = v.indexOf("REJECT") === 0;
  const clarify = v === "CLARIFY_NEEDED";

  const intentBits = [];
  if (cls.case_name) intentBits.push("识别为「" + sanitize(cls.case_name) + "」诉求");
  if (u.order_id) intentBits.push("从原话里定位到订单 " + u.order_id);
  else intentBits.push("未从原话里匹配到订单");
  if (u.sentiment === "angry") intentBits.push("客户情绪较激动");
  out.push({
    key: "understand", label: "理解需求",
    state: clarify || blocked ? "skip" : "done",
    tx: clarify ? "诉求信息不足，先向客户追问澄清" : intentBits.join("；"),
    more: [["客户提到", u.order_ref ? u.order_ref : "—"], ["判断方式", u.judge_source]],
  });

  const srcs = (r.evidence_sources || []).map((x) => sanitize(x));
  if (clarify) {
    out.push({ key: "order", label: "核实订单", state: "skip", tx: "等待客户补充信息后再核实" });
  } else if (!cls.money_action && !srcs.length) {
    out.push({ key: "order", label: "核实订单", state: "skip", tx: "本次无需调取订单资料" });
  } else {
    out.push({
      key: "order", label: "核实订单", state: "done",
      tx: "已核实：" + (srcs.length ? srcs.join("、") : "系统内未找到对应资料"),
      more: [["已调取", srcs.join("、") || "—"], ["补证情况", r.requery_rounds ? "复核后补充了 " + r.requery_rounds + " 轮" : "首轮即完备"]],
    });
  }

  const criteria = (j.criteria || []).map((c) => sanitize(c.statement));
  const conflict = (j.conflicts || []).map(sanitize);
  const amb = (j.ambiguous || []).map(sanitize);
  if (clarify) {
    out.push({ key: "judge", label: "拟定方案", state: "skip", tx: "诉求不明，不拟定方案" });
  } else if (blocked) {
    out.push({
      key: "judge", label: "拟定方案", state: "warn",
      tx: "已形成初步判断，但依据之间不自洽，交合规复核裁定",
      more: [["初步依据", criteria], ["冲突点", conflict]].filter((x) => x[1].length),
    });
  } else {
    out.push({
      key: "judge", label: "拟定方案", state: "done",
      tx: "建议「" + sanitize(j.decision || "") + "」" + (j.amount ? "，金额 " + yuanShort(j.amount) : "") + "，依据 " + criteria.length + " 条",
      more: [["判断依据", criteria], ["不确定项", amb], ["冲突点", conflict]].filter((x) => x[1].length),
    });
  }

  const findings = (rv.findings || []).map((f) => sanitize(f.because));
  if (clarify) {
    out.push({ key: "review", label: "合规复核", state: "done", tx: "复核通过：在客户补充信息前不进入处置" });
  } else if (blocked) {
    out.push({
      key: "review", label: "合规复核", state: "bad",
      tx: "未通过：" + sanitize(v).replace(/^未通过：/, ""),
      more: [["复核意见", findings]],
    });
  } else if (v === "WARN_AMBIGUOUS") {
    out.push({
      key: "review", label: "合规复核", state: "warn",
      tx: "基本通过，但存在没有确定口径之处，责任归属需要人判断",
      more: [["复核意见", findings]],
    });
  } else {
    out.push({ key: "review", label: "合规复核", state: "done", tx: "复核通过，可以进入授权与执行", more: findings.length ? [["复核意见", findings]] : [] });
  }

  if (blocked) {
    out.push({ key: "exec", label: "授权与执行", state: "skip", tx: "被合规复核拦下，未进入执行" });
  } else if (clarify) {
    out.push({ key: "exec", label: "授权与执行", state: "skip", tx: "本次无需执行" });
  } else if (!cls.money_action) {
    out.push({ key: "exec", label: "授权与执行", state: "done", tx: "本次不涉及资金或不可逆动作，无需执行" });
  } else if (r.pending_approval) {
    out.push({
      key: "exec", label: "授权与执行", state: "wait",
      tx: "停办：该笔 " + yuanShort(r.pending_approval.amount) + " 超出 Agent 自动处置范围，已转入人工审批",
      more: [["自动处置上限", yuanShort(r.pending_approval.auto_limit)], ["当前状态", "等待人工审批后由 Agent 继续执行"]],
    });
  } else if (r.executed_tool) {
    const tierTxt = auth ? sanitize(auth.label) : "直接执行";
    out.push({
      key: "exec", label: "授权与执行", state: "done",
      tx: "已按「" + tierTxt + "」放行并完成处置" + (auth && auth.amount ? "：" + yuanShort(auth.amount) : ""),
      more: [["谁批准的", auth && auth.approver ? sanitize(auth.approver) : "无需人工介入"], ["执行结果", sanitize(r.execution_outcome)]],
    });
  } else if (auth && auth.approval_decision === "REJECTED") {
    out.push({
      key: "exec", label: "授权与执行", state: "bad",
      tx: "人工审批未通过，未执行任何资金处置",
      more: [["审批人", auth.approver ? sanitize(auth.approver) : "未署名"], ["处理方式", "转交专人向客户说明并跟进"]],
    });
  } else {
    out.push({
      key: "exec", label: "授权与执行", state: "warn",
      tx: "未执行任何资金处置",
      more: [["执行结果", sanitize(r.execution_outcome)]],
    });
  }

  out.push({
    key: "reply", label: "回复客户", state: r.reply ? "done" : "skip",
    tx: r.reply ? (r.reply.follow_up_required ? "已生成回复，并标记需人工跟进" : "已生成回复并结单") : "未生成回复",
    more: r.reply ? [["结单说明", sanitize(r.reply.internal_note)]] : [],
  });

  return out;
}

const STEP_MARK = { done: "✓", warn: "!", bad: "✕", wait: "!", run: "•", skip: "·", idle: "·" };
const STEP_STATE_TXT = { done: "完成", warn: "有保留", bad: "未通过", wait: "等人裁决", run: "进行中", skip: "未进入", idle: "待开始" };
const STEP_LABELS = ["理解需求", "核实订单", "拟定方案", "合规复核", "授权与执行", "回复客户"];

/**
 * 事件 → 六步里的第几步。
 *
 * 映射写在明处是有意的：相位与种类是引擎的枚举（accept / investigate / …），
 * 六步是给使用者的话（理解需求 / 核实订单 / …）。翻译只允许发生在这一个函数里，
 * 别处再用 phase 判断一次，口径就会分叉。
 *
 * 「合规复核」是唯一按 kind 判的：它在引擎里可能出现在 accept 或 judge 相位里
 * （诉求不明时复核发生在受理段），但使用者的心智里它永远是第 4 步。
 */
function stepIndexForEvent(line) {
  if (!line) return 0;
  if (line.kind === "review") return 3;
  const byPhase = { accept: 0, investigate: 1, judge: 2, approve: 4, close: 5 };
  const i = byPhase[line.phase];
  return i === undefined ? 0 : i;
}

/** 一次跑批的过程态：六步各自的真实事件、起止时刻与当前状态 */
function newRun(id) {
  return {
    id: id, startedAt: Date.now(), lastAt: Date.now(), events: 0,
    steps: STEP_LABELS.map(() => ({ state: "idle", summary: "", events: [], t0: null, t1: null })),
  };
}

/** 一条真实事件落进对应那一步：之前的步骤收尾，之后的保持待开始 */
function applyEventToRun(run, line) {
  const i = stepIndexForEvent(line);
  const step = run.steps[i];
  const now = Date.now();
  run.lastAt = now;
  run.events += 1;
  step.events.push({ seq: line.seq, at: now, summary: sanitize(line.summary || ""), kind: line.kind, phase: line.phase });
  if (step.t0 === null) step.t0 = now;
  step.t1 = now;
  step.summary = sanitize(line.summary || "");
  step.state = "run";
  for (let k = 0; k < run.steps.length; k++) {
    if (k < i && run.steps[k].state === "run") run.steps[k].state = "done";
  }
  return i;
}

/** 过程态 → 给界面用的六步（跑的时候每一行都是真事，不是先写死后点亮的） */
function runToSteps(run) {
  return run.steps.map((st, i) => ({
    label: STEP_LABELS[i], state: st.state,
    tx: st.summary || (st.state === "idle" ? "等待前一步完成" : ""),
    more: [], events: st.events, t0: st.t0, t1: st.t1,
  }));
}

/**
 * 结果 → 给界面用的六步。结论文字用 stepsFor（那是给人看的判断与依据），
 * 事件列表用手上真实的轨迹事件（如果这次跑批是流式的、我们收到了）。
 * 两者都真：文字是「这一步意味着什么」，事件是「这一步到底做了什么」。
 */
function resultToSteps(result, run) {
  const base = stepsFor(result);
  return base.map((s, i) => {
    const live = run && run.steps[i] ? run.steps[i] : null;
    return Object.assign({}, s, {
      label: STEP_LABELS[i],
      events: live ? live.events : [],
      t0: live ? live.t0 : null,
      t1: live ? live.t1 : null,
    });
  });
}

function fmtDur(ms) {
  if (ms === null || ms === undefined) return "";
  if (ms < 1000) return ms + " ms";
  return (ms / 1000).toFixed(ms < 10000 ? 2 : 1) + " 秒";
}

function tlStepHtml(s, i) {
  const more = (s.more || []).filter((x) => x && x[1] && (!Array.isArray(x[1]) || x[1].length));
  const evs = s.events || [];
  const dur = s.t0 !== null && s.t1 !== null && s.t1 > s.t0 ? fmtDur(s.t1 - s.t0) : (s.state === "run" ? "计时中" : "");
  const hasDetail = more.length || evs.length;

  const evHtml = evs.length
    ? '<div class="tl-evh">过程记录 ' + evs.length + ' 条</div>' + evs.map((e) =>
        '<div class="tl-ev"><span class="sq">' + e.seq + '</span><span class="tx">' + esc(e.summary) + '</span>' +
        '<span class="tm">' + new Date(e.at).toTimeString().slice(0, 8) + '</span></div>').join("")
    : "";

  const moreHtml = more.map((x) =>
    '<div class="tl-kv"><span class="k">' + esc(x[0]) + '</span><span class="v">' +
    (Array.isArray(x[1]) ? x[1].map((z) => S(z)).join("；") : S(x[1])) + '</span></div>').join("");

  const detail = hasDetail
    ? '<button class="tl-fold" data-fold="' + i + '" aria-expanded="false" aria-controls="tlmore' + i + '">' +
        '<span class="tri" aria-hidden="true">▶</span>依据与过程</button>' +
      '<div class="tl-detail" data-more="' + i + '" id="tlmore' + i + '">' + moreHtml + evHtml + '</div>'
    : "";

  return '<li class="tl-step ' + s.state + '" data-step="' + i + '">' +
    '<div class="tl-gutter"><span class="tl-node" aria-hidden="true">' + (STEP_MARK[s.state] || "·") + '</span><i class="tl-wire"></i></div>' +
    '<div class="tl-body"><div class="tl-row">' +
      '<span class="tl-label">' + esc(s.label) + '</span>' +
      '<span class="chip ' + tlChipCls(s.state) + '">' + STEP_STATE_TXT[s.state] + '</span>' +
      (dur ? '<span class="tl-dur">' + esc(dur) + '</span>' : "") +
    '</div>' +
    (s.tx ? '<div class="tl-text">' + S(s.tx) + '</div>' : "") + detail +
    '</div></li>';
}

function tlChipCls(state) {
  return state === "done" ? "ok" : state === "bad" ? "bad" : (state === "warn" || state === "wait") ? "wait"
    : state === "run" ? "run" : "mute";
}

/**
 * 时间线整块。
 * meta.live = true 时是「正在跑」：节点带脉冲、时长走计时，正文里不出现任何结论性措辞。
 */
function tlHtml(steps, meta) {
  const m = meta || {};
  const doneN = steps.filter((s) => s.state === "done").length;
  const total = m.t0 && m.t1 ? fmtDur(m.t1 - m.t0) : "";
  const sub = m.live
    ? "进行中 · 已完成 " + doneN + "/6 步 · 已跑 " + Math.round((Date.now() - (m.t0 || Date.now())) / 1000) + " 秒"
    : "六步 · " + (m.events ? m.events + " 条过程记录 · " : "") + (total ? "用时 " + total : "已结束");
  return '<div class="tl">' +
    '<div class="tl-head"><span class="tl-title">Agent 执行过程</span>' +
      '<span class="tl-sub" data-tl-sub>' + esc(sub) + '</span><span class="sp"></span>' +
      (m.live ? '<span class="chip run">在跑</span>' : "") +
      '<button class="btn xs" data-tl-all="1">展开全部依据</button></div>' +
    '<ol class="tl-list" id="tlList" aria-label="Agent 执行过程（六步）">' + steps.map(tlStepHtml).join("") + '</ol></div>';
}

function stepCountOf(run) {
  return run && run.steps ? run.steps.reduce((n, s) => n + s.events.length, 0) : 0;
}

/* 兼容旧调用点：结果卡上方那块「Agent 处理过程」现在就是时间线 */
function renderWork(result, phase, run) {
  if (phase === "run" && run) return tlHtml(runToSteps(run), { live: true, t0: run.startedAt, t1: Date.now() });
  const steps = resultToSteps(result, run);
  return tlHtml(steps, { t0: run ? run.startedAt : null, t1: run ? run.lastAt : null, events: run ? stepCountOf(run) : 0 });
}

/* ═══════════ 渲染：指标与队列 ═══════════ */
function counts() {
  const c = { run: 0, done: 0, pending: 0, blocked: 0, rejected: 0, clarify: 0, fail: 0 };
  for (const s of st.sessions) c[sessStatus(s)] = (c[sessStatus(s)] || 0) + 1;
  c.pending += st.approvals.filter((a) => !st.sessions.some((s) => s.result && s.result.pending_approval && s.result.pending_approval.id === a.id)).length;
  return c;
}

// 指标条 = 监管入口，不是装饰：每一项都能点开对应的处置列表并直接操作
const METRIC_DEFS = [
  { key: "done", cls: "m-ok", label: "已自动处理", hint: "看它自己处理完的这些" },
  { key: "pending", cls: "m-wait", label: "待人工审批", hint: "等你拍板，点开就能裁决" },
  { key: "blocked", cls: "m-stop", label: "已拦截", hint: "合规复核拦下的，看它为什么拦" },
  { key: "rejected", cls: "m-stop", label: "审批未通过", hint: "你驳回过、没有执行的" },
  { key: "clarify", cls: "m-ask", label: "需补充信息", hint: "等客户回话，回复已备好" },
  // 未跑通必须单独一格：混进「已自动处理」是虚报，混进「处理中」是让人干等
  { key: "fail", cls: "m-stop", label: "未跑通", hint: "点开看失败原因，可原样重试" },
];

function renderMetrics() {
  const c = counts();
  $("metrics").innerHTML = METRIC_DEFS.map((d) => {
    const n = c[d.key] || 0;
    const on = st.filter === d.key;
    return '<button class="metric ' + d.cls + (n === 0 ? " zero" : "") + (on ? " on" : "") +
      '" data-metric="' + d.key + '" title="' + esc(d.hint) + '"' +
      ' aria-pressed="' + (on ? "true" : "false") + '"' +
      ' aria-label="' + esc(d.label + " " + n + " 条：" + d.hint) + '">' +
      '<span class="dot" aria-hidden="true"></span><span class="n">' + n + '</span><span class="k">' + esc(d.label) + '</span></button>';
  }).join("");
  const badge = $("railBadge");
  if (c.pending > 0) {
    badge.style.display = "grid"; badge.textContent = c.pending;
    $("navAppr").setAttribute("aria-label", "人工审批，待办 " + c.pending + " 条");
  } else {
    badge.style.display = "none";
    $("navAppr").setAttribute("aria-label", "人工审批");
  }
}

function pickMetric(key) {
  // 再点一次同一个 = 取消筛选
  st.filter = st.filter === key ? null : key;
  const hit = st.filter ? st.sessions.filter((s) => sessStatus(s) === st.filter) : [];
  if (st.filter === "pending") {
    // 「待人工审批」是唯一需要人动手的一档：除了筛队列，直接把人送进审批中心
    st.view = "approvals";
    if (hit[0]) st.cur = hit[0].id;
  } else if (st.filter) {
    // 其余各档：切回处置视图并选中第一条，右栏立刻给出该条的结论 / 回复（可直接复制）
    st.view = "chat";
    if (hit[0]) st.cur = hit[0].id;
  }
  renderAll();
  if (st.filter) $("stageScroll").scrollTop = 0;
  const d = METRIC_DEFS.find((x) => x.key === st.filter);
  toast(
    st.filter
      ? "只看「" + d.label + "」（" + hit.length + " 条）：" + d.hint
      : "已显示全部处置记录",
    st.filter ? "" : "ok"
  );
}

/* 搜索是对「人怎么找东西」的直接支持：客户原话、案件名、单号、处理结果里
   任一处命中即留下。运营手上通常只有半句原话或一个单号。 */
function matchesQuery(s, q) {
  if (!q) return true;
  const hay = [
    s.title, s.text,
    s.result && s.result.classification && s.result.classification.case_name,
    s.result && s.result.execution_outcome,
    s.result && s.result.understanding && s.result.understanding.order_id,
    s.result && s.result.reply && s.result.reply.customer_text,
  ].filter(Boolean).join(" ").toLowerCase();
  return q.toLowerCase().split(/\s+/).filter(Boolean).every((w) => hay.indexOf(w) >= 0);
}

function qitemHtml(s) {
  const cfg = STATUS_TEXT[sessStatus(s)];
  const fu = fuOf(s);
  const fuTarget = fuKey(s) || s.id;
  const fuTag = fu
    ? '<button type="button" class="fu-tag" data-goto-fu="' + esc(fuTarget) + '" title="打开这条的人工跟进">' + esc(FU_STATUS_TEXT[fu.status] || "跟进中") + '</button>'
    : (s.result && needsFollowUp(s.result)
      ? '<button type="button" class="fu-tag" data-goto-fu="' + esc(fuTarget) + '" title="这条等你接手">待接手</button>'
      : "");
  const foot = s.error
    ? "未跑通 · 点开可原样重试"
    : fu
      ? (fu.owner ? "跟进人 " + sanitize(fu.owner) : "待接手") + " · " + (fu.log || []).length + " 条记录"
      : (s.result && s.result.reply && s.result.reply.follow_up_required ? "需人工跟进" : (s.pending ? "处理中…" : "自主结单"));
  const time = s.at ? new Date(s.at).toTimeString().slice(0, 5) : "";
  return '<div class="qitem ' + (st.cur === s.id ? "active " : "") + (st.qCursor === s.id ? "kb" : "") +
    '" data-q="' + esc(s.id) + '" role="listitem" tabindex="0" aria-selected="' + (st.cur === s.id ? "true" : "false") + '">' +
    '<div class="r1"><span class="name">' + S(s.title) + '</span><span class="chip ' + cfg.cls + '">' + cfg.txt + '</span>' + fuTag + '</div>' +
    '<div class="r2">' + S(s.text) + '</div>' +
    '<div class="r3">' + (time ? '<span class="time">' + esc(time) + '</span>' : "") + '<span>' + esc(foot) + '</span></div></div>';
}

function renderQueue() {
  const all = st.sessions;
  const q = (st.q || "").trim();
  let rows = st.filter ? all.filter((s) => sessStatus(s) === st.filter) : all;
  if (q) rows = rows.filter((s) => matchesQuery(s, q));
  $("qCount").textContent = rows.length;
  const d = METRIC_DEFS.find((x) => x.key === st.filter);
  $("qSub").textContent = st.filter || q
    ? "筛选自 " + all.length + " 条记录"
    : (all.length ? "共 " + all.length + " 条，均由 Agent 自主推进" : "贴入客户原话即可自动处理");
  $("qFilter").innerHTML =
    (d || q
      ? (d ? '<span class="pill">' + esc(d.label) + " " + rows.length + '</span>' : "") +
        (q ? '<span class="pill">搜索 ' + esc(q) + " " + rows.length + '</span>' : "") +
        '<button class="clr" data-clear-filter="1">清除筛选</button>'
      : "");

  if (!all.length) {
    $("qList").innerHTML = '<div class="empty-side pad-narrow"><div class="big">◍</div>还没有处置记录<br>下方输入框贴一句客户原话试试</div>';
    return;
  }
  if (!rows.length) {
    $("qList").innerHTML = '<div class="empty-side pad-narrow"><div class="big">◌</div>没有符合条件的记录<br>换个词，或点「清除筛选」看全部</div>';
    return;
  }
  /* 分组只在「没筛也没搜」时出现：一旦人明确说了要看什么，就别再拿分组打断他。
     分组本身是有用信息 —— 这个产品的日常是「有事要你动手」和「它自己办完了」两堆。 */
  if (!st.filter && !q) {
    const NOW = ["pending", "blocked", "rejected", "clarify", "fail"];
    const groups = [
      { t: "等你处理", list: rows.filter((s) => NOW.indexOf(sessStatus(s)) >= 0) },
      { t: "正在处理", list: rows.filter((s) => sessStatus(s) === "run") },
      { t: "已自动完成", list: rows.filter((s) => sessStatus(s) === "done") },
    ].filter((g) => g.list.length);
    $("qList").innerHTML = groups.map((g) =>
      '<div class="queue-group">' + esc(g.t) + " " + g.list.length + '</div>' + g.list.map(qitemHtml).join("")).join("");
    return;
  }
  $("qList").innerHTML = rows.map(qitemHtml).join("");
}

/* ═══════════ 渲染：主区 ═══════════ */
// 首屏 = 工作台：只说当下有什么、要你做什么，不介绍自己
function boardHtml() {
  const stats = (st.sources && st.sources.datasets) || [];
  const mcp = (st.sources && st.sources.mcp) || null;
  // 失败的那条也要出现在这里：工作台首屏是唯一「不看队列也能知道出事了」的地方，
  // 把它滤掉就等于让「刚才那一下没跑通」在落地页上静默消失。
  const sessions = st.sessions;
  const todo = st.approvals;

  const srcChips = stats.length
    ? '<div class="dschips">' + stats.map((d) =>
        '<button class="dschip" data-goto-sources="1"><span class="dot"></span>' + esc(d.label) +
        ' <b>' + d.rows + '</b></button>').join("") + '</div>'
    : '<div class="empty-line">数据源读取中…</div>';

  const todoRows = todo.length
    ? todo.slice(0, 4).map((t) =>
        '<div class="brow click" data-goto-appr="1"><span class="nm">' + S(t.case_name) + '</span>' +
        '<span class="tx">' + esc(sanitize(t.stop_reason)) + '</span>' +
        '<span class="amt amt-warn">' + yuan(t.amount) + '</span></div>').join("")
      + (todo.length > 4 ? '<div class="empty-line">还有 ' + (todo.length - 4) + ' 条…</div>' : "")
    : '<div class="empty-line">没有等你拍板的事 —— 在它权限内的处置它已经自己执行完了。</div>';

  // 「等你接手」：Agent 交不出来、必须有人接的案子。这是工作台上唯一需要人动手的第三类事。
  const fuOpen = sessions.filter((s) => needsFollowUp(s.result) && (!fuOf(s) || fuOf(s).status !== "closed"));
  const fuRows = fuOpen.length
    ? fuOpen.slice(0, 5).map((s) => {
        const fu = fuOf(s);
        return '<div class="brow click" data-q="' + esc(s.id) + '"><span class="nm">' + S(s.title) + '</span>' +
          '<span class="tx">' + S(s.text) + '</span>' +
          '<span class="fu-tag">' + esc(fu ? (FU_STATUS_TEXT[fu.status] || "待跟进") : "待接手") + '</span></div>';
      }).join("")
    : "";

  const recentRows = sessions.length
    ? sessions.slice(0, 5).map((s) => {
        const cfg = STATUS_TEXT[sessStatus(s)];
        return '<div class="brow click" data-q="' + esc(s.id) + '"><span class="nm">' + S(s.title) + '</span>' +
          '<span class="tx">' + S(s.text) + '</span><span class="chip ' + cfg.cls + '">' + cfg.txt + '</span></div>';
      }).join("")
    : '<div class="empty-line">还没有处置记录 —— 在下面输入框贴一句客户原话即可。</div>';

  return '<div class="board fade-in">' +
    '<div class="board-top"><h1>处置台</h1><span class="sub">' +
      (mcp && mcp.ready ? "MCP 已联通 · " + mcp.tools.length + " 个数据工具" : "数据源未联通，正在以本地文件通路取数") +
    '</span></div>' +
    '<div class="bsec"><div class="bt"><span>数据已接入</span><span class="sp"></span>' +
      '<button class="btn sm" data-goto-sources="1">接入数据</button></div>' + srcChips + '</div>' +
    '<div class="bsec focus"><div class="bt"><span>等你拍板</span><span class="sp"></span>' +
      (todo.length ? '<span class="chip wait">' + todo.length + ' 条</span>' : "") + '</div>' + todoRows + '</div>' +
    (fuOpen.length
      ? '<div class="bsec focus"><div class="bt"><span>等你接手</span><span class="sp"></span>' +
        '<span class="chip mute">' + fuOpen.length + ' 条</span></div>' + fuRows +
        '<div class="empty-line">这些是它拦下或没问清的 —— 点进去就能接手、记跟进、或补上客户给的事实让它重跑。</div></div>'
      : "") +
    '<div class="bsec"><div class="bt"><span>最近的处置</span><span class="sp"></span></div>' + recentRows + '</div>' +
    '</div>';
}

/* ═══════════ 渲染：数据源页 ═══════════ */
function srcStatusChip(c, mcpReady) {
  if (c.kind !== "mcp") return '<span class="chip mute">' + (c.kind === "file" ? "按需导入" : "入站口就绪") + '</span>';
  if (!mcpReady) return '<span class="chip mute">本地文件通路</span>';
  const live = c.tools.filter((t) => (t.op === "list" || t.op === "get") && t.live).length;
  const total = c.tools.filter((t) => t.op === "list" || t.op === "get").length;
  return '<span class="chip ' + (live === total ? "ok" : "wait") + '">' + (live === total ? "已联通" : "部分联通") + ' ' + live + "/" + total + '</span>';
}

function srcCardHtml(c, mcpReady) {
  const busy = st.srcBusy === c.id;
  const note = st.srcNote[c.id];
  const datasets = c.datasets.length
    ? '<div class="src-meta">' + c.datasets.map((d) => '<span class="dschip">' + esc(d.label) + ' <b>' + d.rows + '</b> 条</span>').join("") +
      '<span class="dschip off">来源 ' + esc(c.platforms.join(" / ")) + '</span></div>'
    : '<div class="src-meta"><span class="dschip off">来源 ' + esc(c.platforms.join(" / ")) + '</span></div>';

  const act = c.kind === "mcp"
    ? '<button class="btn sm' + (busy ? "" : "") + '" data-pull="' + esc(c.id) + '"' + (busy ? " disabled" : "") + '>' + (busy ? "拉取中…" : "拉取数据") + '</button>'
    : c.kind === "file"
      ? '<button class="btn sm" data-goto-import="1">去导入</button>'
      : '<button class="btn sm" data-goto-wx="1">去投递</button>';

  const tools = c.tools.map((t) => {
    const mark = (t.op === "list" || t.op === "get")
      ? ' <span class="' + (t.live ? "tool-on" : "tool-off") + '">' + (t.live ? "●" : "○") + '</span>'
      : "";
    return '<code>' + esc(t.fq) + '</code> ' + esc(t.title) + mark;
  }).join("<br>");

  return '<div class="src-card' + (busy ? " busy" : "") + '">' +
    '<div class="src-head"><span class="bdg ' + (c.kind === "mcp" ? "" : c.kind === "file" ? "file" : "hook") + '">' + esc(c.badge) + '</span>' +
      '<span class="nm">' + esc(c.name) + '</span>' + srcStatusChip(c, mcpReady) +
      '<span class="sp"></span>' + act + '</div>' +
    '<div class="src-body"><div class="src-desc">' + esc(sanitize(c.desc)) + '</div>' + datasets +
      '<div class="src-tools">' + tools + '</div>' +
      (note ? '<div class="src-note' + (note.bad ? " bad" : "") + '">' + note.html + '</div>' : "") +
    '</div></div>';
}

function sourcesHtml() {
