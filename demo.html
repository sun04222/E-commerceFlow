/**
 * 数据通道状态。
 *
 * 上一版这一页只有一句「MCP 未联通 · 走本地文件通路」，把「不通」当成结论就结束了 ——
 * 人看不出是不通还是慢、是通道坏了还是数据没有、点哪里能修。
 * 这一块把探测到的事实逐条摆出来（都是真测的），并给一个「重连」，
 * 不通时还要说清一件事：数据照样能取，只是换了一条路。
 */
function mcpPanelHtml(mcp) {
  const m = mcp || { ready: false, problem: "还没有读到通道状态", tools: [] };
  const info = m.serverInfo || {};
  // 单文件版没有进程可拉：不摆一个点了必然失败的按钮（与接口设置页同一条纪律）
  const canRetry = m.can_reconnect !== false;
  const rows = [
    ["连接方式", canRetry ? "MCP · 本地进程通道" : "MCP · 本形态无进程，走文件通路"],
    ["服务端", esc(info.name || "—")],
    ["工具前缀", "<code>" + esc(m.namespace || "—") + ".</code>"],
    ["在线工具", m.ready ? m.tools.length + " 个" : "0 个"],
    ["握手耗时", m.ready && m.handshakeMs ? m.handshakeMs + " 毫秒" : "—"],
    ["单次调用上限", m.timeoutMs ? Math.round(m.timeoutMs / 1000) + " 秒" : "—"],
    ["尝试连接", canRetry ? (m.attempts || 0) + " 次" : "这一形态不适用"],
  ].map(([k, v]) => '<div class="kvlist"><span class="k">' + esc(k) + '</span><span class="v">' + v + '</span></div>').join("");

  const problem = !m.ready && m.problem
    ? '<div class="src-note bad chan-problem"><b>为什么不通：</b>' + esc(sanitize(m.problem)) + '</div>' +
      '<div class="chan-fallback">这不影响取数 —— 点「拉取数据」会改走本地文件通路，' +
      '读到的是同一份数据、走同一套校验，条数与在线时一致。</div>'
    : "";

  return '<div class="panel">' +
    '<div class="panel-head"><b>数据通道</b>' +
      (m.ready ? '<span class="chip ok">联通</span>' : '<span class="chip wait">未联通</span>') +
      '<span class="sub">' + (m.ready ? "正在用 MCP 协议从连接器取数" + (info.version ? "（服务端 " + esc(info.version) + "）" : "") : "当前以本地文件通路取数") + '</span>' +
      '<span class="sp"></span>' +
      (canRetry
        ? '<button class="btn sm" data-mcp-reconnect="1"' + (st.mcpBusy ? " disabled" : "") + '>' +
          (st.mcpBusy ? "重连中…" : "重连") + '</button>'
        : '<span class="chan-static">单文件版没有可重连的进程</span>') +
    '</div>' +
    '<div class="panel-body"><div class="chan-grid">' + rows + '</div>' + problem + '</div></div>';
}

/**
 * 正在跑的那一条：只说明「在跑、跑了多久、可以不等了」。
 *
 * 上一版这里放六行骨架 + 一条不定进度线 —— 骨架只能表达「在跑」，表达不了跑到哪。
 * 现在过程由真实事件驱动、就在下方时间线里逐条长出来，骨架反而成了多余的噪声：
 * 有真东西看的时候，就不该再摆一个假形状。
 */
function pendingCardHtml(s) {
  const slow = st.mode === "model";
  return '<div class="msg agent"><div class="who"><span class="av" aria-hidden="true">A</span>' +
    '<span class="nm">售后 Agent</span><span class="chip run">处理中</span></div>' +
    '<div class="bubble run-line"><span class="spin" aria-hidden="true"></span>' +
    '<span>' + (slow ? "正在跑这条链路（智能判定一条约 20–30 秒）" : "正在跑这条链路") + '</span>' +
    '<span class="el" data-elapsed="' + esc(s.id) + '" aria-live="polite">0 秒</span>' +
    '<button class="btn sm" data-cancel-run="' + esc(s.id) + '">取消等待</button></div></div>';
}

/**
 * 没跑通的样子。
 *
 * 上一版的写法是把这条记录直接删掉、只弹一句 toast —— 于是「刚才跑的是什么、
 * 为什么没成、还能不能再试一次」三件事一起消失，而这三件事恰好是失败的
 * 时候唯一还值得看的东西。这里就地留下：原因、下一步、以及一个原样重试的入口。
 *
 * 不写「请稍后再试」这种空话；只给这一条现在真的能做的事。
 */
function failCardHtml(s) {
  const e = s.error || {};
  const reason = sanitize(e.msg || "服务没有返回结果");
  const hint = e.hint ? sanitize(e.hint) : "";
  const cfgBtn = e.kind === "model" ? '<button class="btn sm" data-goto-config="1">去接口设置</button>' : "";
  return '<div class="msg agent"><div class="who"><span class="av">A</span>售后 Agent' +
      '<span class="chip bad">未跑通</span></div>' +
    '<div class="bubble fail-bubble">' +
      '<div class="fb-t">这一条没有跑通</div>' +
      '<div class="fb-r">' + esc(reason) + '</div>' +
      (hint ? '<div class="fb-h">' + esc(hint) + '</div>' : "") +
      '<div class="fb-act">' +
        // 重试是这张卡唯一的主操作，用正常字号而不是 sm：11.5px 下中文合成加粗会糊成一团
        '<button class="btn primary" data-retry-run="' + esc(s.id) + '">重试这一条</button>' + cfgBtn +
        '<span class="fb-note">原话已保留，重试会把流程重走一遍</span>' +
      '</div>' +
      '<div class="fb-h">失败不留任何处置动作 —— 这条没有被执行，也没有动过客户的钱。</div>' +
    '</div></div>';
}

/* ═══════════ 接口设置（模型通道） ═══════════
   模型通道是本工程唯一的外部依赖，原先只写在项目根的 .env 里。
   对会开终端的人不算事，但「换一个密钥」不该要求人先去翻文件 ——
   这一页就是把那四行搬进界面：改完立刻生效，不用重启。

   边界写在代码旁边，因为越界一次就会出事：
     · 密钥只回尾 4 位。接口、界面、日志都不出现完整值。
     · 密钥框留空 = 保持原值。要清空得单独勾 —— 不能让「没填」等于「清掉」。
     · 保存后重载配置缓存。否则文件改了、进程里还是旧值，
       表现为「保存成功但不生效」，是最难查的一类问题。
     · 单文件版没有服务端，这一页如实说明，不渲染一个填了也存不下去的死表单。 */

function cfgProblemText(p) {
  const t = String(p || "");
  if (!t) return "";
  if (/占位/.test(t)) return "访问密钥还是占位文字，需要换成一个真实可用的密钥。";
  if (/缺少/.test(t)) return "接口地址、模型名称、访问密钥三项都必填，现在还没填齐。";
  return t;
}

/** 只取主机名给人看 —— 完整地址太长，状态卡里放不下也没必要 */
function cfgHost(u) {
  const m = String(u || "").match(/^https?:\/\/([^/]+)/i);
  return m ? m[1] : String(u || "").replace(/^https?:\/\//i, "");
}

function cfgHtml() {
  const c = st.cfg;
  /* 「填齐了」和「真的连得上」是两件事。没验过之前不说可用 ——
     只填齐就宣称可用，等于替服务商打包票。 */
  const chipCls = !c ? "" : (!c.usable ? "wait" : (st.cfgTested ? "ok" : "wait"));
  const chipTxt = !c ? "" : (!c.editable ? "此形态不可配置" : (!c.usable ? "模型通道未就绪" : (st.cfgTested ? "连通已验证" : "模型通道已填齐")));
  const head = '<div class="phead"><h1>接口设置</h1>' +
    (c ? '<span class="chip ' + chipCls + '">' + chipTxt + '</span>' : "") +
    '<span class="sp"></span></div>';

  if (!c) {
    return '<div class="wrap2 fade-in">' + head + '<div class="cfg-wrap">' +
      '<div class="empty-line loading-line">读取中…</div></div></div>';
  }

  /* 单文件版：没有进程可以写回配置。如实说清，不给一个填了也存不下去的表单 */
  if (!c.editable) {
    return '<div class="wrap2 fade-in">' + head + '<div class="cfg-wrap">' +
      '<div class="cfg-state bad"><span class="k">当前形态不能在这里改。</span>' +
        '<span>' + esc(c.reason || "这一页需要本地服务端才能保存配置。") + '</span></div>' +
      '<div class="cfg-card"><div class="cfg-note">' +
        '<b>要换模型接口，请用本地服务模式打开这一页：</b>' +
        '<div class="cfg-cmd">node desktop/server.mjs</div>' +
        '<div class="cfg-cmd">然后打开 http://127.0.0.1:8787/</div>' +
        '<div class="mt-10">单文件版双击即用、不用装任何东西，代价是它只有一个离线规则引擎，' +
          '<b>没有进程可以写回配置</b>。两种形态的判定结论口径完全一致。</div>' +
      '</div></div></div></div>';
  }

  const stateCard = cfgStateHtml(c);

  /* 环境变量会盖掉配置文件。不说，就会出现「改了没反应」而又查不出原因 */
  const shadow = (c.shadowed || []).length
    ? '<div class="cfg-warn"><span>!</span><span>这台机器上有环境变量正在覆盖配置文件（' +
      esc((c.shadowed || []).join("、")) + '）。写进文件的值对它们不起作用，' +
      '要让这里的修改生效，得先把对应的环境变量去掉。</span></div>'
    : "";

  return '<div class="wrap2 fade-in">' + head + '<div class="cfg-wrap">' +
    stateCard +
    '<div class="cfg-card">' +
      '<div class="cfg-row"><label for="cfgBase">接口地址</label>' +
        '<input id="cfgBase" type="text" spellcheck="false" autocomplete="off" value="' + esc(c.baseUrl) + '" placeholder="https://…">' +
        '<div class="hint">模型服务的基础地址，程序会在末尾自动拼上 /chat/completions。</div></div>' +
      '<div class="cfg-grid2">' +
        '<div class="cfg-row"><label for="cfgModel">模型名称</label>' +
          '<input id="cfgModel" type="text" spellcheck="false" autocomplete="off" value="' + esc(c.model) + '" placeholder="例如 glm-4-flash"></div>' +
        '<div class="cfg-row"><label for="cfgTimeout">单次超时（秒）</label>' +
          '<input id="cfgTimeout" type="number" min="1" max="600" step="1" value="' + esc(String(c.timeout || 60)) + '"></div>' +
      '</div>' +
      '<div class="cfg-row"><label for="cfgKey">访问密钥</label>' +
        '<input id="cfgKey" type="password" spellcheck="false" autocomplete="new-password" placeholder="' + esc(c.key_mask || "未设置") + '">' +
        '<div class="hint" id="cfgKeyHint">' + cfgKeyHintHtml(c) + '</div></div>' +
      '<label class="cfg-clear"><input type="checkbox" id="cfgClearKey"> 清除已保存的密钥</label>' +
      shadow +
      '<div class="cfg-acts">' +
        '<button class="btn primary" id="cfgSave">保存并生效</button>' +
        '<button class="btn" id="cfgTest">测试连通</button>' +
        '<span class="hint">保存后立刻生效，不用重启服务</span>' +
      '</div>' +
      '<div class="cfg-out" id="cfgOut">' + esc(st.cfgOut || "") + '</div>' +
      '<div class="cfg-note mt-10">「测试连通」用的是已经<b>保存</b>的配置 —— 改完先保存再测。</div>' +
    '</div>' +
    '<div class="cfg-card"><div class="cfg-note">' +
      '<b>这些值存在哪。</b>存在项目根目录的 <code>.env</code> 里，只留在本机、不上传到任何地方。' +
      '保存时只改这四行，文件里的注释与其余内容原样保留。' +
      '界面上任何时候都只显示密钥末 4 位，完整值不会回传。' +
    '</div></div>' +
  '</div></div>';
}

/* 状态卡与密钥提示拆成独立函数：保存 / 测试连通之后只换这两块，
   不去重画整张表单 —— 重画就会把光标冲掉（输入到一半被抢焦点是最恼人的那种）。 */
function cfgStateHtml(c) {
  return c.usable
    ? '<div class="cfg-state ok" id="cfgState"><span class="k">' + (st.cfgTested ? "已就绪。" : "已填齐。") + '</span><span>' +
      esc(cfgHost(c.baseUrl) || "接口地址") + ' · ' + esc(c.model || "") + " —— " +
      (st.cfgTested
        ? "刚刚试过，连通正常，可以用智能模型判定，一条大约 20–30 秒。"
        : "三项都填好了，但还没验过它能不能真连上 —— 点「测试连通」确认一下。") +
      "</span></div>"
    : '<div class="cfg-state bad" id="cfgState"><span class="k">还差一步。</span><span>' +
      esc(cfgProblemText(c.problem)) + "</span></div>";
}

function cfgKeyHintHtml(c) {
  return c.key_set
    ? "已保存一个密钥（末 4 位 <b>" + esc(c.key_mask || "****") + "</b>）。留空表示沿用，要换就整条填新的。"
    : "还没有可用的密钥。填一条完整密钥后保存。";
}

/**
 * 只刷新配置页的可变部分：状态卡、密钥提示、回执区、按钮态。
 * **不动输入框里的值，也不动光标位置** —— 这是分片渲染在配置页上的全部意义。
 */
function patchCfg() {
  const c = st.cfg;
  const busy = !!st.cfgBusy;
  const s = $("cfgState");
  if (s && c && c.editable) s.outerHTML = cfgStateHtml(c);
  const kh = $("cfgKeyHint");
  if (kh && c && c.editable) kh.innerHTML = cfgKeyHintHtml(c);
  const out = $("cfgOut");
  if (out) out.textContent = st.cfgOut || "";
  const sb = $("cfgSave");
  if (sb) { sb.disabled = busy; sb.textContent = busy === "save" ? "保存中…" : "保存并生效"; }
  const tb = $("cfgTest");
  if (tb) { tb.disabled = busy; tb.textContent = busy === "test" ? "连接中…" : "测试连通"; }
}

async function loadConfig() {
  st.cfgBusy = "load";
  st.cfgTested = false;   // 换了页面就重来：上一次的验证结论不代表这一次
  try {
    st.cfg = await api("/api/config");
  } catch (e) {
    st.cfg = { ok: false, editable: false, reason: "读取配置失败：" + e.message };
  }
  st.cfgBusy = "";
  if (st.view === "config") renderOnly("stage");
}

/** 表单值一律读 DOM 当前值。st.cfg 里的副本只用于渲染，
    拿它当提交内容会在「改了但没重渲染」时默默地提交旧值 */
function cfgVal(id) {
  const el = $(id);
  return el ? String(el.value || "").trim() : "";
}

async function saveConfig() {
  if (st.cfgBusy) { toast("上一次还没结束，稍等一下", ""); return; }
  const base = cfgVal("cfgBase");
  const model = cfgVal("cfgModel");
  const timeout = cfgVal("cfgTimeout");
  const key = cfgVal("cfgKey");
  const clear = !!($("cfgClearKey") && $("cfgClearKey").checked);

  if (!/^https?:\/\/.+/i.test(base)) { toast("接口地址要以 http:// 或 https:// 开头", "bad"); if ($("cfgBase")) $("cfgBase").focus(); return; }
  if (!model) { toast("模型名称不能为空", "bad"); if ($("cfgModel")) $("cfgModel").focus(); return; }
  const t = Number(timeout);
  if (!(t >= 1 && t <= 600)) { toast("超时请填 1–600 秒之间的数字", "bad"); if ($("cfgTimeout")) $("cfgTimeout").focus(); return; }

  const body = { baseUrl: base, model: model, timeout: t };
  if (key) body.apiKey = key;
  if (clear) body.clear_key = true;   // 留空 ≠ 清空，要清空必须走这个开关

  st.cfgBusy = "save";
  const b = $("cfgSave");
  if (b) { b.disabled = true; b.textContent = "保存中…"; }
  try {
    st.cfg = await api("/api/config", body);
    st.cfgTested = false;   // 刚改过，之前验过的结论作废，要用新值重验
    // 保存完必须把「现在到底能用什么」重新问一遍：
    // 否则顶栏还挂着旧的判定方式，界面与真实配置对不上
    st.boot = await api("/api/bootstrap");
    let pref = "";
    try { pref = localStorage.getItem("aftersales.mode") || ""; } catch (e) { /* 忽略 */ }
    if (!st.cfg.usable) st.mode = "offline";
    else st.mode = pref === "offline" ? "offline" : "model";  // 用户自己选过规则判定就别替他改
    st.cfgOut = "";
    setEngineTag();
    toast(st.cfg.usable
      ? (st.mode === "model" ? "已保存并生效，当前用智能模型判定" : "已保存。当前仍在用内置规则判定，顶栏可随时切换")
      : "已保存。但通道还不完整，先用内置规则判定", st.cfg.usable ? "ok" : "");
  } catch (e) {
    toast("保存失败：" + e.message, "bad");
  } finally {
    st.cfgBusy = "";
    // 只刷新状态卡 / 提示 / 按钮与右栏，不重画表单：刚填完的输入框与光标都留着
    patchCfg();
    renderOnly("side", "chrome");
  }
}

/** 试一次真实的模型调用 —— 不伪造结果：连不上就照实说连不上 */
async function testConfig() {
  if (st.cfgBusy) { toast("上一次还没结束，稍等一下", ""); return; }
  st.cfgBusy = "test";
  const b = $("cfgTest");
  const out = $("cfgOut");
  if (b) { b.disabled = true; b.textContent = "连接中…"; }
  if (out) out.textContent = "正在请求一次极短的补全，通常 1–3 秒…";
  const t0 = Date.now();
  let lines;
  try {
    const r = await api("/api/config/test", {});
    lines = [
      "连通正常 · 用时 " + (r.latency_ms != null ? r.latency_ms : (Date.now() - t0)) + " ms",
      "模型：" + (r.model || ""),
      "返回：" + (r.reply || "（空）"),
    ];
    st.cfgTested = true;
    toast("模型通道连通正常", "ok");
  } catch (e) {
    lines = [
      "没有连上 · 用时 " + (Date.now() - t0) + " ms",
      e.message,
      "",
      "常见原因：地址或模型名不对、密钥无效或已过期、本机访问不到这个地址。",
    ];
    st.cfgTested = false;
    toast("连接失败：" + e.message, "bad");
  }
  st.cfgOut = lines.join("\n");
  st.cfgBusy = "";
  // 重渲染一次才能把角标从「已填齐」换成「连通已验证」，顺带把按钮恢复成可点；
  // 但只换这几块，输入框与光标不动
  if (st.view === "config") { patchCfg(); renderOnly("side"); }
}

/** 客户原话气泡。位上只有一个来源（手贴/样例/微信入站），显示上也只有一种样子 */
function custBubble(text, who) {
  return '<div class="msg cust"><div class="who"><span class="av" aria-hidden="true">客</span>' +
    '<span class="nm">' + esc(who || "客户原话") + '</span></div>' +
    '<div class="bubble">' + S(text) + '</div></div>';
}

/**
 * 停在审批的这条：审批卡**就地**出现在对话流里（审批做成消息块，而不是把人打发到另一个页面）。
 * 三件事必须成立，否则这张卡不如不放：
 *   ① 单子还在手上（st.approvals 里有它）才给「批准/驳回」—— 句柄没了就只剩重跑；
 *   ② 批准后由 Agent 自己续办结单，不需要人再点第二次；
 *   ③ 拿不准的地方照样列出来，别让人对着结论盖章。
 */
function inlineApprovalHtml(s) {
  const pa = s.result && s.result.pending_approval;
  if (!pa) return "";
  const live = (st.approvals || []).find((x) => x.id === pa.id);
  const card = live || Object.assign({}, pa, {
    stale: true,
    stale_reason: "这条处置流程的续办句柄已经不在了（服务重启或页面重开）",
    msg_id: s.msgId || null,
  });
  return '<div class="msg agent"><div class="who"><span class="av" aria-hidden="true">A</span>' +
    '<span class="nm">售后 Agent</span><span class="chip wait">等你拍板</span></div>' +
    approvalCardHtml(card, true) + '</div>';
}

function stageHtml() {
  if (st.view === "config") return cfgHtml();
  if (st.view === "approvals") return approvalPageHtml();
  if (st.view === "sources") return sourcesHtml();
  const s = st.sessions.find((x) => x.id === st.cur);
  if (!s) return boardHtml();
  return '<div class="wrap fade-in"><div class="thread">' +
    custBubble(s.text) +
    (s.error ? failCardHtml(s) : "") +
    (!s.error && s.pending
      ? pendingCardHtml(s) + '<div id="tlLive">' + renderWork(null, "run", s.run) + '</div>'
      : "") +
    // 结论在前、过程在后：先回答「这事办完了没有」，想看它怎么走到这一步的往下翻。
    // 「停办等人」的案子还要更进一步：审批卡必须紧跟在结论下面 ——
    // 它等的就是人，让人再往下滚一屏才找到裁定按钮，等于没做这件事。
    (s.result ? verdictHtml(s.result, s) : "") +
    (s.result ? inlineApprovalHtml(s) : "") +
    (s.result ? renderWork(s.result, "done", s.run) : "") +
    (s.result ? renderResult(s.result, s) : "") +
    '</div></div>';
}

/**
 * 结论卡：这条案子最后到底怎么样了 —— 一句话 + 金额 + 唯一该点的那个动作。
 *
 * 它被单独拆出来，是因为它必须排在执行过程**前面**：
 * 一屏之内先给答案，想看过程的往下翻。上一版把结论压在 430px 的时间线下面，
 * 打开一条案子第一眼看到的是「第 2 步做了什么」，而不是「这事办完了没有」。
 */
/** 结论的那一句话。抽出来是因为它有两个消费方：结论卡本身，和读屏播报 */
function verdictHead(r) {
  const rv = r.review || {};
  const verdictTxt = sanitize(rv.verdict || "");
  if (r.pending_approval) {
    return { cls: "wait", icon: "!", title: "已停办，等你拍板", sub: "该笔处置超出 Agent 的自动处置范围。批准后它会立即执行并结单，不需要你再操作一次。" };
  }
  if (r.auth && r.auth.approval_decision === "REJECTED" && !r.executed_tool) {
    return { cls: "bad", icon: "⊘", title: "审批未通过，未执行任何处置", sub: "该笔处置经人工复核后未予通过，Agent 没有动过客户的钱，已转交专人向客户说明并跟进。" };
  }
  if (verdictTxt.indexOf("未通过") === 0) {
    return { cls: "bad", icon: "✕", title: "已拦截，未执行任何处置", sub: "合规复核未通过：" + verdictTxt.replace(/^未通过：?/, "") + "。已按规则转为向客户核实或转交专人。" };
  }
  if (rv.verdict === "CLARIFY_NEEDED") {
    return { cls: "mute", icon: "?", title: "需客户补充信息", sub: "诉求信息不足，Agent 没有猜，而是先向客户追问。" };
  }
  if (r.executed_tool) {
    return { cls: "ok", icon: "✓", title: "已自主完成处置", sub: "Agent 独立走完全流程并完成了处置，未打扰任何人。过程与依据见下方。" };
  }
  return { cls: "mute", icon: "•", title: "已处理", sub: sanitize(r.execution_outcome) };
}

/** 读屏播报：视觉上不出现一个字，但结果与状态变化会被念出来 */
function liveSay(text) {
  const el = $("srLive");
  if (el) el.textContent = String(text || "");
}

function verdictHtml(r, s) {
  const fk = s ? (fuKey(s) || s.id) : "";
  const auth = r.auth;
  const head = verdictHead(r);
  return '<div class="verdict ' + head.cls + '" role="status">' +
    '<div class="vd-icon" aria-hidden="true">' + head.icon + '</div>' +
    '<div class="vd-main"><div class="vd-title">' + esc(head.title) + '</div>' +
      '<div class="vd-sub">' + esc(head.sub) + '</div></div>' +
    (auth && auth.amount ? '<div class="vd-amt"><b>' + yuan(auth.amount) + '</b><span>处置金额</span></div>' : "") +
    '<div class="vd-act">' +
      (r.pending_approval
        ? '<button class="btn sm primary" data-goto-appr="1">去审批中心</button>'
        : (needsFollowUp(r) ? '<button class="btn sm" data-goto-fu="' + esc(fk) + '">去跟进</button>' : "")) +
    '</div>' +
  '</div>';
}

function renderResult(r, s) {
  // 这条案子的跟进地址。按钮必须带上它 —— 不带就只能「跳去第一条待接手」，那不叫去跟进
  const fk = s ? (fuKey(s) || s.id) : "";
  const cfg = STATUS_TEXT[statusOf(r)];
  const auth = r.auth;
  const j = r.judge || {};
  const rv = r.review || {};
  const cls = r.classification || {};
  const verdictTxt = sanitize(rv.verdict || "");

  const basisRows = [];
  if (cls.case_name) basisRows.push(["案件类型", sanitize(cls.case_name)]);
  if (cls.because) basisRows.push(["分类依据", sanitize(cls.because)]);
  if (j.decision) basisRows.push(["处置建议", sanitize(j.decision) + (j.amount ? "　金额 " + yuanShort(j.amount) : "")]);
  const crit = (j.criteria || []).map((c) => sanitize(c.statement));
  if (crit.length) basisRows.push(["判断依据", crit.join("；")]);
  if ((rv.findings || []).length) basisRows.push(["复核意见", rv.findings.map((f) => sanitize(f.because)).join("；")]);

  const authRows = [];
  if (auth) {
    authRows.push(["授权档位", sanitize(auth.label) + "（" + sanitize(auth.tier) + "）"]);
    authRows.push(["分档理由", sanitize(auth.because)]);
    if (auth.approver) authRows.push(["审批人", sanitize(auth.approver)]);
    if (auth.approval_decision) authRows.push(["审批结论", sanitize(auth.approval_decision)]);
  } else {
    authRows.push(["授权档位", "无需审批"]);
    authRows.push(["说明", "本次不涉及资金或不可逆动作"]);
  }
  authRows.push(["执行结果", sanitize(r.execution_outcome)]);

  return '<div class="result">' +
    '<div class="result-head"><span class="chip ' + cfg.cls + '">' + cfg.txt + '</span>' +
      '<span class="t">' + S(cls.case_name || "") + '</span></div>' +
    '<div class="result-sec"><div class="st">处理结论</div>' +
      '<div class="kvlist"><span class="k">复核结论</span><span class="v">' + S(verdictTxt || "—") + '</span></div>' +
      basisRows.map((x) => '<div class="kvlist"><span class="k">' + esc(x[0]) + '</span><span class="v">' + S(x[1]) + '</span></div>').join("") +
    '</div>' +
    '<div class="result-sec"><div class="st">授权与执行</div>' +
      authRows.map((x) => '<div class="kvlist"><span class="k">' + esc(x[0]) + '</span><span class="v">' + S(x[1]) + '</span></div>').join("") +
    '</div>' +
    '<div class="result-sec"><div class="st">给客户的回复</div>' +
      '<div class="reply-box" id="replyText">' + S(r.reply ? r.reply.customer_text : "") + '</div>' +
      '<div class="reply-foot"><button class="btn sm" id="btnCopy">复制回复</button>' +
      (r.reply && r.reply.follow_up_required
        ? '<button class="chip wait chip-btn" data-goto-fu="' + esc(fk) + '">需人工跟进 · 去跟进</button>'
        : '<span class="chip ok">已结单</span>') +
      '</div></div></div>';
}

/* ═══════════ 渲染：右栏 = 处置详情 ═══════════ */
function sideSourcesHtml() {
  const s = st.sources;
  if (!s) return '<div class="empty-side"><div class="big">⇄</div>读取中…</div>';
  const mcp = s.mcp || {};
  // 先讲人话，再附上对接人才看得懂的标识（标识用代码形式标注，与其余集成标识同一处理方式）
  const proto = esc(s.protocol || "mcp");
  return '<div class="sec"><div class="st">取数通道</div>' +
      '<div class="kvlist"><span class="k">取数方式</span><span class="v">本地服务直连（<code>' + proto + '/stdio</code>）</span></div>' +
      '<div class="kvlist"><span class="k">服务端</span><span class="v">' + esc(mcp.ready ? ((mcp.serverInfo && mcp.serverInfo.name) || "已联通") + " " + ((mcp.serverInfo && mcp.serverInfo.version) || "") : "未联通") + '</span></div>' +
      '<div class="kvlist"><span class="k">工具数</span><span class="v">' + (mcp.ready ? mcp.tools.length : 0) + ' 个</span></div>' +
      (mcp.ready ? "" : '<div class="kvlist"><span class="k">原因</span><span class="v">' + S(mcp.problem || "") + '</span></div>') +
    '</div>' +
    '<div class="sec"><div class="st">库内规模</div>' +
      s.datasets.map((d) => '<div class="kvlist"><span class="k">' + esc(d.label) + '</span><span class="v">' + d.rows + ' 条</span></div>').join("") +
    '</div>' +
    '<div class="sec"><div class="st">连接器 <span class="hint">' + s.connectors.length + ' 个</span></div>' +
      s.connectors.map((c) => '<div class="kvlist"><span class="k">' + esc(c.badge) + '</span><span class="v">' + esc(c.name) + '</span></div>').join("") +
    '</div>' +
    '<div class="sec"><div class="st">入站</div>' +
      '<div class="kvlist"><span class="k">已收消息</span><span class="v">' + st.inbound.length + ' 条</span></div>' +
      '<div class="kvlist"><span class="k">去重命中</span><span class="v">' + st.inbound.filter((x) => x.status === "duplicate").length + ' 条</span></div>' +
    '</div>';
}

/**
 * 人工跟进台账 —— 只在「Agent 交不出来、要人接」的案子上出现。
 * 它存在的理由：「已转交专人跟进」如果只是文案，人就真没地方接手。
 */
function fuHtml(s) {
  const fu = fuOf(s) || { owner: "", status: "todo", log: [] };
  const stTxt = FU_STATUS_TEXT[fu.status] || "待跟进";
  const chipCls = fu.status === "closed" ? "ok" : (fu.status === "todo" ? "mute" : "wait");
  const rows = (fu.log || []).slice().reverse().map((e) => {
    const t = String(e.at || "").replace("T", " ").slice(5, 16);
    const note = e.note ? '<div class="l2">' + S(e.note) + '</div>' : "";
    const extra = e.action === "reassign" && e.target ? " → " + S(e.target) : "";
    return '<li><div class="l1">' + S(e.label || FU_ACTION_TEXT[e.action] || "跟进") + extra +
      '<span class="t">' + S(e.by || "") + " · " + t + '</span></div>' + note + '</li>';
  }).join("");
  return '<div class="fu" id="fuPanel">' +
    '<div class="fu-h"><span class="st2">人工跟进</span>' +
      '<span class="chip ' + chipCls + '">' + esc(stTxt) + '</span>' +
      '<span class="who">' + (fu.owner ? "跟进人 " + S(fu.owner) : "还没有人接手") + '</span></div>' +
    '<div class="fu-b">' +
      '<div class="fu-line"><input id="fuBy" placeholder="跟进人署名" value="' + esc(st.fuBy || st.approver || "") + '"></div>' +
      '<div class="fu-acts">' +
        '<button class="btn sm" data-fu="claim"' + (st.fuBusy ? " disabled" : "") + '>接手跟进</button>' +
        '<button class="btn sm" data-fu="wait"' + (st.fuBusy ? " disabled" : "") + '>已联系客户，等补充</button>' +
        '<button class="btn sm" data-fu="close"' + (st.fuBusy ? " disabled" : "") + '>核实完毕，结单</button>' +
      '</div>' +
      '<div class="fu-line"><textarea id="fuNote" placeholder="跟进记录；或把客户补充到的事实写在这里，再点「按补充事实重新处置」">' + esc(st.fuNote || "") + '</textarea></div>' +
      '<div class="fu-acts">' +
        '<button class="btn sm" data-fu="note"' + (st.fuBusy ? " disabled" : "") + '>记一条</button>' +
        '<button class="btn sm primary" data-fu="rerun"' + (st.fuBusy ? " disabled" : "") + '>按补充事实重新处置</button>' +
      '</div>' +
      '<div class="fu-line split"><input id="fuTo" placeholder="转交给谁" value="' + esc(st.fuTo || "") + '">' +
        '<button class="btn sm" data-fu="reassign"' + (st.fuBusy ? " disabled" : "") + '>转交</button></div>' +
      ((fu.log || []).length
        ? '<ul class="fu-log">' + rows + '</ul>'
        : '<div class="fu-empty">还没有跟进记录。填上署名点「接手跟进」，这条就归你；客户补到新事实时，写进上面的框里点「按补充事实重新处置」，它会带着新事实重跑一遍链路。</div>') +
    '</div></div>';
}

/**
 * 同类案子过去怎么处理的 —— 只作参考，不影响本条的判断。
 *
 * 两件事必须做到：
 *   ① 每条都说清「为什么是它」（同案型 / 金额接近 / 措辞相近），
 *      而不是甩一个相似度分数 —— 售后结论要能被追问。
 *   ② 标题上就写「只作参考」，末尾再说一遍。记忆一旦被当成判定依据，
 *      它就成了绕过审批的后门：金额档位只认订单账本，不认经验。
 */
function memHtml(hits) {
  const rows = hits.map((h) => {
    // 裁决码统一走净化层（不另立一份文案表：同一业务口径只允许有一处）
    const vt = sanitize(h.verdict || "");
    const v = /^未通过/.test(vt) ? { t: esc(vt), cls: "stop" }
      : (vt === "复核通过" ? { t: esc(vt), cls: "ok" } : { t: esc(vt || "未注明结果"), cls: "wait" });
    const t = String(h.at || "").replace("T", " ").slice(5, 16);
    const amt = h.amount != null ? yuanShort(h.amount) : "无金额";
    return '<li class="mem-li">' +
        '<div class="m1"><span class="mn">' + S(h.case_name || "同类诉求") + '</span>' +
          '<span class="chip ' + v.cls + '">' + v.t + '</span>' +
          '<span class="mt">' + esc(t) + " · " + esc(amt) + '</span></div>' +
        '<div class="m2">' + S((h.why || []).join("；")) + '</div>' +
      '</li>';
  }).join("");
  return '<div class="sec"><div class="st">同类案子过去怎么处理的 <span class="hint">' + hits.length + ' 条 · 只作参考</span></div>' +
      '<ul class="mem-ul">' + rows + '</ul>' +
      '<div class="mem-note">这是过去处理同类诉求留下的记录，用来了解常见的处理方式。本条仍按这次调取的资料与政策来判断，不受这些记录左右。</div>' +
    '</div>';
}

/** 今天等你动手的三件事：数字即入口，点哪个就跳到哪 */
function openFollowUpCount() {
  return st.sessions.filter((s) => needsFollowUp(s.result) && (!fuOf(s) || fuOf(s).status !== "closed")).length;
}

/** 右栏默认态：没选中案子时，这一栏给今天的概览与眼下能做的事，而不是一句「请选一条」 */
/** 配置页的右栏。不重复左边的表单，只补三件左边放不下的事：
    这四项影响什么、两种判定方式的取舍、密钥怎样被对待 */
function sideConfigHtml() {
  const c = st.cfg;
  const ok = !!(c && c.usable);
  const conns = (st.sources && st.sources.connectors) || [];
  return '<div class="sec"><div class="st">这一页改的是什么</div>' +
      '<div class="fu-empty">本工程只有一处外部依赖：判定时调用的模型。左边四项就是它的地址与凭据。' +
      '改完立刻生效，不需要重启。</div></div>' +
    '<div class="sec"><div class="st">两种判定方式</div>' +
      '<div class="kvlist"><span class="k">智能模型判定</span><span class="v">一条约 20–30 秒，能读懂没写清的口语描述' +
        (ok ? "" : "（通道不通时不可用）") + '</span></div>' +
      '<div class="kvlist"><span class="k">内置规则判定</span><span class="v">秒级出结果，结论口径与模型判定一致</span></div>' +
    '</div>' +
    '<div class="sec"><div class="st">密钥怎样对待</div>' +
      '<div class="fu-empty">只存在本机的配置文件里。界面上只显示末 4 位，完整值不回传、不写日志、不进任何导出与文档。</div></div>' +
    '<div class="sec"><div class="st">接着去哪</div>' +
      '<button class="sact" data-focus-input="1"><span>贴一句客户原话</span><span class="sp"></span><span class="cnt">回车</span></button>' +
      '<button class="sact" data-goto-sources="1"><span>看数据源连接</span><span class="sp"></span><span class="cnt">' + conns.length + ' 个</span></button>' +
    '</div>';
}

function sideHomeHtml() {
  const c = counts();
  const fuOpen = openFollowUpCount();
  const tiles = [
    { n: c.done, k: "已自动处理", cls: "ok", metric: "done", hint: "看它自己处理完的这些" },
    { n: c.pending, k: "待你拍板", cls: "wait", metric: "pending", hint: "等你拍板，点开就能裁决" },
    { n: fuOpen, k: "待你接手", cls: "stop", fu: true, hint: "它交不出来的，点开就能接手" },
  ];
  const ds = (st.sources && st.sources.datasets) || [];
  return '<div class="sec"><div class="st">今天到这里</div>' +
      '<div class="shome">' + tiles.map((d) =>
        '<button class="it ' + d.cls + (d.n ? "" : " zero") + '" ' +
          (d.metric ? 'data-metric="' + d.metric + '"' : 'data-open-fu="1"') +
          ' title="' + esc(d.hint) + '" aria-label="' + esc(d.k + " " + d.n + " 条") + '">' +
          '<div class="n">' + d.n + '</div><div class="k">' + esc(d.k) + '</div></button>').join("") +
      '</div>' +
      '<div class="st mt-2">现在能做的</div>' +
      // 窄屏（≤900px）指标条是藏起来的，这一栏是唯一的入口 ——
      // 因此「未跑通」在这里必须有位置，否则小窗口下失败过的那条就彻底找不到了
      (c.fail
        ? '<button class="sact" data-metric="fail"><span>看没跑通的那几条</span><span class="sp"></span><span class="cnt">' + c.fail + ' 条</span></button>'
        : "") +
      '<button class="sact" data-goto-appr="1"><span>处理人工审批</span><span class="sp"></span><span class="cnt">' + c.pending + ' 条</span></button>' +
      '<button class="sact" data-open-fu="1"><span>接着跟进</span><span class="sp"></span><span class="cnt">' + fuOpen + ' 条</span></button>' +
      '<button class="sact" data-focus-input="1"><span>贴一句客户原话</span><span class="sp"></span><span class="cnt">回车</span></button>' +
      '<button class="sact" data-goto-sources="1"><span>接入数据源</span><span class="sp"></span><span class="cnt">' + ds.length + ' 类</span></button>' +
    '</div>' +
    '<div class="sec"><div class="st">这一栏</div><div class="fu-empty">跟着左边选中的那条走。没选之前，先看今天有什么等你动手 —— 上面的数字和按钮都能点。</div></div>';
}

function renderSide() {
  if (st.view === "sources") { $("sideBody").innerHTML = sideSourcesHtml(); return; }
  if (st.view === "config") { $("sideBody").innerHTML = sideConfigHtml(); return; }
  const s = st.sessions.find((x) => x.id === st.cur);
  if (!s || !s.result) {
    $("sideBody").innerHTML = sideHomeHtml();
    return;
  }
  const r = s.result;
  const rv = r.review || {};
  const j = r.judge || {};
  const cfg = STATUS_TEXT[statusOf(r)];
  const findings = (rv.findings || []).map((f) => sanitize(f.because));
  const amb = (j.ambiguous || []).map(sanitize);
  const conflicts = (j.conflicts || []).map(sanitize);

  $("sideBody").innerHTML =
    '<div class="sec"><div class="st">本条的处置</div>' +
      '<div class="kvlist"><span class="k">当前状态</span><span class="v"><span class="chip ' + cfg.cls + '">' + cfg.txt + '</span></span></div>' +
      '<div class="kvlist"><span class="k">案件类型</span><span class="v">' + S(r.classification ? r.classification.case_name : "—") + '</span></div>' +
      '<div class="kvlist"><span class="k">处置结果</span><span class="v">' + S(r.execution_outcome) + '</span></div>' +
      (r.executed_tool ? '<div class="kvlist"><span class="k">已执行动作</span><span class="v">' + S(r.executed_tool) + '</span></div>' : "") +
    '</div>' +
    (r.pending_approval ? '<div class="banner wait gap"><span class="bi">!</span><span>这条正在等人工审批，切到「人工审批」页签即可处理。</span></div>' : "") +
    '<div class="sec"><div class="st">合规复核 <span class="hint">' + findings.length + ' 条意见</span></div>' +
      (findings.length ? '<ul class="appr-ul">' + findings.map((f) => '<li>' + S(f) + '</li>').join("") + '</ul>'
        : '<div class="note-plain">复核通过，无异常项。</div>') +
    '</div>' +
    ((amb.length || conflicts.length) ? '<div class="sec"><div class="st">它拿不准的地方</div>' +
      (amb.length ? '<div class="appr-q">不确定项</div><ul class="appr-ul warn-li">' + amb.map((x) => '<li>' + S(x) + '</li>').join("") + '</ul>' : "") +
      (conflicts.length ? '<div class="appr-q">信息冲突</div><ul class="appr-ul warn-li">' + conflicts.map((x) => '<li>' + S(x) + '</li>').join("") + '</ul>' : "") +
    '</div>' : "") +
    '<div class="sec"><div class="st">自主边界</div>' +
      '<div class="kvlist"><span class="k">是否问了人</span><span class="v">' + (r.auth && r.auth.approver ? S(r.auth.approver) : "全程未打扰人") + '</span></div>' +
      '<div class="kvlist"><span class="k">调取过的资料</span><span class="v">' + S((r.evidence_sources || []).join("、") || "无需调取") + '</span></div>' +
      '<div class="kvlist"><span class="k">复核补充取证</span><span class="v">' + (r.requery_rounds ? "复核后补充了 " + r.requery_rounds + " 轮" : "首轮即完备") + '</span></div>' +
    '</div>' +
    (needsFollowUp(r) ? fuHtml(s) : "") +
    (((r.memory_hits || []).length) ? memHtml(r.memory_hits) : "") +
    '<div class="sec"><div class="st">给客户的回复</div><div class="reply-box">' + S(r.reply ? r.reply.customer_text : "") + '</div></div>';
}

/* ═══════════ 渲染：审批中心 ═══════════ */
function approvalCardHtml(t, inline) {
  const hasUnc = (t.uncertainties || []).length;
  const basis = (t.basis || []).length ? (t.basis || []) : [];
  // 状态词必须与「人能做什么」一致：能续办的才叫待审批，断了流程的叫已失效
  const chip = t.stale
    ? '<span class="chip mute">已失效 · 待重新处置</span>'
    : '<span class="chip wait">待人工审批</span>';
  return '<div class="appr' + (inline ? " inline" : "") + '" data-appr="' + esc(t.id) + '">' +
    '<div class="appr-head"><div class="r1">' + chip +
      '<span class="fw6">' + S(t.case_name) + '</span><span class="id">单号 ' + esc(t.id) + '</span>' +
      '<span class="amt">' + yuan(t.amount) + '</span></div>' +
      '<div class="r2">' + esc(sanitize(t.stop_reason)) + '</div></div>' +
    '<div class="appr-body">' +
      '<div class="appr-q">客户说了什么</div><div class="appr-quote">' + S(t.customer_text) + '</div>' +
      '<div class="appr-q">Agent 的判断依据</div>' +
      (basis.length ? '<ul class="appr-ul">' + basis.map((b) => '<li>' + S(b) + '</li>').join("") + '</ul>'
        : '<div class="note-plain sm">—</div>') +
      (hasUnc ? '<div class="appr-q">它拿不准的地方</div><ul class="appr-ul warn-li">' + t.uncertainties.map((x) => '<li>' + S(x) + '</li>').join("") + '</ul>' : "") +
      (t.stale ? staleBlockHtml(t) : liveBlockHtml(t)) +
    '</div></div>';
}

/* 单子还能续办：给人两个决定，并说清后果 */
function liveBlockHtml(t) {
  return '<div class="appr-q">批准 / 驳回分别会发生什么</div>' +
      '<div class="appr-out">' +
        '<div class="o a"><div class="h">批准后</div>' + esc(sanitize(t.if_approved)) + '</div>' +
        '<div class="o r"><div class="h">驳回后</div>' + esc(sanitize(t.if_rejected)) + '</div>' +
      '</div>' +
      '<div class="appr-form">' +
        '<input data-f-approver placeholder="审批人（例如：王主管）" value="' + esc(st.approver) + '">' +
        '<input data-f-note placeholder="驳回理由（驳回时建议填写，会写入结单说明）">' +
        '<div class="appr-act"><button class="btn ok" data-approve="1">批准并执行</button>' +
        '<button class="btn danger" data-reject="1">驳回</button></div>' +
      '</div>' +
      '<div class="appr-warn">批准后 Agent 会立即执行该笔处置并自动结单，不需要你再操作一次。</div>';
}

/**
 * 单子已失效（服务重启时那条处置流程断了）。
 *
 * 为什么不给「批准」按钮：那个按钮背后是当时那次跑批的续办句柄，句柄没了，
 * 点下去只能报错。**界面上不摆一个点了必然失败的动作** ——
 * 给的是它当时为什么停（这些字段都还在）、以及一个真能往前走一步的入口。
 */
function staleBlockHtml(t) {
  return '<div class="banner wait gap2"><span class="bi">!</span><span>' +
      S(t.stale_reason || "这条处置流程已中断") + '。它当时停下来是因为：' + S(t.stop_reason) + '</span></div>' +
    '<div class="appr-out">' +
      '<div class="o a"><div class="h">当时批准会发生什么</div>' + esc(sanitize(t.if_approved)) + '</div>' +
      '<div class="o r"><div class="h">当时驳回会发生什么</div>' + esc(sanitize(t.if_rejected)) + '</div>' +
    '</div>' +
    '<div class="appr-act"><button class="btn primary" data-rerun-approval="' + esc(t.msg_id || "") + '">重新处置这条</button></div>' +
    '<div class="appr-warn">重新处置会按当时那条客户原话完整重跑一遍链路，金额与依据都会重新算 —— 不是把这一张单子直接执行掉。</div>';
}

function approvalPageHtml() {
  if (!st.approvals.length) {
    return '<div class="intro wide fade-in"><h1>人工审批</h1>' +
      '<p class="lead">当前没有等你拍板的处置 —— 在它权限内的都自己执行完了。</p>' +
      '<div class="steps-intro"><div class="t">什么会落到这里</div>' +
      '<div class="intro-step"><div class="idx">1</div><div class="tx">处置金额<b>超过 500 元</b>，超出它的自动处置上限。</div></div>' +
      '<div class="intro-step"><div class="idx">2</div><div class="tx">顶部「自主执行」开关被<b>关掉</b>，所有资金处置都停下等人。</div></div>' +
      '<div class="intro-step"><div class="idx">3</div><div class="tx">事实冲突或责任归属没有确定口径，需要人来判断。</div></div>' +
      '</div></div>';
  }
  const staleN = st.approvals.filter((a) => a.stale).length;
  const liveN = st.approvals.length - staleN;
  return '<div class="intro wide pt fade-in">' +
    '<h1 class="sm">人工审批 <span class="sub">' +
      (staleN ? st.approvals.length + ' 条待处理（' + liveN + ' 条可裁决，' + staleN + ' 条已失效待重新处置）' : st.approvals.length + ' 条待处理') +
    '</span></h1>' +
    '<p class="lead mb16">每张单子写清了三件事：为什么停下来、依据是什么、批准与驳回分别会怎样。批准后它自动续办并结单。</p>' +
    st.approvals.map(approvalCardHtml).join("") +
    '</div>';
}

/* ═══════════ 交互 ═══════════ */
function toast(msg, kind) {
  const d = document.createElement("div");
  d.className = "toast" + (kind ? " " + kind : "");
  d.textContent = msg;
  $("toasts").appendChild(d);
  setTimeout(() => d.remove(), 3600);
}

/* ═══════════ 窄屏抽屉 ═══════════
   窗口小不该等于能力少：窄屏下右栏与队列改成可临时唤出的抽屉，
   入口留在图标轨上，遮罩点击与 Esc 都能收回去。 */
function anyDrawerOpen() {
  return !!document.querySelector(".side.open, .queue.open");
}

/**
 * 抽屉打开时它是一个对话框（有遮罩、有模态语义、焦点该进去）；
 * 关上时它只是一栏普通内容 —— 所以角色是**跟着状态走**的，不是写死在 HTML 上。
 * 写死成 role=dialog 的话，宽屏下这一栏常驻可见，读屏会以为页面里随时有个模态框。
 */
function setDrawerA11y(el, open, label) {
  if (!el) return;
  if (open) {
    el.setAttribute("role", "dialog");
    el.setAttribute("aria-modal", "true");
    el.setAttribute("aria-label", label);
    el.setAttribute("tabindex", "-1");
  } else {
    el.removeAttribute("role");
    el.removeAttribute("aria-modal");
    el.removeAttribute("aria-label");
    el.removeAttribute("tabindex");
  }
}

function syncDrawers() {
  const m = $("drawerMask");
  if (m) m.classList.toggle("on", anyDrawerOpen());
  const side = document.querySelector(".side");
  const queue = document.querySelector(".queue");
  const bs = $("navDrawerSide");
  const bq = $("navDrawerQueue");
  setDrawerA11y(side, !!(side && side.classList.contains("open")), "处置详情");
  setDrawerA11y(queue, !!(queue && queue.classList.contains("open")), "今日处置队列");
  if (bs) bs.classList.toggle("active", !!(side && side.classList.contains("open")));
  if (bq) bq.classList.toggle("active", !!(queue && queue.classList.contains("open")));
}
function closeDrawers() {
  const s = document.querySelector(".side");
  const q = document.querySelector(".queue");
  const wasSide = !!(s && s.classList.contains("open"));
  const wasQueue = !!(q && q.classList.contains("open"));
  if (s) s.classList.remove("open");
  if (q) q.classList.remove("open");
  syncDrawers();
  // 焦点还给把它打开的那个入口，否则焦点会掉回 body，键盘用户重新找路
  if (wasSide) { const b = $("navDrawerSide"); if (b) b.focus(); }
  else if (wasQueue) { const b = $("navDrawerQueue"); if (b) b.focus(); }
}
function toggleDrawer(name) {
  const side = document.querySelector(".side");
  const queue = document.querySelector(".queue");
  const el = name === "side" ? side : queue;
  const other = name === "side" ? queue : side;
  if (!el) return;
  if (name === "side" && window.innerWidth > 1180) { toast("窗口够宽，详情栏就在右侧", ""); return; }
  if (name === "queue" && window.innerWidth > 900) { toast("窗口够宽，处置队列就在左侧", ""); return; }
  if (other) other.classList.remove("open");
  const open = el.classList.toggle("open");
  syncDrawers();
  if (open) {
    const b = el.querySelector(".side-body") || el.querySelector(".queue-list");
    if (b) b.scrollTop = 0;
    if (el.focus) el.focus();   // 焦点进抽屉：否则 Tab 还留在后面的正文里
  }
}

/* ═══════════ 站内路由：「去跟进」到底跳哪儿 ═══════════
   这个前端没有 URL 路由框架，页面由 st.view + st.cur 两份状态决定。
   所以「路由」在这里就是一组约定，且只允许两个方向流动：
     · 状态 → 地址：renderAll() 末尾 syncRoute()，把当前状态写成哈希
     · 地址 → 状态：applyRoute()，启动时与浏览器前进/后退时读回来
   只有「可以直达的位置」才进哈希：某条案子的跟进面板 / 人工审批 / 数据源。
   普通会话不进哈希 —— 它本来要先跑一遍才有结果，没法凭空指过去。

   规矩：所有「去跟进」入口只准调 gotoFollowUp()，不准自己 scrollIntoView。
   入口一多，总有一个会忘掉「窄屏下右栏是抽屉」这一层 ——
   原来那个按钮点了没反应，就是栽在这里：它对着一个 display:none 的面板滚动。 */

let routeGuard = false;
/* 启动期间地址是主人：在 applyRoute 读回它之前，不许渲染把地址覆盖掉。
   （踩过：直接把 #config 贴进地址栏打开，boot 里先渲染一次就把 #config 抹成空，
   于是「能点进去、但贴链接进不去」。） */
let routeSynced = false;

function routeOf() {
  const raw = String(location.hash || "").replace(/^#\/?/, "");
  if (!raw) return null;
  const head = raw.split("/")[0];
  const tail = raw.slice(head.length + 1);
  if (head === "fu" && tail) return { view: "fu", key: decodeURIComponent(tail) };
  if (head === "approvals") return { view: "approvals" };
  if (head === "sources") return { view: "sources" };
  if (head === "config") return { view: "config" };
  return null;
}

/** 状态 → 地址。用 replaceState，避免每点一条就往浏览历史里塞一条 */
function setRoute(hash) {
  const want = hash ? "#" + hash : "";
  if ((location.hash || "") === want) return;
  try {
    history.replaceState(null, "", want || location.pathname + location.search);
  } catch (e) {
    // file:// 下个别浏览器会拒绝 replaceState，退回直接改哈希
    routeGuard = true;
    try { location.hash = want; } catch (e2) { routeGuard = false; }
  }
}

function syncRoute() {
  if (!routeSynced) return;   // 还没读回地址前，别覆盖人家粘进来的位置
  let h = "";
  if (st.view === "approvals") h = "approvals";
  else if (st.view === "sources") h = "sources";
  else if (st.view === "config") h = "config";
  else if (st.view === "chat" && st.cur) {
    const s = st.sessions.find((x) => x.id === st.cur);
    if (s && s.result && needsFollowUp(s.result)) h = "fu/" + encodeURIComponent(fuKey(s) || s.id);
  }
  setRoute(h);
}

/** 地址 → 状态。silent：找不到那条也别弹提示（启动时正常会发生） */
function applyRoute(opts) {
  const r = routeOf();
  if (!r) return false;
  if (r.view === "approvals") { st.view = "approvals"; renderAll(); return true; }
  if (r.view === "sources") { st.view = "sources"; renderAll(); return true; }
  if (r.view === "config") { st.view = "config"; renderAll(); loadConfig(); return true; }
  return gotoFollowUp(r.key, opts);
}

/** 把人工跟进面板送到眼前。宽屏它在右栏；窄屏它藏在抽屉里，得先唤出来再滚 */
function revealFollowUp() {
  const p = $("fuPanel");
  if (!p) { toast("这条没有需要接手的事", ""); return; }
  if (window.innerWidth <= 1180) {
    const side = document.querySelector(".side");
    if (side && !side.classList.contains("open")) {
      toggleDrawer("side");
      // 抽屉有 0.2s 入场动画，等它显示出来再滚，否则滚的是还没布局的元素
      setTimeout(() => { const q = $("fuPanel"); if (q) q.scrollIntoView({ block: "center", behavior: "smooth" }); }, 80);
      return;
    }
  }
  p.scrollIntoView({ block: "center", behavior: "smooth" });
}

/** 去跟进 —— 全站唯一入口。
    ref 给案件主键或会话 id；不给 = 第一条等你接手的（右栏概览里的「接着跟进」）。 */
function gotoFollowUp(ref, opts) {
  const opt = opts || {};
  let s = null;
  if (ref) {
    s = st.sessions.find((x) => x.id === ref) || st.sessions.find((x) => fuKey(x) === ref);
  } else {
    s = st.sessions.find((x) => needsFollowUp(x.result) && (!fuOf(x) || fuOf(x).status !== "closed"));
  }
  if (!s) {
    if (!opt.silent) toast(ref ? "没找到这条案子的跟进记录" : "当前没有等你接手的案子", "");
    return false;
  }
  if (!s.result) {
    if (!opt.silent) toast("这条还在处理中，跑完才能接手跟进", "");
    return false;
  }

  const same = st.view === "chat" && st.cur === s.id;
  st.view = "chat";
  st.cur = s.id;
  st.filter = null;          // 别让遗留的指标筛选把这条藏起来
  if (!same) renderAll();
  closeDrawers();
  revealFollowUp();
  setRoute("fu/" + encodeURIComponent(fuKey(s) || s.id));
  return true;
}

window.addEventListener("hashchange", () => {
  if (routeGuard) { routeGuard = false; return; }
  if (applyRoute({ silent: true })) return;
  // 地址指不到任何地方（被清空，或指向一条不存在的案子）：别让状态和地址各说各话
  if (!location.hash && st.view !== "chat") { st.view = "chat"; renderAll(); return; }
  syncRoute();
});

/* ═══════════ 慢通道的等待反馈 ═══════════
   一次处置要跑多久，只有真跑起来才知道。这里只做两件不撒谎的事：
   如实显示已等待了多久、给一个退出的口子。不预置「目前进行到第几步」这种
   服务器没告诉我们的进度。 */
const RUNS = Object.create(null);
let runTicker = null;
function ensureTicker() {
  if (runTicker) return;
  runTicker = setInterval(() => {
    if (!Object.keys(RUNS).length) { clearInterval(runTicker); runTicker = null; return; }
    document.querySelectorAll("[data-elapsed]").forEach((el) => {
      const r = RUNS[el.getAttribute("data-elapsed")];
      if (!r) return;
      el.textContent = Math.max(0, Math.round((Date.now() - r.startedAt) / 1000)) + " 秒";
    });
    // 时间线那句「已跑 N 秒」也要走：否则头一行在跳、说明行停着，看着像卡住
    const run = RUNS[st.cur];
    const sub = document.querySelector("[data-tl-sub]");
    if (run && sub) {
      const sess = st.sessions.find((x) => x.id === st.cur);
      const doneN = sess && sess.run ? sess.run.steps.filter((s) => s.state === "done").length : 0;
      sub.textContent = "进行中 · 已完成 " + doneN + "/6 步 · 已跑 " + Math.round((Date.now() - run.startedAt) / 1000) + " 秒";
    }
  }, 1000);
}
function beginRun(id, ctrl) { RUNS[id] = { startedAt: Date.now(), ctrl: ctrl }; ensureTicker(); }
function endRun(id) { delete RUNS[id]; }

/* ═══════════ 渲染分片：只重画变脏的那块 ═══════════
   起因：原先一个 renderAll() 一次重画四块，副作用都藏在「顺带」里 ——
   保存配置时焦点被冲掉、跟进面板滚到一半被拉回顶部、刚展开的折叠线又合上。
   做法：五个渲染单元 + 一张脏表；状态改了只标脏，末尾 flush 一次只画变脏的那几块。
   纪律：新加一块视图就在这里加一个单元，不要在别处直接写 innerHTML。 */
const UNITS = {
  metrics: () => renderMetrics(),
  queue: () => renderQueue(),
  stage: () => { $("stageInner").innerHTML = stageHtml(); },
  side: () => renderSide(),
  chrome: () => {
    $("navChat").classList.toggle("active", st.view === "chat");
    $("navAppr").classList.toggle("active", st.view === "approvals");
    $("navSrc").classList.toggle("active", st.view === "sources");
    const navCfg = $("navCfg");
    if (navCfg) navCfg.classList.toggle("active", st.view === "config");
    const cur = st.sessions.find((x) => x.id === st.cur);
    $("sideTab").textContent = st.view === "sources" ? "数据源状态"
      : st.view === "config" ? "接口设置"
      : (cur && cur.result ? "处置详情" : "处置概览");
  },
};
const UNIT_ORDER = ["metrics", "queue", "stage", "side", "chrome"];
const dirty = new Set();
/* 验收断言用：一次交互到底重画了几块（不许靠眼睛判断「有没有变快」） */
window.__renderCount = { flush: 0, metrics: 0, queue: 0, stage: 0, side: 0, chrome: 0 };

function markDirty(...units) { for (const u of units) dirty.add(u); }

function flushRender() {
  const todo = UNIT_ORDER.filter((u) => dirty.has(u));
  dirty.clear();
  window.__renderCount.flush += 1;
  for (const u of todo) {
    UNITS[u]();
    window.__renderCount[u] += 1;
  }
  syncDrawers();
  syncRoute(); // 地址是状态的投影：每次渲染完对齐一次，就不会出现「跳过去了地址还是旧的」
}

/** 只重画这几块。绝大多数交互该用它 */
function renderOnly(...units) {
  markDirty(...units);
  flushRender();
}

/** 整页换掉（切视图、启动、换选中案子）才用全量 */
function renderAll() {
  markDirty(...UNIT_ORDER);
  flushRender();
}


async function loadApprovals() {
  try {
    const r = await api("/api/approvals");
    st.approvals = r.items || [];
  } catch (e) { /* 拉取失败不阻塞页面 */ }
}

/* ═══════════ 数据源：加载与操作 ═══════════ */
const WX_SAMPLE = "我9月12号在你们抖音小店买的那张书桌，收到颜色跟详情页差太多了，我要退钱";

async function loadConnectors() {
  try {
    st.sources = await api("/api/connectors");
    const ok = !!(st.sources.mcp && st.sources.mcp.ready);
    const b = $("srcBadge");
    b.style.display = ok ? "none" : "grid";
    b.title = ok ? "" : (st.sources.mcp && st.sources.mcp.problem) || "MCP 未联通";
  } catch (e) {
    st.sources = null;
  }
}

async function loadInbound() {
  try {
    const r = await api("/api/inbound");
    st.inbound = r.entries || [];
    // 重新打开页面时，队列与指标应当接着上一轮，而不是从 0 重来 ——
    // 入站流水里带着处置结果的那些，直接回灌成会话（同 id 幂等，不覆盖手贴的那条）。
    const keep = [];
    const seen = {};
    for (const e of st.inbound) {
      if (!e || !e.result || e.status === "duplicate") continue;
      // id 直接用微信侧的消息号：跟进台账是按同一个 key 存的，两边必须对得上
      const id = e.msg_id;
      if (seen[id]) continue;
      seen[id] = 1;
      keep.push({ id: id, msgId: id, title: e.from || "微信客户", text: e.text || "", result: e.result, pending: false });
    }
    if (keep.length) {
      st.sessions = keep.concat(st.sessions.filter((x) => !seen[x.id]));
    }
  } catch (e) { /* 入站流水拉不到不影响主流程 */ }
}

async function loadFollowups() {
  try {
    const r = await api("/api/followups");
    const map = {};
    for (const it of (r.items || [])) map[it.case_key] = it;
    st.followups = map;
    // 台账里带着案子的瘦身快照 → 重新打开页面时把案子一并还原，不然会出现
    // 「跟进记录还在、它记的那条案子不见了」这种断头路。
    // 「按补充事实重新处置」产生的那条结果也一起还原：那是人工跟进真正拿到的东西，
    // 只留原案、不留结果，等于让人重开页面后看不到自己跟出来的结论。
    const restore = [];
    for (const key of Object.keys(map)) {
      const it = map[key];
      const rc = it.run_case;
      const rid = "frun-" + key;
      if (rc && rc.result && !st.sessions.some((x) => x.id === rid)) {
        restore.push({ id: rid, msgId: null, title: rc.title || "已重新处置", text: rc.text || "", result: rc.result, pending: false, fromFollowup: key });
      }
      const c = it.case;
      if (!c || !c.result) continue;
      if (st.sessions.some((x) => x.id === key)) continue;
      restore.push({ id: key, msgId: key, title: c.title || "待跟进的案子", text: c.text || "", result: c.result, pending: false });
    }
    if (restore.length) st.sessions = st.sessions.concat(restore);
  } catch (e) { /* 跟进台账拉不到不影响主流程 */ }
}

/** 会话瘦身快照：跟进的台账要能带着案子走，但不必把整份轨迹再存一遍 */
function slimCase(s) {
  if (!s || !s.result) return null;
  const r = {};
  for (const k of Object.keys(s.result)) {
    if (k === "trace" || k === "trace_path") continue;
    r[k] = s.result[k];
  }
  return { title: s.title || "", text: s.text || "", result: r };
}

/**
 * 人工跟进的一笔操作。rerun 是真的重跑：人工补到的事实要能被引擎用上，
 * 否则「转交专人跟进」永远只是一句话。
 */
async function doFollowup(action) {
  const s = st.sessions.find((x) => x.id === st.cur);
  if (!s) return;
  const key = fuKey(s);
  const card = $("fuNote");
  const note = ((card && card.value) || st.fuNote || "").trim();
  const by = (($("fuBy") || {}).value || st.fuBy || "").trim() || st.approver || "";
  const to = (($("fuTo") || {}).value || st.fuTo || "").trim();

  if (action === "note" && !note) { toast("先写一句跟进内容", ""); return; }
  if (action === "reassign" && !to) { toast("填一下转交给谁", ""); return; }

  st.fuBusy = true;
  renderOnly("side"); // 只把跟进面板按成「处理中」，正文与队列不动
  try {
    let link = "";
    let runCase = null;
    if (action === "rerun") {
      if (!note) { st.fuBusy = false; toast("把客户补充的事实写进跟进框，再点重新处置", ""); renderOnly("side"); return; }
      // 人工补到的事实 + 原始诉求一起重投：这是「人工跟进」真正产生新结果的路径
      const text = (s.text || "") + "（人工核实补充：" + note + "）";
      const rr = await api("/api/run", {
        text: text,
        offline: st.mode !== "model",
        autoApproveAsk: st.autonomous,
        deferApproval: true,
      });
      // 用稳定的 id（一个案子只留最近一次重新处置的结果），这样刷新后能按同一 key 还原、天然幂等
      const nid = "frun-" + key;
      st.sessions = st.sessions.filter((x) => x.id !== nid);
      const ns = { id: nid, msgId: null, title: (s.title || "客户") + "（已重新处置）", text: text, result: rr.result, pending: false, fromFollowup: key };
      st.sessions.unshift(ns);
      link = nid;
      s.linkTo = nid;
      runCase = slimCase(ns); // 连着台账一起存，否则刷新后「重新处置」的结果会不见
    }
    const r = await api("/api/followup", { case_key: key, action: action, by: by, note: note, target: to, case: slimCase(s), run_case: runCase });
    st.followups[key] = r;
    // 记住跟进人：刷新之后不该变成「未署名跟进人」
    if (by) { st.fuBy = by; try { localStorage.setItem("aftersales.follower", by); } catch (e) { /* 忽略 */ } }
    // 只在内容确实被消费掉时才清空，别把还没写完的字刷掉
    if (action === "note" || action === "rerun") st.fuNote = "";
    if (action === "reassign") st.fuTo = "";
    st.fuBusy = false;
    if (action === "rerun") {
      st.cur = s.linkTo;
      st.filter = null;
      st.view = "chat";
      renderOnly("stage", "side", "queue", "metrics", "chrome"); // 换了选中案子，正文必须重画
    } else {
      // 记一笔 / 认领 / 转交 / 等待 / 结单：正文一个字都不变。
      // 指标只在「待接手」的数真的变了的时候才重画 —— 结单才减一，记笔记不影响。
      if (action === "close") renderOnly("side", "queue", "metrics");
      else renderOnly("side", "queue");
    }
    $("sideBody").scrollTop = action === "rerun" ? 0 : $("sideBody").scrollHeight;
    const MSG = {
      claim: "已接手，这条归你跟进",
      note: "已记入跟进台账",
      wait: "已标记为等待客户补充",
      reassign: "已转交" + (to ? "「" + to + "」" : ""),
      rerun: "已按补充事实重新跑了一遍，新结果在最上面",
      close: "已结单",
    };
    toast(MSG[action] || "已记录", action === "close" ? "ok" : "");
  } catch (e) {
    st.fuBusy = false;
    renderOnly("side");
    toast("跟进操作失败：" + e.message, "bad");
  }
}


function repHtml(r) {
  const bits = [];
  if (r.added) bits.push("新增 <b>" + r.added + "</b> 行");
  if (r.updated) bits.push("更新 <b>" + r.updated + "</b> 行");
  if (r.rejected) bits.push("拒绝 <b>" + r.rejected + "</b> 行");
  if (!bits.length) bits.push("没有可导入的行");
  return bits.join(" · ");
}

function dsLabel(ds) {
  const hit = (st.sources && st.sources.datasets || []).find((d) => d.dataset === ds);
  return hit ? hit.label : ds;
}

async function pullConnector(id) {
  st.srcBusy = id;
  renderAll();
  try {
    const r = await api("/api/connectors/pull", { id: id });
    for (const p of r.pulled || []) {
      const errs = (p.errors || []).slice(0, 3).map((x) => "<span class='li'>· " + esc(x) + "</span>").join("");
      // 退回文件通路时把原因写在回执里：不说原因，读的人只会以为「MCP 又抽风了」
      const viaTxt = p.via === "mcp" ? "MCP 服务端" : "本地数据文件";
      st.srcNote[p.id] = {
        bad: p.rejected > 0 || (p.errors || []).length > 0,
        html: "从" + esc(viaTxt) + "取数：" + repHtml(p) + errs +
          (p.via_note ? "<span class='li'>· " + esc(sanitize(p.via_note)) + "</span>" : ""),
      };
    }
    await loadConnectors();
    const add = (r.pulled || []).reduce((n, p) => n + p.added, 0);
    const upd = (r.pulled || []).reduce((n, p) => n + p.updated, 0);
    const viaFile = (r.pulled || []).some((p) => p.via === "file");
    toast("已拉取：" + add + " 行新增" + (upd ? "、" + upd + " 行更新" : "") +
      (viaFile ? "（MCP 未联通，已从本地文件通路取数）" : "，引擎立即可用"), viaFile ? "" : "ok");
  } catch (e) {
    toast("拉取失败：" + errOf(e).msg, "bad");
  } finally {
    st.srcBusy = "";
    renderAll();
  }
}

/** 手动重连数据通道。失败也要说清原因 —— 「重连失败」四个字等于没说 */
async function reconnectMcp() {
  st.mcpBusy = true;
  renderOnly("stage", "chrome");
  try {
    const r = await api("/api/mcp/reconnect", {});
    if (st.sources) { st.sources.mcp = r.mcp; st.sources.connectors = r.connectors; }
    if (r.connected) toast("数据通道已接通：" + r.mcp.tools.length + " 个工具在线", "ok");
    else toast("重连没成功：" + sanitize(r.mcp.problem || "原因未知"), "bad");
  } catch (e) {
    toast("重连失败：" + errOf(e).msg, "bad");
  } finally {
    st.mcpBusy = false;
    renderOnly("stage", "chrome");
  }
}

async function doIngest() {
  // 以输入框里的实际内容为准：重渲染与打字可能交错，只信 DOM 上的当前值
  const box = $("impText");
  const text = ((box && box.value) || st.impText || "").trim();
  if (!text) { toast("先粘贴或选择一份数据", ""); return; }
  try {
    const r = await api("/api/ingest", { dataset: st.impDataset, text: text });
    const rep = r.report;
    const bad = rep.rejected > 0 || (rep.errors || []).length > 0;
    st.impReport = {
      bad: bad,
      html: "导入到「" + esc(dsLabel(rep.dataset)) + "」：" + repHtml(rep) +
        (rep.errors || []).map((x) => "<span class='li'>· " + esc(x) + "</span>").join(""),
    };
    // 一行都没进来时把原文留着，方便对着报错改
    if (bad && !rep.added && !rep.updated) st.impText = text;
    else st.impText = "";
    await loadConnectors();
    if (rep.added || rep.updated) {
      toast("已导入：" + rep.added + " 行新增" + (rep.updated ? "、" + rep.updated + " 行更新" : "") +
        (rep.rejected ? "，" + rep.rejected + " 行被拒" : ""), rep.rejected ? "" : "ok");
    } else {
      toast("没有导入任何行，原因见下方", "bad");
    }
  } catch (e) {
    st.impReport = { bad: true, html: esc(e.message) };
    toast("导入失败：" + e.message, "bad");
  }
  renderAll();
}

async function doInbound() {
  const box = $("wxText");
  const text = ((box && box.value) || st.wxText || "").trim();
  if (!text) { toast("先把客户消息粘进来", ""); return; }
  const from = (($("wxFrom") || {}).value || st.wxFrom || "").trim();
  const channel = (($("wxChannel") || {}).value || st.wxChannel || "").trim();
  st.wxBusy = true;
  renderAll();
  try {
    const r = await api("/api/inbound", {
      text: text, from: from, channel: channel, offline: st.mode !== "model",
    });
    await loadInbound();
    st.wxBusy = false;
    if (r.deduped) { toast("这条消息已经处理过，未重复执行", ""); renderAll(); return; }
    // 入站处置同样进队列：界面上与手贴原话走的是同一条链路
    const sess = { id: "wx-" + r.msg_id, msgId: r.msg_id, title: from || "微信客户", text: text, result: r.result, pending: false };
    st.sessions = st.sessions.filter((x) => x.id !== sess.id);
    st.sessions.unshift(sess);
    if (r.pending) await loadApprovals();
    st.wxText = "";
    st.view = "chat"; st.cur = sess.id; st.filter = null;
    renderAll();
    $("stageScroll").scrollTop = 0;
    toast(r.pending
      ? "该笔 " + yuan(r.pending.amount) + " 超出自动处置范围，已转入人工审批"
      : "已处置并生成回复", r.pending ? "" : "ok");
  } catch (e) {
    st.wxBusy = false;
    renderAll();
    toast("投递失败：" + e.message, "bad");
  }
}

/**
 * 只重画「正在跑的那条」的时间线。
 *
 * 为什么不用 renderOnly("stage")：那会连带重建客户气泡、输入框与整段对话，
 * 跑批期间每一秒都在动的东西只有时间线这一块，别的都该原样待着。
 * 这也是分片渲染的延续：单元还可以再细，细到「只有真变了的那一块」。
 */
function patchTimeline(sess) {
  if (!sess || st.cur !== sess.id || st.view !== "chat") return;
  const box = $("tlLive");
  if (!box) return;
  box.innerHTML = renderWork(null, "run", sess.run);
}

async function runQuery(opts) {
  const msgId = opts.msgId;
  const text = opts.text;
  // 重试要把「那一条失败记录」顶掉，而不是在旁边再挂一条 —— 否则点两次就有三条
  const localId = opts.replaceId || msgId || ("local-" + Date.now());
  const sample = st.boot && (st.boot.samples || []).find((s) => s.msg_id === msgId);
  const label = opts.title || (sample && (sample.display || sample.title)) || (text ? text.slice(0, 14) : "新处置");
  const shownText = text || (sample && sample.text) || "";

  const sess = {
    id: localId, msgId: msgId, title: label, text: shownText,
    result: null, pending: true, error: null, at: Date.now(), run: newRun(localId),
  };
  st.sessions = st.sessions.filter((x) => x.id !== localId);
  st.sessions.unshift(sess);
  st.cur = localId;
  st.view = "chat";
  st.filter = null; // 新跑的这条必须能被看见，别被上一轮的筛选或搜索挡住
  st.q = "";
  const qbox = $("qSearch"); if (qbox) qbox.value = "";
  const ctrl = new AbortController();
  beginRun(localId, ctrl); // 从这一刻起就开始计时：等待期间要看得见它跑了多久
  renderAll();
  $("stageScroll").scrollTop = 0;

  try {
    const body = { offline: st.mode !== "model", autoApproveAsk: st.autonomous, deferApproval: true };
    if (msgId) body.msgId = msgId; else body.text = text;
    const final = await apiStream("/api/run/stream", body, {
      onEvent: (line) => {
        if (sess.cancelled) return;
        // 一步真事落进时间线，然后只重画时间线 —— 过程是长出来的，不是分几拍点亮的
        applyEventToRun(sess.run, line);
        patchTimeline(sess);
      },
    }, { signal: ctrl.signal });
    if (sess.cancelled) return;
    endRun(localId);

    sess.result = final.result;
    sess.pending = false;
    sess.run.lastAt = Date.now();

    if (final.pending) {
      await loadApprovals();
      toast("该笔 " + yuan(final.pending.amount) + " 超出自动处置范围，已停办等你拍板", "");
      liveSay("已停办等你拍板：" + sanitize(final.result.classification ? final.result.classification.case_name : "") + "，金额 " + yuan(final.pending.amount));
    } else {
      const c = statusOf(final.result);
      const head = verdictHead(final.result);
      liveSay("处置完成：" + head.title + "。" + head.sub);
      if (c === "blocked") toast("这条被合规复核拦住了，未执行任何处置", "bad");
      else if (c === "clarify") toast("诉求信息不足，Agent 已转为向客户追问", "");
      else toast("Agent 已自主完成处置并结单", "ok");
    }
    renderAll();
    $("stageScroll").scrollTop = 0;
  } catch (e) {
    endRun(localId);
    if (e && e.name === "AbortError") return; // 取消的提示已经在 cancelRun 里给过了，这里不再报错
    sess.pending = false;
    // 结果都已经拿到了、只是后段（刷审批队列 / 滚动定位）出错：这条不能算失败
    if (sess.result) {
      renderAll();
      toast("处置已完成，只是后续刷新没成功：" + ((e && e.message) || ""), "");
      return;
    }
    // 失败就地留下：这条记录 + 原因 + 重试入口。删掉它等于把「刚才发生了什么」一起删掉
    sess.error = errOf(e);
    st.cur = localId;
    st.view = "chat";
    st.filter = null;           // 失败的那条不能被上一轮的筛选藏起来
    renderAll();
    $("stageScroll").scrollTop = 0;
    toast("这条没跑通：" + sess.error.msg, "bad");
    // 失败也要被念出来：读屏用户不该只听到「处理中」然后一片安静
    liveSay("这条没有跑通：" + sanitize(sess.error.msg) + (sess.error.hint ? "。" + sanitize(sess.error.hint) : ""));
  }
}

/** 原样重试：输入还用那一条的（有样例编号就走样例，没有就按客户原话） */
function retryRun(id) {
  const s = st.sessions.find((x) => x.id === id);
  if (!s) return;
  if (s.msgId) runQuery({ msgId: s.msgId, title: s.title, replaceId: s.id });
  else if (s.text) runQuery({ text: s.text, title: s.title, replaceId: s.id });
  else toast("这条没有留下客户原话，无法原样重试", "bad");
}

/** 取消等待。说不撒谎的两件事：停在下一个环节边界；已经发生的处置不回滚。 */
function cancelRun(id) {
  const sess = st.sessions.find((x) => x.id === id);
  if (!sess) return;
  if (sess.result) { toast("这条已经跑完了，不用取消", ""); return; }
  sess.cancelled = true;
  const r = RUNS[id];
  if (r && r.ctrl) { try { r.ctrl.abort(); } catch (e) { /* 忽略 */ } }
  endRun(id);
  st.sessions = st.sessions.filter((x) => x.id !== id);
  if (st.cur === id) st.cur = st.sessions.length ? st.sessions[0].id : null;
  renderAll();
  toast("已取消：它会停在下一个环节边界，已经发生的处置不回滚", "");
}

async function decideApproval(id, approved) {
  const card = document.querySelector('[data-appr="' + id + '"]');
  if (!card) return;
  const ap = card.querySelector("[data-f-approver]");
  const nt = card.querySelector("[data-f-note]");
  const approver = (ap && ap.value.trim()) || st.approver || "未署名审批人";
  const note = (nt && nt.value.trim()) || "";
  if (!approved && !note) {
    if (!window.confirm("驳回会向客户说明情况并转交专人跟进。确定不填理由就驳回吗？")) return;
  }
  st.approver = approver;
  try { localStorage.setItem("aftersales.approver", approver); } catch (e) { /* 忽略 */ }
  card.querySelectorAll("button").forEach((b) => (b.disabled = true));
  try {
    const r = await api("/api/approve", { id: id, approved: approved, approver: approver, note: note });
    const s = st.sessions.find((x) => x.result && x.result.pending_approval && x.result.pending_approval.id === id);
    if (s) { s.result = r.result; s.pending = false; st.cur = s.id; }
    await loadApprovals();
    st.view = "chat";
    renderAll();
    $("stageScroll").scrollTop = 0;
    toast(approved ? "已批准，Agent 已执行该笔处置并自动结单" : "已驳回，未执行处置，已转交专人跟进", approved ? "ok" : "");
    liveSay(approved
      ? "已批准，Agent 已执行并向客户发送到账通知，本次会话结单"
      : "已驳回，未执行任何资金处置，已转交专人向客户说明并跟进");
  } catch (e) {
    card.querySelectorAll("button").forEach((b) => (b.disabled = false));
    toast("审批失败：" + e.message, "bad");
  }
}

/* ═══════════ 命令面板 ═══════════
   为什么一个「贴一句话就出结果」的工作台需要它：一天的处置里，人真正重复做的
   不是「跑一条」，而是「在十几条记录、四个页面、两种判定方式之间跳来跳去」。
   跳转靠鼠标点图标轨，一天点几百次，且记不住哪个图标通向哪。
   面板把这些都收成「输入两个字母、回车」。参考的是 Linear / Raycast / VS Code
   这一类工具的同一套做法：**动作与内容是同一份可搜索列表**。

   一条纪律：面板里不出现任何「危险动作的快捷方式」。批准退款、删除、结单
   一律不进面板 —— 金额动作必须经过那张写着四问的卡，不能变成一个两字母快捷键。 */
const PAL_ITEMS = [
  { g: "动作", label: "新建处置", sub: "把光标放到输入框", kw: "new 新建 咨询", run: () => { st.view = "chat"; renderAll(); closeDrawers(); const i = $("input"); if (i) i.focus(); } },
  { g: "动作", label: "打开人工审批中心", sub: "看等拍板的单子", kw: "approval 审批 裁决", run: () => { st.view = "approvals"; renderAll(); $("stageScroll").scrollTop = 0; } },
  { g: "动作", label: "打开数据源", sub: "连接器 / 导入 / 微信入站", kw: "source 数据 连接器 mcp 导入", run: () => { st.view = "sources"; renderAll(); $("stageScroll").scrollTop = 0; } },
  { g: "动作", label: "打开接口设置", sub: "模型通道与密钥", kw: "config 设置 密钥 模型", run: () => openConfig() },
  { g: "动作", label: "切换浅色 / 深色主题", sub: "现在：" + "跟随当前设置", kw: "theme 主题 深色 浅色", run: () => $("btnTheme").click() },
  { g: "动作", label: "切换自主执行开关", sub: "关掉后所有资金处置都转入人工审批", kw: "auto 自主 暂停 接管", run: () => $("autoSwitch").click() },
  { g: "动作", label: "展开 / 收起全部依据", sub: "执行过程里的过程记录与判据", kw: "依据 展开 折叠 detail", run: () => { const b = document.querySelector("[data-tl-all]"); if (b) b.click(); else toast("先选中一条处置记录", ""); } },
  { g: "动作", label: "清除筛选与搜索", sub: "回到全部处置记录", kw: "clear 清除 筛选 搜索", run: () => { const b = document.querySelector("[data-clear-filter]"); if (b) b.click(); } },
];

const PAL_HELP = [
  { g: "键盘", label: "Ctrl / ⌘ + K", sub: "打开或关闭命令面板" },
  { g: "键盘", label: "/", sub: "把光标放到客户原话输入框" },
  { g: "键盘", label: "j / k 或 ↓ / ↑", sub: "在处置队列里上下移动" },
  { g: "键盘", label: "Enter", sub: "打开队列里光标停的那一条" },
  { g: "键盘", label: "1 – 6", sub: "按顶部指标筛选（再按一次取消）" },
  { g: "键盘", label: "Esc", sub: "关掉面板或抽屉" },
  { g: "键盘", label: "Tab", sub: "在面板里循环，不会跑到面板外面" },
  { g: "说明", label: "批准 / 驳回没有快捷键", sub: "金额动作只能在那张写着四问的卡上做出" },
];

function fuzzyHit(text, q) {
  const t = String(text || "").toLowerCase();
  if (!q) return true;
  if (t.indexOf(q) >= 0) return true;
  // 顺序子串：输入 "sj" 也能命中「数据源」这类中文标签的拼音首字母场景有限，
  // 但至少让 "app" 命中 approval、让多词输入按空格逐个命中
  return q.split(/\s+/).filter(Boolean).every((w) => t.indexOf(w) >= 0);
}

/** 面板内容 = 动作 + 当前处置记录 + 示例场景；help 模式只放快捷键说明 */
function paletteItems(q, help) {
  if (help) return PAL_HELP.filter((it) => fuzzyHit(it.label + " " + it.sub, q));
  const out = PAL_ITEMS.filter((it) => fuzzyHit(it.g + it.label + it.sub + " " + it.kw, q));
  const sessions = (st.sessions || []).filter((s) => fuzzyHit(s.title + " " + s.text, q)).slice(0, 6);
  for (const s of sessions) {
    const cfg = STATUS_TEXT[sessStatus(s)];
    out.push({
      g: "处置记录", label: s.title, sub: cfg.txt + " · " + String(s.text || "").slice(0, 26),
      run: () => { st.view = "chat"; st.cur = s.id; st.filter = null; renderAll(); closeDrawers(); const sc = $("stageScroll"); if (sc) sc.scrollTop = 0; },
    });
  }
  const presets = ((st.boot && st.boot.samples) || []).filter((s) => fuzzyHit((s.display || s.title) + " " + s.text, q)).slice(0, 6);
  for (const s of presets) {
    out.push({
      g: "示例场景", label: s.display || s.title, sub: "点一下就跑这条", kw: "sample 示例",
      run: () => runQuery({ msgId: s.msg_id }),
    });
  }
  return out;
}

function palOpen() {
  const p = $("palette");
  return !!(p && p.classList.contains("open"));
}

function openPalette(help) {
  const p = $("palette");
  if (!p) return;
  st.palHelp = !!help;
  p.hidden = false;
  p.classList.add("open");
  const input = $("palInput");
  if (input) { input.value = ""; input.placeholder = help ? "快捷键一览 —— 输入可过滤" : "搜索处置记录，或输入一个动作（审批 / 数据源 / 主题…）"; }
  st.palIdx = 0;
  renderPalette();
  if (input) input.focus();
}

function closePalette() {
  const p = $("palette");
  if (!p) return;
  p.classList.remove("open");
  p.hidden = true;
  if (st.palReturn && st.palReturn.focus) { try { st.palReturn.focus(); } catch (e) { /* 元素可能已不在 */ } }
}

function palList() {
  const q = (($("palInput") || {}).value || "").trim().toLowerCase();
  return paletteItems(q, st.palHelp);
}

function renderPalette() {
  const items = palList();
  if (st.palIdx >= items.length) st.palIdx = Math.max(0, items.length - 1);
  const list = $("palList");
  if (!list) return;
  if (!items.length) {
    list.innerHTML = '<div class="pal-empty">没有匹配的项 —— 换个词，或按 Esc 关掉</div>';
  } else {
    let html = "";
    let lastG = null;
    items.forEach((it, i) => {
      if (it.g !== lastG) { html += '<div class="pal-group">' + esc(it.g) + '</div>'; lastG = it.g; }
      html += '<button class="pal-item' + (i === st.palIdx ? " on" : "") + '" data-pal="' + i + '" role="option" aria-selected="' + (i === st.palIdx ? "true" : "false") + '">' +
        '<span class="ico" aria-hidden="true">' + (st.palHelp ? "⌘" : (it.g === "处置记录" ? "▤" : it.g === "示例场景" ? "◆" : "▸")) + '</span>' +
        '<span class="lb">' + esc(it.label) + '</span>' +
        (it.sub ? '<span class="sub">' + esc(it.sub) + '</span>' : "") + '</button>';
    });
    list.innerHTML = html;
  }
  const cnt = $("palCount");
  if (cnt) cnt.textContent = items.length;
  const on = list.querySelector(".pal-item.on");
  if (on) on.scrollIntoView({ block: "nearest" });
}

function palMove(d) {
  const items = palList();
  if (!items.length) return;
  st.palIdx = (st.palIdx + d + items.length) % items.length;
  renderPalette();
}

function palRun(i) {
  const items = palList();
  const it = items[i];
  if (!it || !it.run) return;
  closePalette();
  it.run();
}

/* ═══════════ 动作表：可点元素 → 处理函数 ═══════════
   上一轮的教训是「同一个词两套属性、几处入口各自实现，迟早分叉」。
   这里把它机制化：元素上只写一个 data-* 属性，分派统一查这张表。
   **表的顺序就是匹配优先级** —— 嵌入式入口必须排在父级之前：
   队列条目里的跟进标签嵌在 [data-q] 里面，先判 data-q 的话，点标签只会选中这条、跳不到跟进面板。
   新增一个可点动作 = 表里加一行 + 元素上加一个属性，不用再动分派逻辑。 */
const ACTIONS = [
  ["#cfgSave", () => saveConfig()],
  ["#cfgTest", () => testConfig()],
  ["[data-cancel-run]", (el) => cancelRun(el.getAttribute("data-cancel-run"))],
  ["[data-retry-run]", (el) => retryRun(el.getAttribute("data-retry-run"))],
  ["[data-goto-config]", () => openConfig()],

  // —— 去跟进 / 跳到某一处：全部收敛到 gotoFollowUp 与视图切换 ——
  ["[data-goto-fu]", (el) => {
    const k = el.getAttribute("data-goto-fu");
    gotoFollowUp(k && k !== "1" ? k : null); // "1" 是旧标记，当作「第一条待接手」
  }],
  ["[data-open-fu]", () => gotoFollowUp(null)], // 右栏概览：不指向具体某条，就是「下一条等我接手的」
  ["[data-focus-input]", () => {
    st.view = "chat";
    renderAll();
    closeDrawers();
    const i = $("input");
    if (i) i.focus();
  }],
  ["[data-goto-sources]", () => { st.view = "sources"; renderAll(); $("stageScroll").scrollTop = 0; }],
  ["[data-goto-appr]", () => { st.view = "approvals"; renderAll(); $("stageScroll").scrollTop = 0; }],

  // —— 左栏队列与指标 ——
  ["[data-q]", (el) => {
    const id = el.getAttribute("data-q");
    if (st.sessions.some((x) => x.id === id)) { st.cur = id; st.view = "chat"; renderAll(); }
    closeDrawers(); // 窄屏下选完就该看见正文，抽屉自己让位
  }],
  ["[data-metric]", (el) => pickMetric(el.getAttribute("data-metric"))],
  ["[data-clear-filter]", () => {
    st.filter = null; st.q = ""; st.qCursor = null;
    const box = $("qSearch"); if (box) box.value = "";
    renderAll(); toast("已显示全部处置记录", "ok");
  }],
  ["[data-preset]", (el) => runQuery({ msgId: el.getAttribute("data-preset") })],

  // —— 数据源页 ——
  ["[data-goto-import]", () => {
    st.view = "sources"; renderAll();
    const el = $("impText");
    if (el) { el.scrollIntoView({ block: "center" }); el.focus(); }
  }],
  ["[data-goto-wx]", () => {
    st.view = "sources"; renderAll();
    const el = $("wxText");
    if (el) { el.scrollIntoView({ block: "center" }); el.focus(); }
  }],
  ["[data-pull]", (el) => pullConnector(el.getAttribute("data-pull"))],
  ["[data-mcp-reconnect]", () => reconnectMcp()],
  ["[data-imp-ds]", (el) => { st.impDataset = el.getAttribute("data-imp-ds"); st.impReport = null; renderAll(); }],
  ["[data-imp-sample]", () => {
    if (st.impText) { st.impText = ""; toast("已清空输入框", ""); }
    else {
      const hit = ((st.sources && st.sources.datasets) || []).find((d) => d.dataset === st.impDataset);
      st.impText = (hit && hit.sample) || "";
      if (!st.impText) { toast("这张表没有预置示例，按表头自己填即可", ""); return; }
      toast("已填入一条示例数据，可直接导入", "ok");
    }
    renderAll();
  }],
  ["[data-imp-run]", () => doIngest()],
  ["[data-wx-run]", () => doInbound()],
  ["[data-wx-sample]", () => {
    st.wxText = WX_SAMPLE;
    if (!st.wxFrom) st.wxFrom = "客户 李先生";
    if (!st.wxChannel) st.wxChannel = "微信小店";
    renderAll();
    const el = $("wxText");
    if (el) el.focus();
  }],

  // —— 处置页内的小交互 ——
  ["[data-fold]", (el) => {
    const box = $("stageInner").querySelector('[data-more="' + el.getAttribute("data-fold") + '"]');
    if (!box) return;
    const open = box.classList.toggle("open");
    el.setAttribute("aria-expanded", open ? "true" : "false");   // 键盘与读屏靠它知道开没开
  }],
  ["[data-tl-all]", (el) => {
    // 展开/收起全部依据：一次点击统一所有折叠，省掉「一个个点开看依据」这种体力活
    const boxes = $("stageInner").querySelectorAll("[data-more]");
    const folds = $("stageInner").querySelectorAll("[data-fold]");
    const anyClosed = Array.prototype.some.call(boxes, (b) => !b.classList.contains("open"));
    Array.prototype.forEach.call(boxes, (b) => b.classList.toggle("open", anyClosed));
    Array.prototype.forEach.call(folds, (f) => f.setAttribute("aria-expanded", anyClosed ? "true" : "false"));
    el.textContent = anyClosed ? "收起全部依据" : "展开全部依据";
  }],
  ["#btnCopy", () => {
    const box = $("replyText");
    const txt = sanitize(box ? box.textContent : "");
    if (navigator.clipboard) {
      navigator.clipboard.writeText(txt).then(() => toast("回复已复制", "ok"), () => toast("复制失败，请手动选择文本", "bad"));
    }
  }],

  // —— 处置动作：跟进 / 审批 ——
  ["[data-fu]", (el) => doFollowup(el.getAttribute("data-fu"))],
  ["[data-approve]", (el) => decideApproval(el.closest(".appr").getAttribute("data-appr"), true)],
  ["[data-reject]", (el) => decideApproval(el.closest(".appr").getAttribute("data-appr"), false)],
  // 失效单子的唯一出口：不是「把这张单子执行掉」，而是按原话重跑一遍
  ["[data-rerun-approval]", (el) => {
    const msgId = el.getAttribute("data-rerun-approval");
    if (!msgId) { toast("这条单子没有对应的客户原话，无法重跑", ""); return; }
    st.view = "chat";
    renderAll();
    runQuery({ msgId: msgId });
  }],
];

document.addEventListener("click", (e) => {
  const t = e.target;
  if (!t || !t.closest) return;
  for (const [sel, fn] of ACTIONS) {
    const el = t.closest(sel);
    if (!el) continue;
    fn(el);
    return; // 一次点击只办一件事：命中即止，不继续往下匹配
  }
});

document.addEventListener("change", (e) => {
  const t = e.target;
  if (!t || t.id !== "impFile" || !t.files || !t.files[0]) return;
  const f = t.files[0];
  const fr = new FileReader();
  fr.onload = () => {
    let text = new TextDecoder("utf-8").decode(fr.result);
    // 中文 Windows 下 Excel 导出的 CSV 常见是 GBK —— 解出乱码就换码表重解，不让人自己转格式
    if (text.includes("\uFFFD")) {
      try { text = new TextDecoder("gbk").decode(fr.result); toast("文件不是 UTF-8，已按 GBK 读入", ""); } catch (err) { /* 保持 UTF-8 结果 */ }
    }
    st.impText = text;
    renderAll();
    toast("已读入 " + f.name + "（" + Math.round(f.size / 1024) + " KB）", "ok");
  };
  fr.onerror = () => toast("文件读取失败", "bad");
  fr.readAsArrayBuffer(f);
});

/* ═══════════ 命令面板与键盘 ═══════════
   三条自律：
    ① 面板里不放金额动作的快捷方式（批准/驳回只能在四问卡上做）；
    ② 在输入框里打字时，除了 Ctrl+K 与 Esc，其余字母键一律让位（不抢输入）；
    ③ 面板开着的时候，焦点不许跑出去 —— Tab 在面板内部循环。 */
function inEditable(el) {
  if (!el) return false;
  const t = el.tagName;
  return t === "INPUT" || t === "TEXTAREA" || t === "SELECT" || el.isContentEditable === true;
}

function palFocusables() {
  const p = $("palette");
  if (!p) return [];
  return [ $("palInput") ].concat(Array.prototype.slice.call(p.querySelectorAll(".pal-item"))).filter(Boolean);
}

function palTrap(e) {
  const items = palFocusables();
  if (!items.length) return;
  const i = items.indexOf(document.activeElement);
  const next = e.shiftKey ? (i <= 0 ? items.length - 1 : i - 1) : (i < 0 || i === items.length - 1 ? 0 : i + 1);
  e.preventDefault();
  items[next].focus();
}

/** 队列里能被键盘走到的那一列（与渲染时的筛选、搜索同一份口径） */
function visibleSessions() {
  const q = (st.q || "").trim();
  let rows = st.filter ? st.sessions.filter((s) => sessStatus(s) === st.filter) : st.sessions.slice();
  if (q) rows = rows.filter((s) => matchesQuery(s, q));
  return rows;
}

function openSession(id) {
  if (!st.sessions.some((x) => x.id === id)) return;
  st.cur = id;
  st.view = "chat";
  renderOnly("queue", "stage", "side", "chrome");
  const sc = $("stageScroll");
  if (sc) sc.scrollTop = 0;
  closeDrawers();
}

function moveQueue(d) {
  const rows = visibleSessions();
  if (!rows.length) return;
  let i = rows.findIndex((s) => s.id === st.qCursor);
  if (i < 0) i = rows.findIndex((s) => s.id === st.cur);
  if (i < 0) i = d > 0 ? -1 : rows.length;
  i = Math.max(0, Math.min(rows.length - 1, i + d));
  st.qCursor = rows[i].id;
  openSession(rows[i].id);
  const el = document.querySelector(".qitem.kb");
  if (el && el.scrollIntoView) el.scrollIntoView({ block: "nearest" });
}

function togglePalette() {
  if (palOpen()) { closePalette(); return; }
  st.palReturn = document.activeElement;
  openPalette(false);
}

document.addEventListener("keydown", (e) => {
  const mod = e.ctrlKey || e.metaKey;
  if (mod && (e.key === "k" || e.key === "K")) { e.preventDefault(); togglePalette(); return; }
  if (palOpen()) {
    if (e.key === "Tab") return palTrap(e);
    if (e.key === "Escape") { e.preventDefault(); closePalette(); return; }
    if (e.key === "ArrowDown") { e.preventDefault(); palMove(1); return; }
    if (e.key === "ArrowUp") { e.preventDefault(); palMove(-1); return; }
    if (e.key === "Enter") { e.preventDefault(); palRun(st.palIdx); return; }
    // 焦点停在某一项上时接着打字：应该继续搜，而不是「什么都没发生」
    if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) {
      const input = $("palInput");
      if (input && document.activeElement !== input) {
        input.focus();
        input.value += e.key;
        st.palIdx = 0;
        renderPalette();
        e.preventDefault();
      }
    }
    return; // 面板开着：其余按键由面板自己处理，不穿透到下面的页面快捷键
  }
  if (inEditable(e.target)) return;
  if (e.key === "/") {
    e.preventDefault();
    st.view = "chat";
    renderAll();
    const i = $("input");
    if (i) i.focus();
    return;
  }
  if (e.key === "?" || (e.key === "/" && e.shiftKey)) { e.preventDefault(); st.palReturn = document.activeElement; openPalette(true); return; }
  if (e.key === "j" || e.key === "ArrowDown") { e.preventDefault(); moveQueue(1); return; }
  if (e.key === "k" || e.key === "ArrowUp") { e.preventDefault(); moveQueue(-1); return; }
  if (e.key === "Enter" && st.qCursor) { e.preventDefault(); openSession(st.qCursor); return; }
  if (/^[1-6]$/.test(e.key)) {
    const d = METRIC_DEFS[Number(e.key) - 1];
    if (d) { e.preventDefault(); pickMetric(d.key); }
  }
});

/* 队列条目是 div（不是 button）：Enter / 空格要自己接，否则键盘用户点不开 */

function renderPresets() {
  const rows = (st.boot && st.boot.samples) || [];
  $("presetList").innerHTML = rows.map((s) =>
    '<button class="preset-btn" data-preset="' + esc(s.msg_id) + '">' + S(s.display || s.title) + '</button>').join("");
}

function setEngineTag() {
  const tag = $("engineTag");
  const usable = !!(st.boot && st.boot.mode === "model");
  const isModel = st.mode === "model";
  tag.innerHTML = '<span class="dot"></span>' + (isModel ? "智能模型判定" : "内置规则判定");
  if (!usable) {
    tag.title = (st.boot && st.boot.llm_problem) || "未配置模型通道";
    tag.style.cursor = "default";
    return;
  }
  tag.style.cursor = "pointer";
  tag.title = isModel
    ? "当前用大模型判定，一条约 20–30 秒。点一下切到内置规则判定（秒级，结论口径一致）"
    : "当前用内置规则判定，秒级出结果。点一下切回大模型判定";
}

async function boot() {
  if (window.__ENGINE_ERROR__) {
    throw new Error("页内引擎启动失败：" + (window.__ENGINE_ERROR__.message || window.__ENGINE_ERROR__));
  }
  try { const t = localStorage.getItem("aftersales.theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) { /* 忽略 */ }
  try { st.approver = localStorage.getItem("aftersales.approver") || ""; } catch (e) { /* 忽略 */ }
  try { st.fuBy = localStorage.getItem("aftersales.follower") || st.approver || ""; } catch (e) { /* 忽略 */ }

  st.boot = await api("/api/bootstrap");
  st.mode = st.boot.mode === "model" ? "model" : "offline";
  // 上一次的选择优先：有密钥时可以一键退回内置规则判定，演示不必等模型
  try {
    const m = localStorage.getItem("aftersales.mode");
    if (st.boot.mode === "model" && (m === "model" || m === "offline")) st.mode = m;
  } catch (e) { /* 忽略 */ }
  setEngineTag();
  renderPresets();
  await loadApprovals();
  // 有先后：先回灌入站带来的案子，再让跟进台账把它的案子补齐（两边按同一个 key 对齐）
  await loadConnectors();
  await loadInbound();
  await loadFollowups();
  renderAll();
  // 地址里带着某个位置（某条案子的跟进 / 审批 / 数据源 / 接口设置），就直接落过去 ——
  // 刷新、粘链接都能回到同一处
  applyRoute({ silent: true });
  routeSynced = true;
  // 再对齐一次：地址指向一个不存在的位置时，把它清掉，别留着一个骗人的地址
  syncRoute();
}

/**
 * 启动就失败：整页是空的。
 * 只弹一句 toast 会让人以为「界面还没加载完」，干等着；所以把原因和出口摆到正文里。
 */
function bootFailed(e) {
  const x = errOf(e);
  const box = $("stageInner");
  if (!box) return;
  box.innerHTML = '<div class="wrap fade-in"><div class="msg agent">' +
      '<div class="who"><span class="av">A</span>售后 Agent<span class="chip bad">启动失败</span></div>' +
      '<div class="bubble fail-bubble"><div class="fb-t">工作台没能启动</div>' +
        '<div class="fb-r">' + esc(sanitize(x.msg)) + '</div>' +
        (x.hint ? '<div class="fb-h">' + esc(x.hint) + '</div>' : "") +
        '<div class="fb-act"><button class="btn sm primary" id="bootRetry">重新加载</button>' +
        '<span class="fb-note">数据没有损坏；把原因处理掉再重新加载即可</span></div>' +
      '</div></div></div>';
  const b = $("bootRetry");
  if (b) b.onclick = () => location.reload();
}
boot().catch((e) => { bootFailed(e); toast("启动失败：" + errOf(e).msg, "bad"); });
</script>
</body>
</html>
