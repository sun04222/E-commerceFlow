<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>售后 Agent · 自主处置台</title>
<style>
/* ═══════════════════════════════════════════════════════════════════════
   售后 Agent · 自主处置台 —— 视觉系统
   ─────────────────────────────────────────────────────────────────────
   这一版的取舍写在最前面，改样式前先读这一段：

   ① 密度与层级优先于留白。使用者是售后运营，一天看几十上百条；一屏能看到
      多少条、每条的「现在什么状态、要你做什么」是否一眼可辨，比好看重要。
      所以正文 13px 起步、行高 1.6，状态一律用「颜色 + 文字」双通道，不靠图形猜。

   ② 一处颜色只表达一件事。蓝=可点的动作，绿=已自主完成，橙=在等人，
      红=被拦下/没跑通，灰=无需动作。用于装饰的颜色一个都不留。

   ③ 深色不是浅色反相。深色下边框更弱、层级靠亮度差，避免一片描边的网格感。

   ④ 全部动效都能关：prefers-reduced-motion 下没有脉冲、没有滑入。
      等待态只有「在跑」这一种含义，不表示进度 —— 进度由真实事件驱动。
   ═══════════════════════════════════════════════════════════════════════ */

/* ═══════════ 设计令牌 ═══════════ */
:root {
  /* 画布与层次 */
  --bg: #f4f5f7;
  --surface: #ffffff;
  --surface-2: #f7f8fa;
  --surface-3: #eef0f4;
  --line: #e2e5ea;
  --line-2: #edf0f4;
  --line-strong: #d3d8e0;

  /* 文字四级：正文 / 次级 / 辅助 / 装饰
     ink-3 与 ink-4 的取值不是挑好看的，是按 WCAG AA 反算出来的：
     它们要在 surface / surface-2 / surface-3 三种底色上都 ≥ 4.5:1
     （实测脚本：.devtools/ui/contrast.mjs，最差底色决定取值）。
     想更浅的灰只能用于**装饰**（边框、图标、禁用态），不能用于要读的字。 */
  --ink: #0c1116;
  --ink-2: #3b4451;
  --ink-3: #5c6672;
  --ink-4: #6a737f;
  --ink-deco: #99a2ad;

  /* 语义色：只有一个蓝是「可点」 */
  --accent: #2563eb;
  --accent-ink: #1d4ed8;
  --accent-soft: #e8effd;
  --ok: #0f9d58;
  --ok-soft: #e7f6ee;
  --warn: #c2740a;
  --warn-soft: #fdf3e3;
  --bad: #d23b3b;
  --bad-soft: #fdeded;
  --info: #2563eb;
  --info-soft: #eaf1fe;

  --rail: #10151c;
  --rail-2: #1a212b;
  --rail-ink: #8b96a5;
  --rail-ink-on: #ffffff;

  --radius: 12px;
  --radius-sm: 9px;
  --radius-lg: 16px;
  --shadow: 0 1px 2px rgba(12, 17, 22, .05), 0 1px 3px rgba(12, 17, 22, .04);
  --shadow-lg: 0 12px 32px rgba(12, 17, 22, .14), 0 2px 8px rgba(12, 17, 22, .06);
  --shadow-pop: 0 18px 48px rgba(12, 17, 22, .22);
  --mono: "SF Mono", "JetBrains Mono", Consolas, "Cascadia Mono", monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
  --dur: .16s;
}

html[data-theme="dark"] {
  --bg: #0a0d11;
  --surface: #12161c;
  --surface-2: #161b22;
  --surface-3: #1c222b;
  --line: #232a34;
  --line-2: #1b2129;
  --line-strong: #2c3542;

  --ink: #e9eef5;
  --ink-2: #b7c0cc;
  --ink-3: #8a94a2;
  --ink-4: #838b96;
  --ink-deco: #626c7a;

  --accent: #5b8cff;
  --accent-ink: #8aabff;
  --accent-soft: #17233c;
  --ok: #34c46f;
  --ok-soft: #10261a;
  --warn: #eaa53a;
  --warn-soft: #2a2011;
  --bad: #f2605f;
  --bad-soft: #2b1618;
  --info: #5b8cff;
  --info-soft: #14203a;

  --rail: #070a0e;
  --rail-2: #121821;
  --rail-ink: #6f7b8b;

  --shadow: 0 1px 2px rgba(0, 0, 0, .4);
  --shadow-lg: 0 14px 36px rgba(0, 0, 0, .5);
  --shadow-pop: 0 20px 52px rgba(0, 0, 0, .6);
}

/* ═══════════ 基础 ═══════════ */
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--sans);
  font-size: 13px;
  line-height: 1.6;
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
h1, h2, h3, p, ul, ol { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: none; padding: 0; }
a { color: var(--accent); }
code, pre, .mono { font-family: var(--mono); font-size: .92em; }
::selection { background: var(--accent-soft); }
.hidden { display: none !important; }
/* 只给读屏用的文字：视觉上不占位，但会被播报 */
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.sp { flex: 1; }
.grow { flex: 1; }
.n { font-variant-numeric: tabular-nums; }

/* 滚动条：细、低对比，不抢内容 */
* { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
*::-webkit-scrollbar { width: 10px; height: 10px; }
*::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 99px; border: 3px solid transparent; background-clip: content-box; }
*::-webkit-scrollbar-thumb:hover { background: var(--ink-4); background-clip: content-box; }
*::-webkit-scrollbar-track { background: transparent; }

/* 焦点：键盘用户必须看得见 —— 鼠标点击不出框，Tab 一定出框 */
:focus { outline: none; }
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 6px;
}
.skip {
  position: absolute; left: 12px; top: -60px; z-index: 200;
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  padding: 8px 14px; font-size: 12.5px; box-shadow: var(--shadow-lg); transition: top var(--dur);
}
.skip:focus { top: 12px; }

/* ═══════════ 应用外壳 ═══════════ */
.app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

.demo-banner {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 7px 16px; font-size: 11.5px; color: var(--ink-3);
  background: var(--surface-3); border-bottom: 1px solid var(--line);
}
.demo-banner b { font-weight: 650; color: var(--ink); }
.demo-banner code { background: var(--surface); border: 1px solid var(--line); padding: 1px 6px; border-radius: 5px; }
.demo-banner .spacer { flex: 1; }

/* ═══════════ 顶栏 ═══════════ */
.top {
  flex: 0 0 auto; display: flex; align-items: center; gap: 14px;
  padding: 0 16px; height: 56px;
  background: var(--surface); border-bottom: 1px solid var(--line);
  z-index: 20;
}
.brand { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
.brand-mark {
  width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center;
  background: linear-gradient(150deg, var(--accent), var(--accent-ink));
  color: #fff; font-size: 14px; font-weight: 700; letter-spacing: .5px;
  box-shadow: 0 2px 6px rgba(37, 99, 235, .3);
}
.brand-text { line-height: 1.2; }
.brand-text b { display: block; font-size: 13.5px; font-weight: 650; letter-spacing: .1px; }
.brand-text span { display: block; font-size: 11px; color: var(--ink-4); }

/* 监管指标条：每一项都是入口，不是装饰 */
.metrics { display: flex; align-items: center; gap: 2px; margin-left: 6px; flex-wrap: nowrap; }
.metric {
  display: flex; align-items: center; gap: 7px;
  padding: 6px 11px; border-radius: 9px; border: 1px solid transparent;
  transition: background var(--dur), border-color var(--dur);
}
.metric:hover { background: var(--surface-2); border-color: var(--line); }
.metric .dot { width: 7px; height: 7px; border-radius: 99px; background: var(--ink-4); flex: 0 0 auto; }
.metric .n { font-size: 15px; font-weight: 700; letter-spacing: -.3px; font-variant-numeric: tabular-nums; }
.metric .k { font-size: 11.5px; color: var(--ink-3); }
.metric.zero .n { color: var(--ink-4); font-weight: 600; }
.metric.zero .dot { opacity: .45; }
.metric.on { background: var(--accent-soft); border-color: var(--accent); }
.metric.on .k { color: var(--accent-ink); font-weight: 600; }
.metric.m-ok .dot { background: var(--ok); }
.metric.m-wait .dot { background: var(--warn); }
.metric.m-stop .dot { background: var(--bad); }
.metric.m-ask .dot { background: var(--ink-4); }
.metric.m-ok.on { background: var(--ok-soft); border-color: var(--ok); }
.metric.m-ok.on .k { color: var(--ok); }
.metric.m-wait.on { background: var(--warn-soft); border-color: var(--warn); }
.metric.m-wait.on .k { color: var(--warn); }
.metric.m-stop.on { background: var(--bad-soft); border-color: var(--bad); }
.metric.m-stop.on .k { color: var(--bad); }

.top-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.engine-tag {
  display: flex; align-items: center; gap: 6px; padding: 6px 12px;
  border: 1px solid var(--line); border-radius: 99px; font-size: 11.5px; color: var(--ink-2);
  transition: border-color var(--dur), background var(--dur);
}
.engine-tag:hover { border-color: var(--line-strong); background: var(--surface-2); }
.engine-tag .dot { width: 6px; height: 6px; border-radius: 99px; background: var(--accent); }
.switch {
  display: flex; align-items: center; gap: 9px; padding: 5px 11px;
  border: 1px solid var(--line); border-radius: 99px; transition: border-color var(--dur);
}
.switch:hover { border-color: var(--line-strong); }
.switch .lbl { font-size: 12px; color: var(--ink-3); }
.switch .st { font-size: 12px; font-weight: 650; color: var(--ok); }
.switch.off .st { color: var(--warn); }
.toggle { width: 34px; height: 19px; border-radius: 99px; background: var(--ok); position: relative; transition: background var(--dur); flex: 0 0 auto; }
.toggle::after { content: ""; position: absolute; top: 2px; left: 17px; width: 15px; height: 15px; border-radius: 99px; background: #fff; transition: left var(--dur); box-shadow: 0 1px 2px rgba(0,0,0,.25); }
.switch.off .toggle { background: var(--line-strong); }
.switch.off .toggle::after { left: 2px; }
.icon-btn {
  width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center;
  color: var(--ink-3); border: 1px solid transparent; font-size: 14px;
  transition: background var(--dur), color var(--dur), border-color var(--dur);
}
.icon-btn:hover { background: var(--surface-2); color: var(--ink); border-color: var(--line); }
.kbd {
  font-family: var(--mono); font-size: 10.5px; padding: 1px 5px; border-radius: 5px;
  border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-3);
}
.pal-btn {
  display: flex; align-items: center; gap: 7px; padding: 5px 10px 5px 12px;
  border: 1px solid var(--line); border-radius: 9px; color: var(--ink-3); font-size: 12px;
  transition: border-color var(--dur), background var(--dur);
}
.pal-btn:hover { border-color: var(--line-strong); background: var(--surface-2); color: var(--ink-2); }

/* ═══════════ 主体四栏 ═══════════ */
.body { flex: 1; display: grid; grid-template-columns: 56px 296px minmax(0, 1fr) 380px; min-height: 0; position: relative; }

/* 图标轨 */
.rail { background: var(--rail); display: flex; flex-direction: column; align-items: center; padding: 10px 0; gap: 4px; }
.rail-btn {
  width: 40px; height: 40px; border-radius: 11px; position: relative;
  display: grid; place-items: center; color: var(--rail-ink);
  transition: background var(--dur), color var(--dur);
}
.rail-btn:hover { background: var(--rail-2); color: #cfd6e0; }
.rail-btn.active { background: var(--accent); color: var(--rail-ink-on); box-shadow: 0 3px 10px rgba(37, 99, 235, .35); }
.rail-btn.narrow { display: none; }
.rail-btn .badge {
  position: absolute; top: 3px; right: 3px; min-width: 16px; height: 16px; padding: 0 4px;
  border-radius: 99px; background: var(--bad); color: #fff; font-size: 10px; font-weight: 700;
  display: grid; place-items: center; border: 2px solid var(--rail);
}
.rail-spacer { flex: 1; }

/* ═══════════ 处置队列 ═══════════ */
.queue { background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.queue-head { padding: 14px 14px 10px; border-bottom: 1px solid var(--line-2); }
.queue-head .t { display: flex; align-items: center; gap: 8px; font-weight: 650; font-size: 13px; }
.queue-head .t .n { color: var(--ink-4); font-weight: 600; font-variant-numeric: tabular-nums; }
.queue-head .s { margin-top: 3px; font-size: 11.5px; color: var(--ink-4); }
.qsearch { margin-top: 10px; position: relative; }
.qsearch input {
  width: 100%; border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 7px 10px 7px 30px; outline: none; background: var(--surface-2); font-size: 12.5px;
  transition: border-color var(--dur), background var(--dur);
}
.qsearch input:focus { border-color: var(--accent); background: var(--surface); }
.qsearch svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--ink-4); }
.qfilter { margin-top: 9px; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.qfilter .pill {
  display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 99px;
  background: var(--accent-soft); color: var(--accent-ink); font-size: 11px; font-weight: 600;
}
.qfilter .clr { font-size: 11px; color: var(--ink-4); }
.qfilter .clr:hover { color: var(--ink); text-decoration: underline; }
.queue-list { flex: 1; overflow-y: auto; padding: 8px; }
.queue-group { font-size: 10.5px; font-weight: 700; letter-spacing: .5px; color: var(--ink-4); padding: 10px 8px 6px; }
.qitem {
  padding: 10px 11px; border-radius: var(--radius-sm); border: 1px solid transparent;
  cursor: pointer; margin-bottom: 3px; position: relative;
  transition: background var(--dur), border-color var(--dur);
}
.qitem:hover { background: var(--surface-2); border-color: var(--line); }
.qitem.active { background: var(--accent-soft); border-color: var(--accent); }
.qitem.kb { box-shadow: inset 0 0 0 2px var(--accent); }
.qitem .r1 { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
.qitem .r1 .name { font-weight: 620; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qitem .r1 .chip { margin-left: auto; flex: 0 0 auto; }
.qitem .r2 { font-size: 11.5px; color: var(--ink-3); line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.qitem .r3 { margin-top: 6px; font-size: 11px; color: var(--ink-4); display: flex; align-items: center; gap: 6px; }
/* 选中项底色是带蓝的浅色，比白底更「吃」灰字：这里单独提一级，
   否则同一行字在未选中时达标、一选中就掉到 4.16:1（实测值） */
.qitem.active .r3 { color: var(--ink-3); }
.qitem .r3 .time { font-variant-numeric: tabular-nums; }

/* 状态胶囊：颜色 + 文字双通道 */
.chip {
  display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 99px;
  font-size: 10.5px; font-weight: 650; white-space: nowrap; border: 1px solid transparent;
  background: var(--surface-3); color: var(--ink-3);
}
.chip.ok { background: var(--ok-soft); color: var(--ok); border-color: rgba(15, 157, 88, .22); }
.chip.wait { background: var(--warn-soft); color: var(--warn); border-color: rgba(194, 116, 10, .24); }
.chip.bad { background: var(--bad-soft); color: var(--bad); border-color: rgba(210, 59, 59, .22); }
.chip.run { background: var(--accent-soft); color: var(--accent-ink); border-color: rgba(37, 99, 235, .22); }
.chip.mute { background: var(--surface-3); color: var(--ink-3); border-color: var(--line); }
.chip-btn { cursor: pointer; }
.chip-btn:hover { border-color: currentColor; }
.fu-tag {
  font-size: 10px; font-weight: 650; padding: 2px 7px; border-radius: 99px;
  background: var(--info-soft); color: var(--accent-ink); border: 1px solid rgba(37, 99, 235, .2);
}
.fu-tag:hover { border-color: var(--accent); }

/* 示例 */
.preset { padding: 10px 12px 12px; border-top: 1px solid var(--line-2); }
.preset .t { font-size: 10.5px; font-weight: 700; color: var(--ink-4); letter-spacing: .5px; margin-bottom: 7px; }
.preset-btn {
  display: block; width: 100%; text-align: left; padding: 7px 10px; margin-bottom: 4px;
  border: 1px solid var(--line); border-radius: 8px; font-size: 12px; color: var(--ink-2);
  background: var(--surface); transition: border-color var(--dur), background var(--dur), transform var(--dur);
}
.preset-btn:hover { border-color: var(--accent); color: var(--accent-ink); background: var(--accent-soft); }
.preset-btn:active { transform: translateY(1px); }

/* ═══════════ 主区 ═══════════ */
.stage { display: flex; flex-direction: column; min-height: 0; background: var(--bg); }
.stage-scroll { flex: 1; overflow-y: auto; padding: 20px 0 10px; }
.wrap { max-width: 780px; margin: 0 auto; padding: 0 22px; }
.wrap2 { max-width: 940px; margin: 0 auto; padding: 22px 24px 40px; }
.intro { max-width: 780px; margin: 0 auto; padding: 26px 22px; }
.intro.wide { max-width: 860px; }
.intro.pt { padding-top: 22px; }
.intro h1 { font-size: 20px; margin: 0 0 8px; letter-spacing: -.3px; }
.intro h1.sm { font-size: 17px; display: flex; align-items: baseline; gap: 10px; }
.intro h1 .sub { font-size: 12.5px; font-weight: 500; color: var(--ink-4); }
.intro .lead { font-size: 13px; color: var(--ink-2); line-height: 1.8; margin-bottom: 20px; }
.mb16 { margin-bottom: 16px; }
.mt-10 { margin-top: 10px; } .mt-2 { margin-top: 8px; } .mt { margin-top: 8px; }
.fade-in { animation: fadeUp .22s ease both; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }

/* 通用卡片 */
.card, .panel, .bsec, .work, .result, .src-card, .cfg-card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
}

/* 首屏工作台 */
.board { max-width: 840px; margin: 0 auto; padding: 22px 22px 8px; }
.board-top { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; }
.board-top h1 { font-size: 16px; letter-spacing: -.2px; }
.board-top .sub { font-size: 12px; color: var(--ink-4); margin-left: auto; }
.bsec { padding: 14px 16px; margin-bottom: 12px; }
.bsec.focus { border-left: 3px solid var(--warn); }
.bsec > .bt { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; letter-spacing: .5px; color: var(--ink-4); margin-bottom: 10px; }
.bsec .empty-line { font-size: 12.5px; color: var(--ink-4); padding: 5px 0; line-height: 1.7; }
.bsec .empty-line.tight { padding: 2px 0; }
.brow { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 8px; margin: 0 -8px; transition: background var(--dur); }
.brow + .brow { border-top: 1px solid var(--line-2); border-radius: 0; }
.brow.click { cursor: pointer; }
.brow.click:hover { background: var(--surface-2); }
.brow .nm { font-size: 12.5px; font-weight: 600; flex: 0 0 auto; max-width: 46%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.brow .tx { flex: 1; min-width: 0; font-size: 11.5px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.brow .amt { font-variant-numeric: tabular-nums; font-weight: 650; font-size: 12px; }
.amt-warn { color: var(--warn); }
.dschips { display: flex; flex-wrap: wrap; gap: 7px; }
.dschip {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px;
  border: 1px solid var(--line); border-radius: 99px; font-size: 11.5px; color: var(--ink-2); background: var(--surface);
}
.dschip b { font-weight: 650; color: var(--ink); font-variant-numeric: tabular-nums; }
.dschip .dot { width: 6px; height: 6px; border-radius: 99px; background: var(--ok); }
.dschip.off { color: var(--ink-4); }
button.dschip:hover { border-color: var(--accent); color: var(--accent-ink); }

/* 通用按钮 */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 7px 13px; border-radius: var(--radius-sm); font-size: 12.5px; font-weight: 600;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink-2);
  transition: background var(--dur), border-color var(--dur), color var(--dur), transform var(--dur);
  white-space: nowrap;
}
.btn:hover { border-color: var(--line-strong); background: var(--surface-2); color: var(--ink); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-ink); border-color: var(--accent-ink); color: #fff; }
.btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn.ok:hover { filter: brightness(.94); color: #fff; }
.btn.danger { background: var(--surface); border-color: var(--bad); color: var(--bad); }
.btn.danger:hover { background: var(--bad-soft); }
.btn.sm { padding: 5px 10px; font-size: 11.5px; }
.btn.xs { padding: 3px 8px; font-size: 11px; border-radius: 7px; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); border-color: var(--line); }
.btn[disabled] { opacity: .5; pointer-events: none; }
.btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

/* ═══════════ 对话流 ═══════════ */
.thread { display: flex; flex-direction: column; gap: 18px; }
.msg { display: flex; flex-direction: column; gap: 8px; }
.msg .who { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--ink-4); }
.msg .who .av {
  width: 24px; height: 24px; border-radius: 8px; display: grid; place-items: center;
  font-size: 11px; font-weight: 700; color: #fff; background: var(--ink-4);
}
.msg.cust .who .av { background: linear-gradient(150deg, #6b7280, #4b5563); }
.msg.agent .who .av { background: linear-gradient(150deg, var(--accent), var(--accent-ink)); }
.msg .who .nm { font-weight: 600; color: var(--ink-2); }
.msg .bubble {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 13px 15px; font-size: 13.5px; line-height: 1.8; box-shadow: var(--shadow);
}
.msg.cust .bubble { border-left: 3px solid var(--line-strong); color: var(--ink); }
.msg .bubble.run-line { display: flex; align-items: center; gap: 10px; color: var(--ink-2); font-size: 12.5px; }
.msg .bubble .el { color: var(--ink-4); font-variant-numeric: tabular-nums; margin-left: auto; }

/* 转圈：只表示「在跑」 */
.spin {
  width: 13px; height: 13px; border-radius: 99px; flex: 0 0 auto;
  border: 2px solid var(--accent-soft); border-top-color: var(--accent);
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* 失败卡 */
.msg .bubble.fail-bubble { border-color: var(--bad); background: var(--bad-soft); }
.fb-t { font-weight: 700; font-size: 13px; color: var(--bad); margin-bottom: 6px; }
.fb-r { font-size: 12.5px; color: var(--ink-2); line-height: 1.7; }
.fb-h { font-size: 11.5px; color: var(--ink-3); line-height: 1.7; margin-top: 6px; }
.fb-act { display: flex; align-items: center; gap: 9px; margin-top: 11px; flex-wrap: wrap; }
.fb-note { font-size: 11px; color: var(--ink-4); }

/* ═══════════ 执行流时间线（本版核心） ═══════════
   为什么不是一张「六行清单」：这一步一步到底发生过什么，是这个产品最该被看见的东西。
   清单只能显示「第几步」，时间线能显示「谁在什么时候做了什么、花了多久、依据是什么」，
   而且它是**事件驱动**的：跑的时候是真值，不是先写死再逐拍点亮。 */
.tl { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.tl-head { display: flex; align-items: center; gap: 9px; padding: 12px 15px; border-bottom: 1px solid var(--line-2); flex-wrap: wrap; }
.tl-title { font-weight: 650; font-size: 12.5px; }
.tl-sub { font-size: 11.5px; color: var(--ink-4); }
.tl-head .sp { flex: 1; }
.tl-list { padding: 6px 8px 8px; }

.tl-step { display: grid; grid-template-columns: 26px minmax(0, 1fr); position: relative; }
.tl-gutter { display: flex; flex-direction: column; align-items: center; padding-top: 8px; }
.tl-node {
  width: 20px; height: 20px; border-radius: 99px; display: grid; place-items: center;
  font-size: 11px; font-weight: 700; color: #fff; background: var(--ink-4); flex: 0 0 auto;
  border: 2px solid var(--surface); z-index: 1;
}
.tl-wire { flex: 1; width: 2px; background: var(--line); margin: 2px 0 -2px; min-height: 8px; }
.tl-step:last-child .tl-wire { background: transparent; }
.tl-body { padding: 7px 8px 6px 4px; border-radius: var(--radius-sm); min-width: 0; }
.tl-step:hover .tl-body { background: var(--surface-2); }
.tl-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tl-label { font-size: 12.5px; font-weight: 620; }
.tl-dur { font-size: 10.5px; color: var(--ink-4); font-variant-numeric: tabular-nums; margin-left: auto; }
.tl-text { font-size: 11.5px; color: var(--ink-2); line-height: 1.6; margin-top: 2px; }
.tl-fold { font-size: 10.5px; color: var(--ink-4); margin-top: 4px; display: inline-flex; align-items: center; gap: 4px; }
.tl-fold:hover { color: var(--accent); }
.tl-fold[aria-expanded="true"] .tri { transform: rotate(90deg); }
.tl-fold .tri { transition: transform var(--dur); font-size: 9px; }
.tl-detail { display: none; margin-top: 8px; padding: 9px 11px; background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 8px; }
.tl-detail.open { display: block; }
.tl-kv { display: flex; gap: 9px; margin-bottom: 5px; font-size: 11.5px; line-height: 1.7; }
.tl-kv:last-child { margin-bottom: 0; }
.tl-kv .k { flex: 0 0 78px; color: var(--ink-4); }
.tl-kv .v { flex: 1; color: var(--ink-2); min-width: 0; word-break: break-word; }
.tl-ev { display: flex; gap: 8px; font-size: 11.5px; color: var(--ink-3); line-height: 1.7; padding: 3px 0; }
.tl-ev .sq { flex: 0 0 auto; font-family: var(--mono); font-size: 10px; color: var(--ink-4); min-width: 16px; text-align: right; }
.tl-ev .tx { flex: 1; min-width: 0; }
.tl-ev .tm { flex: 0 0 auto; font-variant-numeric: tabular-nums; color: var(--ink-4); font-size: 10.5px; }
.tl-evh { font-size: 10.5px; font-weight: 700; letter-spacing: .4px; color: var(--ink-4); margin-bottom: 5px; }

/* 六态节点配色 */
.tl-step.done .tl-node { background: var(--ok); }
.tl-step.warn .tl-node { background: var(--warn); }
.tl-step.bad .tl-node { background: var(--bad); }
.tl-step.wait .tl-node { background: var(--warn); }
.tl-step.run .tl-node { background: var(--accent); animation: pulse 1.5s ease-in-out infinite; }
.tl-step.skip .tl-node { background: var(--surface-3); color: var(--ink-4); border-color: var(--surface); }
.tl-step.idle .tl-node { background: var(--surface-3); color: var(--ink-4); }
.tl-step.idle .tl-label, .tl-step.idle .tl-text { color: var(--ink-4); }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(37, 99, 235, .45); } 50% { box-shadow: 0 0 0 6px rgba(37, 99, 235, 0); } }

/* 事件流小卡（数据源页/右栏共用） */
.run-line { display: flex; align-items: center; gap: 10px; }
.bar { height: 3px; background: var(--surface-3); position: relative; overflow: hidden; }
.bar i { position: absolute; inset: 0; width: 35%; background: var(--accent); animation: slide 1.15s ease-in-out infinite; }
@keyframes slide { 0% { left: -35%; } 100% { left: 100%; } }

/* 骨架 */
.skel-row { display: flex; align-items: center; gap: 10px; padding: 9px 10px; }
.sk { height: 9px; border-radius: 99px; background: var(--surface-3); position: relative; overflow: hidden; }
.sk::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); animation: shimmer 1.4s infinite; }
html[data-theme="dark"] .sk::after { background: linear-gradient(90deg, transparent, rgba(255,255,255,.07), transparent); }
@keyframes shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
.skel-dot { width: 18px; height: 18px; border-radius: 99px; background: var(--surface-3); flex: 0 0 auto; }

/* ═══════════ 结论卡 ═══════════ */
.verdict {
  display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px;
  border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface);
  box-shadow: var(--shadow); border-left-width: 4px;
}
.verdict .vd-icon {
  width: 26px; height: 26px; border-radius: 99px; display: grid; place-items: center;
  color: #fff; font-size: 14px; font-weight: 700; flex: 0 0 auto; background: var(--ink-4);
}
.verdict .vd-main { flex: 1; min-width: 0; }
.verdict .vd-title { font-size: 14px; font-weight: 680; letter-spacing: -.1px; }
.verdict .vd-sub { font-size: 12.5px; color: var(--ink-2); line-height: 1.7; margin-top: 2px; }
.verdict .vd-amt { text-align: right; flex: 0 0 auto; }
.verdict .vd-amt b { display: block; font-size: 19px; font-weight: 700; letter-spacing: -.4px; font-variant-numeric: tabular-nums; }
.verdict .vd-amt span { font-size: 10.5px; color: var(--ink-4); }
.verdict .vd-act { display: flex; gap: 7px; align-items: center; flex: 0 0 auto; }
.verdict.ok { border-left-color: var(--ok); }
.verdict.ok .vd-icon { background: var(--ok); }
.verdict.ok .vd-amt b { color: var(--ok); }
.verdict.wait { border-left-color: var(--warn); background: var(--warn-soft); }
.verdict.wait .vd-icon { background: var(--warn); }
.verdict.wait .vd-amt b { color: var(--warn); }
.verdict.bad { border-left-color: var(--bad); background: var(--bad-soft); }
.verdict.bad .vd-icon { background: var(--bad); }
.verdict.bad .vd-amt b { color: var(--bad); }
.verdict.mute { border-left-color: var(--line-strong); }
.verdict.mute .vd-icon { background: var(--ink-4); }

.result { overflow: hidden; }
.result-head { padding: 13px 15px; border-bottom: 1px solid var(--line-2); display: flex; align-items: center; gap: 10px; }
.result-head .t { font-weight: 650; font-size: 13px; }
.result-head .amt { margin-left: auto; font-size: 17px; font-weight: 700; letter-spacing: -.3px; font-variant-numeric: tabular-nums; }
.result-sec { padding: 13px 15px; border-bottom: 1px solid var(--line-2); }
.result-sec:last-child { border-bottom: none; }
.result-sec .st { font-size: 10.5px; font-weight: 700; letter-spacing: .5px; color: var(--ink-4); margin-bottom: 9px; }
.kvlist { display: flex; gap: 10px; margin-bottom: 6px; font-size: 12.5px; }
.kvlist:last-child { margin-bottom: 0; }
.kvlist .k { flex: 0 0 96px; color: var(--ink-3); }
.kvlist .v { flex: 1; line-height: 1.65; min-width: 0; word-break: break-word; }
.kvlist code { background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 4px; padding: 1px 5px; color: var(--ink-3); }
.reply-box {
  background: var(--info-soft); border: 1px solid rgba(37, 99, 235, .18); border-radius: var(--radius-sm);
  padding: 12px 13px; font-size: 12.5px; line-height: 1.8; white-space: pre-wrap;
}
.reply-foot { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }

/* 横幅 */
.banner {
  border-radius: var(--radius); padding: 12px 14px; display: flex; align-items: flex-start; gap: 10px;
  font-size: 12.5px; line-height: 1.7; margin-bottom: 16px; border: 1px solid var(--line); background: var(--surface);
}
.banner.flush { margin-bottom: 0; border-radius: var(--radius) var(--radius) 0 0; border-bottom: none; }
.banner .bi { flex: 0 0 auto; width: 20px; height: 20px; border-radius: 99px; display: grid; place-items: center; color: #fff; font-size: 12px; font-weight: 700; background: var(--ink-4); }
.banner b { font-weight: 650; }
.banner .actions { margin-left: auto; flex: 0 0 auto; display: flex; gap: 7px; }
.banner.ok { background: var(--ok-soft); border-color: rgba(15,157,88,.2); }
.banner.ok .bi { background: var(--ok); }
.banner.wait { background: var(--warn-soft); border-color: rgba(194,116,10,.24); }
.banner.wait .bi { background: var(--warn); }
.banner.bad { background: var(--bad-soft); border-color: rgba(210,59,59,.2); }
.banner.bad .bi { background: var(--bad); }
.banner.mute { background: var(--surface-2); }
.banner.mute .bi { background: var(--ink-4); }
.banner.gap { margin-bottom: 12px; }
.banner.gap2 { margin-bottom: 10px; }

/* ═══════════ 输入区 ═══════════ */
.composer { flex: 0 0 auto; border-top: 1px solid var(--line); background: var(--surface); padding: 12px 0; }
.composer-in { max-width: 780px; margin: 0 auto; padding: 0 22px; }
.composer-box {
  display: flex; align-items: flex-end; gap: 9px; border: 1px solid var(--line);
  border-radius: var(--radius); padding: 9px 10px; background: var(--surface);
  transition: border-color var(--dur), box-shadow var(--dur);
}
.composer-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.composer textarea { flex: 1; border: none; outline: none; resize: none; height: 24px; max-height: 148px; line-height: 24px; background: transparent; font-size: 13.5px; }
.composer textarea::placeholder { color: var(--ink-4); }
.composer .hint { font-size: 11px; color: var(--ink-4); margin-top: 7px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.composer .hint .hintlink { font-size: 11px; color: var(--ink-4); }
.composer .hint .hintlink:hover { color: var(--accent); text-decoration: underline; }

/* ═══════════ 右栏 ═══════════ */
.side { background: var(--surface); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.side-head { padding: 13px 15px 0; border-bottom: 1px solid var(--line-2); display: flex; align-items: center; }
.side-tabs { display: flex; gap: 16px; }
.side-tab { padding: 0 0 10px; font-size: 12.5px; font-weight: 620; color: var(--ink-3); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.side-tab.active { color: var(--ink); border-bottom-color: var(--accent); }
.side-tab .cnt { display: inline-grid; place-items: center; min-width: 16px; height: 16px; padding: 0 4px; margin-left: 5px; border-radius: 99px; background: var(--warn); color: #fff; font-size: 10px; font-weight: 700; vertical-align: 1px; }
.side-body { flex: 1; overflow-y: auto; padding: 14px 15px 24px; }
.side-title { font-size: 15px; font-weight: 660; margin-bottom: 4px; }
.side-lead { font-size: 12px; color: var(--ink-3); line-height: 1.7; margin-bottom: 14px; }
.sec { margin-bottom: 18px; }
.sec > .st { font-size: 10.5px; font-weight: 700; letter-spacing: .5px; color: var(--ink-4); margin-bottom: 9px; display: flex; align-items: center; gap: 7px; }
.sec > .st .hint { font-weight: 500; font-size: 11px; color: var(--ink-4); letter-spacing: 0; }
.note-plain { font-size: 12px; color: var(--ink-2); line-height: 1.7; }
.note-plain.sm { font-size: 11.5px; }
.empty-side { text-align: center; padding: 34px 12px; color: var(--ink-4); font-size: 12.5px; line-height: 1.9; }
.empty-side .big { font-size: 24px; margin-bottom: 8px; opacity: .6; }
.empty-side.pad-narrow { padding: 26px 10px; }
.loading-line { padding: 20px 0; color: var(--ink-4); }
.shome { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 4px; }
.shome .it {
  border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 11px 8px; text-align: center;
  transition: border-color var(--dur), background var(--dur);
}
.shome .it:hover { border-color: var(--accent); background: var(--accent-soft); }
.shome .it .n { font-size: 19px; font-weight: 700; letter-spacing: -.4px; font-variant-numeric: tabular-nums; }
.shome .it .k { font-size: 11px; color: var(--ink-3); margin-top: 1px; }
.shome .it.ok .n { color: var(--ok); }
.shome .it.wait .n { color: var(--warn); }
.shome .it.stop .n { color: var(--bad); }
.shome .it.zero { opacity: .55; }
.sact {
  display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
  padding: 9px 11px; border: 1px solid var(--line); border-radius: var(--radius-sm);
  font-size: 12.5px; color: var(--ink-2); margin-bottom: 6px; background: var(--surface);
  transition: border-color var(--dur), background var(--dur), color var(--dur);
}
.sact:hover { border-color: var(--accent); color: var(--accent-ink); background: var(--accent-soft); }
.sact .cnt { color: var(--ink-4); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.sact:hover .cnt { color: var(--accent-ink); }

/* 人工跟进台账 */
.fu { border: 1px solid rgba(37, 99, 235, .26); border-radius: var(--radius); background: var(--surface); overflow: hidden; margin-bottom: 16px; }
.fu-h { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: var(--surface-2); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.fu-h .st2 { font-size: 12.5px; font-weight: 700; }
.fu-h .who { font-size: 11px; color: var(--ink-4); margin-left: auto; }
.fu-b { padding: 12px; }
.fu-line { margin-bottom: 8px; }
.fu-line.split { display: flex; gap: 8px; align-items: center; }
.fu-b input, .fu-b textarea {
  width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
  outline: none; background: var(--surface); font-size: 12.5px;
}
.fu-b input:focus, .fu-b textarea:focus { border-color: var(--accent); }
.fu-b textarea { min-height: 74px; resize: vertical; line-height: 1.7; }
.fu-acts { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 8px; }
.fu-log { margin-top: 12px; border-top: 1px dashed var(--line); padding-top: 10px; }
.fu-log li { padding: 7px 0; border-bottom: 1px solid var(--line-2); font-size: 12px; }
.fu-log li:last-child { border-bottom: none; }
.fu-log .l1 { font-weight: 600; color: var(--ink-2); display: flex; align-items: center; gap: 8px; }
.fu-log .l1 .t { margin-left: auto; font-weight: 400; font-size: 11px; color: var(--ink-4); }
.fu-log .l2 { font-size: 12px; color: var(--ink-3); margin-top: 3px; line-height: 1.65; }
.fu-empty { font-size: 11.5px; color: var(--ink-4); line-height: 1.8; background: var(--surface-2); border-radius: 8px; padding: 10px 11px; }
.mem-ul { margin: 0; }
.mem-li { padding: 8px 0; border-bottom: 1px solid var(--line-2); }
.mem-li:last-child { border-bottom: none; }
.mem-li .m1 { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.mem-li .mn { font-size: 12px; font-weight: 620; }
.mem-li .mt { margin-left: auto; font-size: 10.5px; color: var(--ink-4); font-variant-numeric: tabular-nums; }
.mem-li .m2 { font-size: 11.5px; color: var(--ink-3); line-height: 1.65; margin-top: 3px; }
.mem-note { font-size: 11px; color: var(--ink-4); line-height: 1.75; margin-top: 8px; }

/* ═══════════ 审批卡（四问） ═══════════ */
.appr { border: 1px solid rgba(194, 116, 10, .34); border-radius: var(--radius); overflow: hidden; margin-bottom: 14px; background: var(--surface); }
.appr.inline { margin-bottom: 0; box-shadow: var(--shadow); }
.appr-head { padding: 12px 14px; background: var(--warn-soft); border-bottom: 1px solid rgba(194, 116, 10, .22); }
.appr-head .r1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.appr-head .r1 .id { font-family: var(--mono); font-size: 10.5px; color: var(--ink-4); }
.appr-head .r1 .amt { margin-left: auto; font-size: 17px; font-weight: 700; color: var(--warn); font-variant-numeric: tabular-nums; }
.appr-head .r2 { margin-top: 6px; font-size: 12px; color: var(--ink-2); line-height: 1.65; }
.appr-body { padding: 13px 14px; }
.appr-q { font-size: 10.5px; font-weight: 700; color: var(--ink-4); letter-spacing: .4px; margin: 0 0 6px; }
.appr-body > .appr-q:not(:first-child) { margin-top: 14px; }
.appr-quote { background: var(--surface-2); border-left: 3px solid var(--line-strong); border-radius: 0 8px 8px 0; padding: 9px 11px; font-size: 12px; color: var(--ink-2); line-height: 1.7; }
.appr-ul { margin: 0; padding-left: 16px; font-size: 12px; color: var(--ink-2); line-height: 1.75; list-style: disc; }
.appr-ul li { margin-bottom: 3px; }
.appr-ul.warn-li { color: var(--warn); }
.appr-out { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.appr-out .o { border-radius: 8px; padding: 10px 11px; font-size: 11.5px; line-height: 1.65; border: 1px solid transparent; }
.appr-out .o.a { background: var(--ok-soft); border-color: rgba(15,157,88,.24); }
.appr-out .o.r { background: var(--bad-soft); border-color: rgba(210,59,59,.22); }
.appr-out .o .h { font-weight: 700; margin-bottom: 4px; }
.appr-out .o.a .h { color: var(--ok); }
.appr-out .o.r .h { color: var(--bad); }
.appr-form { margin-top: 14px; padding-top: 13px; border-top: 1px dashed var(--line); }
.appr-form input { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; outline: none; margin-bottom: 8px; background: var(--surface); font-size: 12.5px; }
.appr-form input:focus { border-color: var(--accent); }
.appr-act { display: flex; gap: 8px; flex-wrap: wrap; }
.appr-act .btn { flex: 1; padding: 8px; min-width: 132px; }
.appr-warn { font-size: 11px; color: var(--ink-4); margin-top: 9px; line-height: 1.65; }
.fw6 { font-weight: 650; }

/* ═══════════ 数据源页 ═══════════ */
.phead { display: flex; align-items: center; gap: 9px; margin-bottom: 13px; flex-wrap: wrap; }
.phead h1 { font-size: 17px; letter-spacing: -.2px; }
.phead .sp { flex: 1; }
.statline { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; margin-bottom: 15px; font-size: 12px; color: var(--ink-3); }
.src-card { margin-bottom: 10px; overflow: hidden; transition: border-color var(--dur); }
.src-card:hover { border-color: var(--line-strong); }
.src-card.busy { opacity: .7; }
.src-head { display: flex; align-items: center; gap: 9px; padding: 12px 14px; flex-wrap: wrap; }
.src-head .nm { font-weight: 650; font-size: 13px; }
.src-head .sp { flex: 1; }
.bdg { font-size: 10px; font-weight: 700; letter-spacing: .4px; padding: 2px 7px; border-radius: 5px; background: var(--accent-soft); color: var(--accent-ink); }
.bdg.file { background: var(--surface-3); color: var(--ink-3); }
.bdg.hook { background: var(--ok-soft); color: var(--ok); }
.src-body { padding: 0 14px 13px; }
.src-desc { font-size: 12px; color: var(--ink-2); line-height: 1.7; }
.src-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
.src-tools { margin-top: 10px; font-size: 11px; color: var(--ink-4); line-height: 1.95; }
.src-tools code { background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 4px; padding: 1px 5px; color: var(--ink-3); }
.src-tools .tool-on { color: var(--ok); }
.src-tools .tool-off { color: var(--ink-4); }
.src-note { margin-top: 10px; font-size: 11.5px; color: var(--ink-2); background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 8px; padding: 9px 11px; line-height: 1.8; }
.src-note.bad { background: var(--bad-soft); border-color: rgba(210,59,59,.2); }
.src-note b { color: var(--ink); }
.chan-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px 22px; }
.chan-grid .kvlist .k { flex: 0 0 84px; }
.chan-problem { margin-top: 11px; }
.chan-fallback { margin-top: 8px; font-size: 11.5px; color: var(--ink-3); line-height: 1.8; }
.chan-static { font-size: 11.5px; color: var(--ink-4); }
.panel { margin-bottom: 12px; }
.panel-head { display: flex; align-items: center; gap: 9px; padding: 12px 14px; border-bottom: 1px solid var(--line-2); flex-wrap: wrap; }
.panel-head b { font-size: 13px; }
.panel-head .sub { font-size: 11.5px; color: var(--ink-4); }
.panel-head .sp { flex: 1; }
.panel-body { padding: 13px 14px; }
.imp-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.imp-tab { padding: 5px 11px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); font-size: 11.5px; color: var(--ink-2); transition: all var(--dur); }
.imp-tab:hover { border-color: var(--accent); color: var(--accent-ink); }
.imp-tab.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-ink); font-weight: 620; }
.imp-tab b { font-variant-numeric: tabular-nums; opacity: .75; margin-left: 3px; font-weight: 600; }
.imp-box { width: 100%; min-height: 132px; border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px 11px; font-family: var(--mono); font-size: 11.5px; line-height: 1.65; resize: vertical; outline: none; background: var(--surface-2); }
.imp-box:focus { border-color: var(--accent); background: var(--surface); }
.imp-act { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.imp-act .sp { flex: 1; }
.rep { margin-top: 10px; font-size: 11.5px; line-height: 1.9; border-radius: 8px; padding: 10px 11px; background: var(--ok-soft); border: 1px solid rgba(15,157,88,.2); color: var(--ink-2); }
.rep.bad { background: var(--bad-soft); border-color: rgba(210,59,59,.2); }
.rep b { color: var(--ink); }
.rep .li { display: block; }
.wx-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
.wx-form input, .wx-form textarea { width: 100%; border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 8px 10px; outline: none; margin-bottom: 8px; background: var(--surface); font-size: 12.5px; }
.wx-form textarea { min-height: 78px; resize: vertical; line-height: 1.7; }
.wx-form input:focus, .wx-form textarea:focus { border-color: var(--accent); }
.wx-form input::placeholder, .wx-form textarea::placeholder { color: var(--ink-4); }
.wx-act { display: flex; gap: 8px; flex-wrap: wrap; }
.wx-hint { margin-top: 9px; font-size: 11px; color: var(--ink-4); line-height: 1.8; }
.wx-hint code { background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 4px; padding: 1px 5px; color: var(--ink-3); }
.wx-log { border: 1px solid var(--line-2); border-radius: var(--radius-sm); overflow: hidden; display: flex; flex-direction: column; }
.wx-log-h { padding: 8px 11px; font-size: 10.5px; font-weight: 700; letter-spacing: .4px; color: var(--ink-4); background: var(--surface-2); border-bottom: 1px solid var(--line-2); }
.wx-log-b { max-height: 260px; overflow-y: auto; }
.wx-item { padding: 9px 11px; border-bottom: 1px solid var(--line-2); }
.wx-item:last-child { border-bottom: none; }
.wx-item .r1 { display: flex; align-items: center; gap: 7px; margin-bottom: 4px; }
.wx-item .r1 .f { font-size: 11.5px; font-weight: 620; }
.wx-item .r1 .t { margin-left: auto; font-size: 10.5px; color: var(--ink-4); font-variant-numeric: tabular-nums; }
.wx-item .r2 { font-size: 11.5px; color: var(--ink-3); line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.hintdet { margin-top: 12px; border-top: 1px dashed var(--line); padding-top: 11px; }
.hintdet > summary { font-size: 11.5px; color: var(--accent); cursor: pointer; }
.hintdet .bd { margin-top: 9px; font-size: 11.5px; color: var(--ink-2); line-height: 1.9; }
.hintdet .bd ol { margin: 6px 0 0; padding-left: 18px; list-style: decimal; }
.hintdet .bd code { background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 4px; padding: 1px 5px; }

/* ═══════════ 接口设置页 ═══════════ */
.cfg-wrap { display: flex; flex-direction: column; gap: 12px; }
.cfg-card { padding: 15px 16px; }
.cfg-row { margin-bottom: 13px; }
.cfg-row label { display: block; font-size: 11.5px; font-weight: 650; color: var(--ink-2); margin-bottom: 5px; }
.cfg-row input { width: 100%; border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 9px 11px; outline: none; background: var(--surface); font-size: 12.5px; }
.cfg-row input:focus { border-color: var(--accent); }
.cfg-row .hint { font-size: 11px; color: var(--ink-4); margin-top: 5px; line-height: 1.6; }
.cfg-grid2 { display: grid; grid-template-columns: minmax(0, 1fr) 168px; gap: 12px; }
.cfg-clear { display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--ink-3); margin-bottom: 12px; }
.cfg-acts { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.cfg-acts .hint { font-size: 11px; color: var(--ink-4); }
.cfg-out { margin-top: 12px; font-family: var(--mono); font-size: 11.5px; line-height: 1.8; white-space: pre-wrap; color: var(--ink-2); background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 8px; padding: 10px 11px; min-height: 0; }
.cfg-out:empty { display: none; }
.cfg-note { font-size: 12px; color: var(--ink-2); line-height: 1.85; }
.cfg-note b { color: var(--ink); }
.cfg-cmd { font-family: var(--mono); font-size: 11.5px; background: var(--surface-3); border: 1px solid var(--line-2); border-radius: 6px; padding: 7px 9px; margin-top: 7px; }
.cfg-state { display: flex; gap: 9px; align-items: baseline; padding: 12px 14px; border-radius: var(--radius); font-size: 12.5px; line-height: 1.7; border: 1px solid var(--line); background: var(--surface); }
.cfg-state .k { font-weight: 680; flex: 0 0 auto; }
.cfg-state.ok { background: var(--ok-soft); border-color: rgba(15,157,88,.22); }
.cfg-state.ok .k { color: var(--ok); }
.cfg-state.bad { background: var(--warn-soft); border-color: rgba(194,116,10,.24); }
.cfg-state.bad .k { color: var(--warn); }
.cfg-warn { display: flex; gap: 8px; font-size: 11.5px; line-height: 1.8; color: var(--warn); background: var(--warn-soft); border: 1px solid rgba(194,116,10,.22); border-radius: 8px; padding: 10px 11px; margin-bottom: 12px; }
.cfg-warn > span:first-child { font-weight: 700; }

/* ═══════════ 命令面板 ═══════════ */
.palette {
  position: fixed; inset: 0; z-index: 120; display: none;
  background: rgba(10, 14, 20, .42); backdrop-filter: blur(2px);
  padding: 12vh 16px 16px; overflow-y: auto;
}
.palette.open { display: block; animation: fadeIn .12s ease both; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.pal-box {
  max-width: 620px; margin: 0 auto; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius-lg); box-shadow: var(--shadow-pop); overflow: hidden;
  animation: popIn .16s cubic-bezier(.2, .9, .3, 1) both;
}
@keyframes popIn { from { opacity: 0; transform: translateY(-8px) scale(.99); } to { opacity: 1; transform: none; } }
.pal-input { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line-2); }
.pal-input input { flex: 1; border: none; outline: none; background: transparent; font-size: 14.5px; }
.pal-input input::placeholder { color: var(--ink-4); }
.pal-list { max-height: 52vh; overflow-y: auto; padding: 8px; }
.pal-group { font-size: 10.5px; font-weight: 700; letter-spacing: .5px; color: var(--ink-4); padding: 9px 10px 5px; }
.pal-item {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  padding: 9px 10px; border-radius: 9px; font-size: 13px; color: var(--ink-2);
  transition: background var(--dur);
}
.pal-item:hover, .pal-item.on { background: var(--accent-soft); color: var(--accent-ink); }
.pal-item .ico { width: 20px; text-align: center; color: var(--ink-4); flex: 0 0 auto; }
.pal-item.on .ico { color: var(--accent); }
.pal-item .sub { margin-left: auto; font-size: 11px; color: var(--ink-4); }
.pal-item.on .sub { color: var(--accent-ink); }
.pal-foot { display: flex; align-items: center; gap: 14px; padding: 9px 14px; border-top: 1px solid var(--line-2); font-size: 11px; color: var(--ink-4); background: var(--surface-2); }
.pal-empty { padding: 26px 16px; text-align: center; color: var(--ink-4); font-size: 12.5px; }

/* ═══════════ 提示条 / 抽屉 ═══════════ */
.toast-wrap { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 300; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast {
  background: var(--ink); color: var(--surface); font-size: 12.5px; line-height: 1.5;
  padding: 9px 15px; border-radius: 99px; box-shadow: var(--shadow-lg);
  animation: toastIn .18s ease both; max-width: 76vw;
}
html[data-theme="dark"] .toast { background: var(--surface-3); color: var(--ink); border: 1px solid var(--line-strong); }
.toast.ok { background: var(--ok); color: #fff; }
.toast.bad { background: var(--bad); color: #fff; }
@keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.mask { position: absolute; inset: 0; background: rgba(10, 14, 20, .38); z-index: 40; display: none; }
.mask.on { display: block; animation: fadeIn .12s ease both; }
.drawer-x {
  display: none; position: absolute; top: 10px; right: 10px; width: 28px; height: 28px;
  border-radius: 8px; place-items: center; color: var(--ink-3); border: 1px solid var(--line);
  background: var(--surface); z-index: 2;
}
.queue.open .drawer-x, .side.open .drawer-x { display: grid; }

/* 记住展开/收起动画的语义：动画只表达「从哪来、到哪去」，不做装饰 */
@keyframes dr { from { opacity: .4; transform: translateX(-10px); } to { opacity: 1; transform: none; } }
@keyframes drR { from { opacity: .4; transform: translateX(10px); } to { opacity: 1; transform: none; } }

/* ═══════════ 响应式两档（1180 / 900） ═══════════ */
@media (max-width: 1320px) {
  .body { grid-template-columns: 56px 264px minmax(0, 1fr) 340px; }
  .metric .k { display: none; }
  .metric { padding: 6px 9px; }
}
@media (max-width: 1180px) {
  .body { grid-template-columns: 56px 268px minmax(0, 1fr); }
  .side {
    display: none; background: var(--surface); border-left: 1px solid var(--line);
    box-shadow: var(--shadow-lg);
  }
  .side.open { display: flex; position: absolute; top: 0; right: 0; bottom: 0; width: min(92vw, 400px); z-index: 45; animation: drR .2s ease both; }
  .side.open .side-head { padding-right: 46px; }
  #navDrawerSide { display: grid; }
}
@media (max-width: 900px) {
  .queue { display: none; }
  .queue.open { display: flex; position: absolute; top: 0; left: 0; bottom: 0; width: min(90vw, 300px); z-index: 45; box-shadow: var(--shadow-lg); animation: dr .2s ease both; }
  .queue.open .queue-head { padding-right: 46px; }
  .cards { grid-template-columns: 1fr; }
  #navDrawerQueue { display: grid; }
  /* 顶栏这一排在 900px 以下会被挤成竖排（每个字一行），比藏起来更难读。
     数字没有少：右栏「处置概览」抽屉里那三个格子是同一份，点得动。 */
  .metrics { display: none; }
  .cfg-grid2 { grid-template-columns: minmax(0, 1fr); }
  .wx-grid { grid-template-columns: 1fr; }
  .appr-out { grid-template-columns: 1fr; }
  .chan-grid { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 720px) {
  .brand-text span { display: none; }
  .wrap, .composer-in { padding: 0 14px; }
  .wrap2 { padding: 16px 14px 30px; }
  .board, .intro { padding: 16px 14px 8px; }
  .top { padding: 0 10px; gap: 8px; }
  .pal-btn span { display: none; }
}

/* 动效可关：等待、展开、抽屉全都不再动 */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}
</style>
</head>
<body>
<div class="app">
  <a class="skip" href="#stageInner">跳到主内容</a>
  <div class="sr-only" id="srLive" aria-live="polite" aria-atomic="true"></div>

  <header class="top">

      <div class="brand-mark" aria-hidden="true">售</div>

    <nav class="metrics" id="metrics" aria-label="按处置状态筛选"></nav>

    <div class="top-right">
      <button class="pal-btn" id="btnPalette" aria-label="打开命令面板（Ctrl 加 K）">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <span>搜索与命令</span><span class="kbd">Ctrl K</span>
      </button>
      <span class="engine-tag" id="engineTag" role="button" tabindex="0" aria-label="判定引擎，可切换"><span class="dot" aria-hidden="true"></span>判定引擎</span>
      <button class="switch on" id="autoSwitch" aria-pressed="true" title="关闭后，所有涉及资金的处置都转入人工审批队列">
        <span class="lbl">自主执行</span>
        <span class="st" id="autoState">已开启</span>
        <span class="toggle" aria-hidden="true"></span>
      </button>
      <button class="icon-btn" id="btnTheme" title="浅色 / 深色主题" aria-label="切换浅色或深色主题">◐</button>
    </div>
  </header>

  <div class="body">
    <aside class="rail" aria-label="主导航">
      <button class="rail-btn active" id="navChat" title="处置对话" aria-label="处置对话">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/></svg>
      </button>
      <button class="rail-btn" id="navAppr" title="人工审批" aria-label="人工审批">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        <span class="badge" id="railBadge" style="display:none">0</span>
      </button>
      <button class="rail-btn" id="navSrc" title="数据源" aria-label="数据源">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="5.5" rx="7.5" ry="3"/><path d="M4.5 5.5v6c0 1.66 3.36 3 7.5 3s7.5-1.34 7.5-3v-6"/><path d="M4.5 11.5v6c0 1.66 3.36 3 7.5 3s7.5-1.34 7.5-3v-6"/></svg>
        <span class="badge" id="srcBadge" style="display:none">!</span>
      </button>
      <button class="rail-btn narrow" id="navDrawerQueue" title="今日处置" aria-label="展开今日处置队列">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1.2" fill="currentColor" stroke="none"/><circle cx="3.5" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="3.5" cy="18" r="1.2" fill="currentColor" stroke="none"/></svg>
      </button>
      <button class="rail-btn narrow" id="navDrawerSide" title="处置详情" aria-label="展开右侧详情栏">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg>
      </button>
      <button class="rail-btn" id="navCfg" title="接口设置（模型通道）" aria-label="接口设置">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="7" cy="17" r="2.2"/></svg>
      </button>
      <div class="rail-spacer"></div>
      <button class="rail-btn" id="navNew" title="新建处置" aria-label="新建处置">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </aside>

    <aside class="queue" aria-label="处置队列">
      <div class="queue-head">
        <div class="t">今日处置 <span class="n" id="qCount">0</span></div>
        <div class="s" id="qSub">贴入客户原话即可自动处理</div>
        <div class="qsearch">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="qSearch" type="search" placeholder="搜索客户原话或案件类型" aria-label="搜索处置记录" autocomplete="off">
        </div>
        <div class="qfilter" id="qFilter"></div>

<script>
"use strict";

/* ═══════════ 基础工具 ═══════════ */
const $ = (id) => document.getElementById(id);
const on = (el, ev, fn) => el && el.addEventListener(ev, fn);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const yuan = (n) => "¥" + Number(n ?? 0).toLocaleString("zh-CN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const yuanShort = (n) => "¥" + Number(n ?? 0).toLocaleString("zh-CN", { maximumFractionDigits: 2 });

/* ═══════════ 术语净化：渲染前必须过这一层 ═══════════
   界面是给售后运营看的，任何越界的内部词汇（工具名、枚举、规则编号、字段名）
   都在这里被翻成人话。防线放在渲染层而不是数据层：数据继续服务命令行与接口，
   展示层单独收口，改一处即全覆盖。 */
const TERM = [
  [/aftersales\.decide_refund/g, "退款处置"],
  [/aftersales\.create_exchange/g, "换货建单"],
  [/aftersales\.create_return/g, "退货建单"],
  [/aftersales\.query_order/g, "查询订单"],
  [/aftersales\.query_refund/g, "查询退款申请"],
  [/aftersales\.query_sku/g, "查询商品规格"],
  [/aftersales\.query_logistics/g, "查询物流"],
  [/aftersales\.query_ticket/g, "查询工单记录"],
  [/aftersales\.(notify_customer|send_notice)/g, "通知客户"],
  [/aftersales\.[a-z_]+/g, "处置动作"],
  [/\bdecide_refund\b/g, "退款处置"],
  [/\bcreate_exchange\b/g, "换货建单"],
  [/REJECT_FACT_CONFLICT/g, "未通过：信息与记录不符"],
  [/REJECT_AMOUNT/g, "未通过：金额超出实付"],
  [/REJECT_STAGE_VIOLATION/g, "未通过：处理顺序不符"],
  [/REJECT_MISSING_EVIDENCE/g, "未通过：关键凭证缺失"],
  [/REJECT_NO_CRITERIA/g, "未通过：缺少判断依据"],
  [/WARN_AMBIGUOUS/g, "基本通过，存在不确定项"],
  [/CLARIFY_NEEDED/g, "需补充信息"],
  [/PENDING_APPROVAL/g, "待人工审批"],
  [/PENDING_ASK/g, "待人工确认"],
  [/AUTO_EXECUTED/g, "已自动执行"],
  [/SKIPPED_BY_GATE/g, "未获授权未执行"],
  [/\bAPPROVED\b/g, "已批准"],
  [/\bREJECTED\b/g, "已驳回"],
  [/\bPENDING\b/g, "待审批"],
  [/\bPASS\b/g, "复核通过"],
  [/\bREJECT\b/g, "不予处置"],
  [/\bAPPROVE\b/g, "人工审批"],
  [/\bEXECUTE\b/g, "直接执行"],
  [/\bASK\b/g, "执行前确认"],
  [/\bAUTO\b/g, "无需审批"],
  [/\bBY_AMOUNT\b/g, "按金额分档"],
  [/\bfull\b/g, "完整核查"],
  [/\blight\b/g, "快速处理"],
  [/\bclarify\b/g, "待澄清"],
  [/\boffline_rule\b/g, "规则判定"],
  [/\bmodel\b/g, "智能判定"],
  [/\bREFUND_ONLY\b/g, "仅退款"],
  [/\bRETURN_REFUND\b/g, "退货退款"],
  [/\bEXCHANGE\b/g, "换货"],
  [/\bLOGISTICS_INQUIRY\b/g, "物流查询"],
  [/\bCOMPLAINT\b/g, "投诉"],
  [/\bUNCLEAR\b/g, "诉求不明"],
  [/\bPARTIAL_REFUND\b/g, "部分退款"],
  [/\bNEED_MORE_INFO\b/g, "需补充信息"],
  [/\bINQUIRY\b/g, "物流查询"],
  [/\bpaid_amount\b/g, "订单实付金额"],
  [/\bapplied_amount\b/g, "退款申请金额"],
  [/\brefundable_service_fee\b/g, "可退服务费"],
  [/\breason_code\b/g, "退款理由"],
