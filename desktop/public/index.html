  [/\bLOGISTICS_DELAY\b/g, "物流延误"],
  [/\bsigned\s*=\s*true\b/g, "已签收"],
  [/\bsigned\s*=\s*false\b/g, "未签收"],
  [/\bsigner\s*=/g, "签收人 "],
  // 审批凭据里的内部标记：界面上只留「人话」，标识本身留给日志与接口
  [/human[(（]脚本自动确认[)）]/g, "按预设自动确认"],
  [/human[(（]未响应[)）]/g, "人工未响应"],
  [/\bhuman\b/g, "人工"],
  [/\border_id\b/g, "订单号"],
  [/\brefund_id\b/g, "退款单号"],
  [/\bsku_id\b/g, "商品编号"],
  [/\bmsg_id\b/g, "会话编号"],
  [/\borders\b/g, "订单"],
  [/\brefunds\b/g, "退款申请"],
  [/\bsku_specs\b/g, "商品规格"],
  [/\blogistics\b/g, "物流"],
  [/\btickets\b/g, "工单记录"],
  [/\bnamespace\b/g, "命名空间"],
  [/\bslots\b/g, "槽位"],
  [/[A-Z]{2,3}-\d+/g, ""],
];

function sanitize(s) {
  let t = String(s ?? "");
  for (const pair of TERM) t = t.replace(pair[0], pair[1]);
  // 收尾：清掉净化后残留的空洞与重复标点
  return t.replace(/\s+([，。；：、])/g, "$1").replace(/([，。；：、])\s*\1+/g, "$1").replace(/[ \t]{2,}/g, " ").trim();
}
const S = (s) => esc(sanitize(s));

/* ═══════════ 传输层 ═══════════
   失败要分得清是哪一类，否则界面只能把「Failed to fetch」原样丢给人看：
     net    —— 根本没连上（服务退了 / 端口被占 / 断网），这时该提示「怎么把它叫回来」
     server —— 服务在，但它内部崩了（5xx），这是我们的问题，不该让人去改配置
     client —— 请求本身不成立（4xx），通常带一句能照做的中文原因
     model  —— 模型通道不可用，出口是「去接口设置」
   调用方拿 e.kind 决定给什么出口，而不是去正则匹配英文错误。 */
async function api(path, body, opts) {
  const opt = opts || {};
  /* __DEMO_TRANSPORT__ */
  let r;
  try {
    r = await fetch(path, {
      method: body === undefined ? "GET" : "POST",
      headers: { "Content-Type": "application/json" },
      body: body === undefined ? undefined : JSON.stringify(body),
      signal: opt.signal,
    });
  } catch (e) {
    if (e && e.name === "AbortError") throw e; // 取消是用户动作，不是故障
    const err = new Error("连不上工作台服务");
    err.kind = "net";
    throw err;
  }
  let j = null;
  try { j = await r.json(); } catch (e) { /* 非 JSON 响应 */ }
  if (!r.ok || !j || j.ok === false) {
    const msg = (j && j.error) || ("请求失败（HTTP " + r.status + "）");
    const err = new Error(msg);
    err.status = r.status;
    err.kind = r.status >= 500 ? "server" : (/模型通道|密钥|接口地址|模型名称/.test(msg) ? "model" : "client");
    throw err;
  }
  return j;
}

/**
 * 流式跑一个案件：过程事件一条条到，最后给结果。
 *
 * 两种交付形态、两种运输，上层只有这一处代码：
 *   · 服务端形态：POST /api/run/stream，前端读 NDJSON 行
 *   · 单文件形态：页内引擎，回调直接就是引擎的回调（同一个进程，本来就是真的）
 * 单文件那条由构建脚本把下面这行「传输缝」替换成页内调用 —— 界面上不写两套逻辑。
 */
async function apiStream(path, body, handlers, opts) {
  const h = handlers || {};
  const opt = opts || {};
  /* __DEMO_STREAM__ */
  let r;
  try {
    r = await fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
      signal: opt.signal,
    });
  } catch (e) {
    if (e && e.name === "AbortError") throw e;
    const err = new Error("连不上工作台服务");
    err.kind = "net";
    throw err;
  }
  if (!r.ok || !r.body) {
    let j = null;
    try { j = await r.json(); } catch (e) { /* 非 JSON 响应 */ }
    const msg = (j && j.error) || ("请求失败（HTTP " + r.status + "）");
    const err = new Error(msg);
    err.status = r.status;
    err.kind = r.status >= 500 ? "server" : (/模型通道|密钥|接口地址|模型名称/.test(msg) ? "model" : "client");
    throw err;
  }

  const reader = r.body.getReader();
  const dec = new TextDecoder();
  let buf = "";
  let final = null;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    const parts = buf.split("\n");
    buf = parts.pop();
    for (const raw of parts) {
      if (!raw.trim()) continue;
      let msg;
      try { msg = JSON.parse(raw); } catch (e) { continue; }
      if (msg.type === "start") { if (h.onStart) h.onStart(msg); }
      else if (msg.type === "event") { if (h.onEvent) h.onEvent(msg.line); }
      else if (msg.type === "result") final = msg;
      else if (msg.type === "cancelled") {
        const err = new Error(msg.error || "已取消");
        err.name = "AbortError";
        throw err;
      } else if (msg.type === "error") {
        const err = new Error(msg.error || "服务端出错");
        err.kind = "server";
        throw err;
      }
    }
  }
  if (!final) {
    const err = new Error("过程流在没有结果的情况下就结束了");
    err.kind = "server";
    throw err;
  }
  return final;
}

/** 把任何异常收敛成「能给人看的三件事」：原因 / 下一步 / 出口类型。不编来源，只说已知的 */
function errOf(e) {
  const msg = (e && e.message) || "未知错误";
  let kind = (e && e.kind) || "unknown";
  if (kind === "unknown" && /模型通道|密钥|接口地址|模型名称/.test(msg)) kind = "model";
  const hint = (e && e.hint) || ({
    net: "服务进程可能已退出，或端口被别的程序占用。回到启动它的那个窗口看看，或重新运行启动脚本。",
    server: "这是工作台服务内部的错误，跟你的操作无关。启动窗口的报错日志能定位到原因。",
    model: "模型通道现在不可用。填齐接口地址、模型名称、访问密钥，或先切回规则判定。",
  }[kind] || "");
  return { msg, hint, kind };
}

/* ═══════════ 状态 ═══════════ */
const st = {
  boot: null,
  autonomous: true,
  mode: "offline",
  sessions: [],
  cur: null,
  approvals: [],
  view: "chat",
  filter: null,
  q: "",              // 队列搜索词
  qCursor: null,      // 队列键盘光标（j/k 移动、Enter 打开）
  palIdx: 0,          // 命令面板当前选中项
  palHelp: false,     // 面板处在「快捷键一览」模式
  palReturn: null,    // 面板关闭后焦点回到哪
  approver: "",
  /* 数据源 */
  sources: null,          // /api/connectors 的响应
  srcNote: {},            // 每个连接器最近一次拉取的回执
  srcBusy: "",            // 正在拉的连接器 id
  mcpBusy: false,         // 正在重连数据通道
  impDataset: "orders",
  impText: "",
  impReport: null,
  inbound: [],            // 入站消息流水
  wxBusy: false,
  wxFrom: "",
  wxChannel: "",
  wxText: "",
  followups: {},          // 人工跟进台账：caseKey → { owner, status, log[] }
  fuBy: "",               // 跟进人（默认沿用审批人署名）
  fuNote: "",             // 跟进记录 / 补充事实
  fuTo: "",               // 转交给谁
  fuBusy: false,
  /* 接口设置 */
  cfg: null,              // GET /api/config 的回执（密钥只含尾 4 位）
  cfgBusy: "",            // "" | "load" | "save" | "test"
  cfgOut: "",             // 测试连通的结果文字
  cfgTested: false,       // 本次进来以后是否真的验过一次连通（填齐 ≠ 连得上）
};

/* 这条是不是「Agent 交不出来、要人接」的案子 —— 决定右栏是否出现跟进台账 */
function needsFollowUp(r) {
  if (!r) return false;
  const s = statusOf(r);
  if (s === "blocked" || s === "clarify" || s === "rejected") return true;
  return !!(r.reply && r.reply.follow_up_required);
}
function fuKey(s) { return (s && (s.msgId || s.id)) || ""; }
function fuOf(s) { const k = fuKey(s); return (k && st.followups[k]) || null; }
const FU_STATUS_TEXT = { todo: "待跟进", doing: "跟进中", waiting: "等客户回复", closed: "已结单" };
const FU_ACTION_TEXT = {
  claim: "接手跟进",
  note: "记了一条跟进",
  wait: "已联系客户，等待客户补充",
  reassign: "转交跟进",
  rerun: "按补充事实重新处置",
  close: "核实完毕，结单",
};

function statusOf(r) {
  if (!r) return "run";
  if (r.pending_approval) return "pending";
  const v = r.review && r.review.verdict;
  if (v && v.indexOf("REJECT") === 0) return "blocked";
  if (v === "CLARIFY_NEEDED") return "clarify";
  if (r.auth && r.auth.approval_decision === "REJECTED" && !r.executed_tool) return "rejected";
  return "done";
}
const STATUS_TEXT = {
  run: { cls: "run", txt: "处理中" },
  done: { cls: "ok", txt: "已处理" },
  pending: { cls: "wait", txt: "待人工审批" },
  blocked: { cls: "bad", txt: "已拦截" },
  rejected: { cls: "bad", txt: "审批未通过" },
  clarify: { cls: "mute", txt: "需补充信息" },
  fail: { cls: "bad", txt: "未跑通" },
};

/**
 * 会话级状态。和 statusOf(result) 的区别在于它能表达「压根没拿到结果」。
 *
 * 为什么必须分开：result 为 null 时 statusOf 只能返回 "run"，
 * 于是一条已经失败、永远不会再变绿的记录会一直显示「处理中」——
 * 队列里看着像在跑、指标里算进「处理中」、重试入口也没有。这不是慢，是死。
 */
function sessStatus(s) {
  if (!s) return "run";
  if (s.error) return "fail";
  return statusOf(s.result);
}

/* ═══════════ 六步执行流 ═══════════ */
function stepsFor(r) {
  const out = [];
  const u = r.understanding || {};
  const cls = r.classification || {};
  const j = r.judge || {};
  const rv = r.review || {};
  const auth = r.auth;
  const v = rv.verdict || "";
  const blocked = v.indexOf("REJECT") === 0;
  const clarify = v === "CLARIFY_NEEDED";

  const intentBits = [];
  if (cls.case_name) intentBits.push("识别为「" + sanitize(cls.case_name) + "」诉求");
  if (u.order_id) intentBits.push("从原话里定位到订单 " + u.order_id);
  else intentBits.push("未从原话里匹配到订单");
  if (u.sentiment === "angry") intentBits.push("客户情绪较激动");
  out.push({
    key: "understand", label: "理解需求",
    state: clarify || blocked ? "skip" : "done",
    tx: clarify ? "诉求信息不足，先向客户追问澄清" : intentBits.join("；"),
    more: [["客户提到", u.order_ref ? u.order_ref : "—"], ["判断方式", u.judge_source]],
  });

  const srcs = (r.evidence_sources || []).map((x) => sanitize(x));
  if (clarify) {
    out.push({ key: "order", label: "核实订单", state: "skip", tx: "等待客户补充信息后再核实" });
  } else if (!cls.money_action && !srcs.length) {
    out.push({ key: "order", label: "核实订单", state: "skip", tx: "本次无需调取订单资料" });
  } else {
    out.push({
      key: "order", label: "核实订单", state: "done",
      tx: "已核实：" + (srcs.length ? srcs.join("、") : "系统内未找到对应资料"),
      more: [["已调取", srcs.join("、") || "—"], ["补证情况", r.requery_rounds ? "复核后补充了 " + r.requery_rounds + " 轮" : "首轮即完备"]],
    });
  }

  const criteria = (j.criteria || []).map((c) => sanitize(c.statement));
  const conflict = (j.conflicts || []).map(sanitize);
  const amb = (j.ambiguous || []).map(sanitize);
  if (clarify) {
    out.push({ key: "judge", label: "拟定方案", state: "skip", tx: "诉求不明，不拟定方案" });
  } else if (blocked) {
    out.push({
      key: "judge", label: "拟定方案", state: "warn",
      tx: "已形成初步判断，但依据之间不自洽，交合规复核裁定",
      more: [["初步依据", criteria], ["冲突点", conflict]].filter((x) => x[1].length),
    });
  } else {
    out.push({
      key: "judge", label: "拟定方案", state: "done",
      tx: "建议「" + sanitize(j.decision || "") + "」" + (j.amount ? "，金额 " + yuanShort(j.amount) : "") + "，依据 " + criteria.length + " 条",
      more: [["判断依据", criteria], ["不确定项", amb], ["冲突点", conflict]].filter((x) => x[1].length),
    });
  }

  const findings = (rv.findings || []).map((f) => sanitize(f.because));
  if (clarify) {
    out.push({ key: "review", label: "合规复核", state: "done", tx: "复核通过：在客户补充信息前不进入处置" });
  } else if (blocked) {
    out.push({
      key: "review", label: "合规复核", state: "bad",
      tx: "未通过：" + sanitize(v).replace(/^未通过：/, ""),
      more: [["复核意见", findings]],
    });
  } else if (v === "WARN_AMBIGUOUS") {
    out.push({
      key: "review", label: "合规复核", state: "warn",
      tx: "基本通过，但存在没有确定口径之处，责任归属需要人判断",
      more: [["复核意见", findings]],
    });
  } else {
    out.push({ key: "review", label: "合规复核", state: "done", tx: "复核通过，可以进入授权与执行", more: findings.length ? [["复核意见", findings]] : [] });
  }

  if (blocked) {
    out.push({ key: "exec", label: "授权与执行", state: "skip", tx: "被合规复核拦下，未进入执行" });
  } else if (clarify) {
    out.push({ key: "exec", label: "授权与执行", state: "skip", tx: "本次无需执行" });
  } else if (!cls.money_action) {
    out.push({ key: "exec", label: "授权与执行", state: "done", tx: "本次不涉及资金或不可逆动作，无需执行" });
  } else if (r.pending_approval) {
    out.push({
      key: "exec", label: "授权与执行", state: "wait",
      tx: "停办：该笔 " + yuanShort(r.pending_approval.amount) + " 超出 Agent 自动处置范围，已转入人工审批",
      more: [["自动处置上限", yuanShort(r.pending_approval.auto_limit)], ["当前状态", "等待人工审批后由 Agent 继续执行"]],
    });
  } else if (r.executed_tool) {
    const tierTxt = auth ? sanitize(auth.label) : "直接执行";
    out.push({
      key: "exec", label: "授权与执行", state: "done",
      tx: "已按「" + tierTxt + "」放行并完成处置" + (auth && auth.amount ? "：" + yuanShort(auth.amount) : ""),
      more: [["谁批准的", auth && auth.approver ? sanitize(auth.approver) : "无需人工介入"], ["执行结果", sanitize(r.execution_outcome)]],
    });
  } else if (auth && auth.approval_decision === "REJECTED") {
    out.push({
      key: "exec", label: "授权与执行", state: "bad",
      tx: "人工审批未通过，未执行任何资金处置",
      more: [["审批人", auth.approver ? sanitize(auth.approver) : "未署名"], ["处理方式", "转交专人向客户说明并跟进"]],
    });
  } else {
    out.push({
      key: "exec", label: "授权与执行", state: "warn",
      tx: "未执行任何资金处置",
      more: [["执行结果", sanitize(r.execution_outcome)]],
    });
  }

  out.push({
    key: "reply", label: "回复客户", state: r.reply ? "done" : "skip",
    tx: r.reply ? (r.reply.follow_up_required ? "已生成回复，并标记需人工跟进" : "已生成回复并结单") : "未生成回复",
    more: r.reply ? [["结单说明", sanitize(r.reply.internal_note)]] : [],
  });

  return out;
}

const STEP_MARK = { done: "✓", warn: "!", bad: "✕", wait: "!", run: "•", skip: "·", idle: "·" };
const STEP_STATE_TXT = { done: "完成", warn: "有保留", bad: "未通过", wait: "等人裁决", run: "进行中", skip: "未进入", idle: "待开始" };
const STEP_LABELS = ["理解需求", "核实订单", "拟定方案", "合规复核", "授权与执行", "回复客户"];

/**
 * 事件 → 六步里的第几步。
 *
 * 映射写在明处是有意的：相位与种类是引擎的枚举（accept / investigate / …），
 * 六步是给使用者的话（理解需求 / 核实订单 / …）。翻译只允许发生在这一个函数里，
 * 别处再用 phase 判断一次，口径就会分叉。
 *
 * 「合规复核」是唯一按 kind 判的：它在引擎里可能出现在 accept 或 judge 相位里
 * （诉求不明时复核发生在受理段），但使用者的心智里它永远是第 4 步。
 */
function stepIndexForEvent(line) {
  if (!line) return 0;
  if (line.kind === "review") return 3;
  const byPhase = { accept: 0, investigate: 1, judge: 2, approve: 4, close: 5 };
  const i = byPhase[line.phase];
  return i === undefined ? 0 : i;
}

/** 一次跑批的过程态：六步各自的真实事件、起止时刻与当前状态 */
function newRun(id) {
  return {
    id: id, startedAt: Date.now(), lastAt: Date.now(), events: 0,
    steps: STEP_LABELS.map(() => ({ state: "idle", summary: "", events: [], t0: null, t1: null })),
  };
}

/** 一条真实事件落进对应那一步：之前的步骤收尾，之后的保持待开始 */
function applyEventToRun(run, line) {
  const i = stepIndexForEvent(line);
  const step = run.steps[i];
  const now = Date.now();
  run.lastAt = now;
  run.events += 1;
  step.events.push({ seq: line.seq, at: now, summary: sanitize(line.summary || ""), kind: line.kind, phase: line.phase });
  if (step.t0 === null) step.t0 = now;
  step.t1 = now;
  step.summary = sanitize(line.summary || "");
  step.state = "run";
  for (let k = 0; k < run.steps.length; k++) {
    if (k < i && run.steps[k].state === "run") run.steps[k].state = "done";
  }
  return i;
}

/** 过程态 → 给界面用的六步（跑的时候每一行都是真事，不是先写死后点亮的） */
function runToSteps(run) {
  return run.steps.map((st, i) => ({
    label: STEP_LABELS[i], state: st.state,
    tx: st.summary || (st.state === "idle" ? "等待前一步完成" : ""),
    more: [], events: st.events, t0: st.t0, t1: st.t1,
  }));
}

/**
 * 结果 → 给界面用的六步。结论文字用 stepsFor（那是给人看的判断与依据），
 * 事件列表用手上真实的轨迹事件（如果这次跑批是流式的、我们收到了）。
 * 两者都真：文字是「这一步意味着什么」，事件是「这一步到底做了什么」。
 */
function resultToSteps(result, run) {
  const base = stepsFor(result);
  return base.map((s, i) => {
    const live = run && run.steps[i] ? run.steps[i] : null;
    return Object.assign({}, s, {
      label: STEP_LABELS[i],
      events: live ? live.events : [],
      t0: live ? live.t0 : null,
      t1: live ? live.t1 : null,
    });
  });
}

function fmtDur(ms) {
  if (ms === null || ms === undefined) return "";
  if (ms < 1000) return ms + " ms";
  return (ms / 1000).toFixed(ms < 10000 ? 2 : 1) + " 秒";
}

function tlStepHtml(s, i) {
  const more = (s.more || []).filter((x) => x && x[1] && (!Array.isArray(x[1]) || x[1].length));
  const evs = s.events || [];
  const dur = s.t0 !== null && s.t1 !== null && s.t1 > s.t0 ? fmtDur(s.t1 - s.t0) : (s.state === "run" ? "计时中" : "");
  const hasDetail = more.length || evs.length;

  const evHtml = evs.length
    ? '<div class="tl-evh">过程记录 ' + evs.length + ' 条</div>' + evs.map((e) =>
        '<div class="tl-ev"><span class="sq">' + e.seq + '</span><span class="tx">' + esc(e.summary) + '</span>' +
        '<span class="tm">' + new Date(e.at).toTimeString().slice(0, 8) + '</span></div>').join("")
    : "";

  const moreHtml = more.map((x) =>
    '<div class="tl-kv"><span class="k">' + esc(x[0]) + '</span><span class="v">' +
    (Array.isArray(x[1]) ? x[1].map((z) => S(z)).join("；") : S(x[1])) + '</span></div>').join("");

  const detail = hasDetail
    ? '<button class="tl-fold" data-fold="' + i + '" aria-expanded="false" aria-controls="tlmore' + i + '">' +
        '<span class="tri" aria-hidden="true">▶</span>依据与过程</button>' +
      '<div class="tl-detail" data-more="' + i + '" id="tlmore' + i + '">' + moreHtml + evHtml + '</div>'
    : "";

  return '<li class="tl-step ' + s.state + '" data-step="' + i + '">' +
    '<div class="tl-gutter"><span class="tl-node" aria-hidden="true">' + (STEP_MARK[s.state] || "·") + '</span><i class="tl-wire"></i></div>' +
    '<div class="tl-body"><div class="tl-row">' +
      '<span class="tl-label">' + esc(s.label) + '</span>' +
      '<span class="chip ' + tlChipCls(s.state) + '">' + STEP_STATE_TXT[s.state] + '</span>' +
      (dur ? '<span class="tl-dur">' + esc(dur) + '</span>' : "") +
    '</div>' +
    (s.tx ? '<div class="tl-text">' + S(s.tx) + '</div>' : "") + detail +
    '</div></li>';
}

function tlChipCls(state) {
  return state === "done" ? "ok" : state === "bad" ? "bad" : (state === "warn" || state === "wait") ? "wait"
    : state === "run" ? "run" : "mute";
}

/**
 * 时间线整块。
 * meta.live = true 时是「正在跑」：节点带脉冲、时长走计时，正文里不出现任何结论性措辞。
 */
function tlHtml(steps, meta) {
  const m = meta || {};
  const doneN = steps.filter((s) => s.state === "done").length;
  const total = m.t0 && m.t1 ? fmtDur(m.t1 - m.t0) : "";
  const sub = m.live
    ? "进行中 · 已完成 " + doneN + "/6 步 · 已跑 " + Math.round((Date.now() - (m.t0 || Date.now())) / 1000) + " 秒"
    : "六步 · " + (m.events ? m.events + " 条过程记录 · " : "") + (total ? "用时 " + total : "已结束");
  return '<div class="tl">' +
    '<div class="tl-head"><span class="tl-title">Agent 执行过程</span>' +
      '<span class="tl-sub" data-tl-sub>' + esc(sub) + '</span><span class="sp"></span>' +
      (m.live ? '<span class="chip run">在跑</span>' : "") +
      '<button class="btn xs" data-tl-all="1">展开全部依据</button></div>' +
    '<ol class="tl-list" id="tlList" aria-label="Agent 执行过程（六步）">' + steps.map(tlStepHtml).join("") + '</ol></div>';
}

function stepCountOf(run) {
  return run && run.steps ? run.steps.reduce((n, s) => n + s.events.length, 0) : 0;
}

/* 兼容旧调用点：结果卡上方那块「Agent 处理过程」现在就是时间线 */
function renderWork(result, phase, run) {
  if (phase === "run" && run) return tlHtml(runToSteps(run), { live: true, t0: run.startedAt, t1: Date.now() });
  const steps = resultToSteps(result, run);
  return tlHtml(steps, { t0: run ? run.startedAt : null, t1: run ? run.lastAt : null, events: run ? stepCountOf(run) : 0 });
}

/* ═══════════ 渲染：指标与队列 ═══════════ */
function counts() {
  const c = { run: 0, done: 0, pending: 0, blocked: 0, rejected: 0, clarify: 0, fail: 0 };
  for (const s of st.sessions) c[sessStatus(s)] = (c[sessStatus(s)] || 0) + 1;
  c.pending += st.approvals.filter((a) => !st.sessions.some((s) => s.result && s.result.pending_approval && s.result.pending_approval.id === a.id)).length;
  return c;
}

// 指标条 = 监管入口，不是装饰：每一项都能点开对应的处置列表并直接操作
const METRIC_DEFS = [
  { key: "done", cls: "m-ok", label: "已自动处理", hint: "看它自己处理完的这些" },
  { key: "pending", cls: "m-wait", label: "待人工审批", hint: "等你拍板，点开就能裁决" },
  { key: "blocked", cls: "m-stop", label: "已拦截", hint: "合规复核拦下的，看它为什么拦" },
  { key: "rejected", cls: "m-stop", label: "审批未通过", hint: "你驳回过、没有执行的" },
  { key: "clarify", cls: "m-ask", label: "需补充信息", hint: "等客户回话，回复已备好" },
  // 未跑通必须单独一格：混进「已自动处理」是虚报，混进「处理中」是让人干等
  { key: "fail", cls: "m-stop", label: "未跑通", hint: "点开看失败原因，可原样重试" },
];

function renderMetrics() {
  const c = counts();
  $("metrics").innerHTML = METRIC_DEFS.map((d) => {
    const n = c[d.key] || 0;
    const on = st.filter === d.key;
    return '<button class="metric ' + d.cls + (n === 0 ? " zero" : "") + (on ? " on" : "") +
      '" data-metric="' + d.key + '" title="' + esc(d.hint) + '"' +
      ' aria-pressed="' + (on ? "true" : "false") + '"' +
      ' aria-label="' + esc(d.label + " " + n + " 条：" + d.hint) + '">' +
      '<span class="dot" aria-hidden="true"></span><span class="n">' + n + '</span><span class="k">' + esc(d.label) + '</span></button>';
  }).join("");
  const badge = $("railBadge");
  if (c.pending > 0) {
    badge.style.display = "grid"; badge.textContent = c.pending;
    $("navAppr").setAttribute("aria-label", "人工审批，待办 " + c.pending + " 条");
  } else {
    badge.style.display = "none";
    $("navAppr").setAttribute("aria-label", "人工审批");
  }
}

function pickMetric(key) {
  // 再点一次同一个 = 取消筛选
  st.filter = st.filter === key ? null : key;
  const hit = st.filter ? st.sessions.filter((s) => sessStatus(s) === st.filter) : [];
  if (st.filter === "pending") {
    // 「待人工审批」是唯一需要人动手的一档：除了筛队列，直接把人送进审批中心
    st.view = "approvals";
    if (hit[0]) st.cur = hit[0].id;
  } else if (st.filter) {
    // 其余各档：切回处置视图并选中第一条，右栏立刻给出该条的结论 / 回复（可直接复制）
    st.view = "chat";
    if (hit[0]) st.cur = hit[0].id;
  }
  renderAll();
  if (st.filter) $("stageScroll").scrollTop = 0;
  const d = METRIC_DEFS.find((x) => x.key === st.filter);
  toast(
    st.filter
      ? "只看「" + d.label + "」（" + hit.length + " 条）：" + d.hint
      : "已显示全部处置记录",
    st.filter ? "" : "ok"
  );
}

/* 搜索是对「人怎么找东西」的直接支持：客户原话、案件名、单号、处理结果里
   任一处命中即留下。运营手上通常只有半句原话或一个单号。 */
function matchesQuery(s, q) {
  if (!q) return true;
  const hay = [
    s.title, s.text,
    s.result && s.result.classification && s.result.classification.case_name,
    s.result && s.result.execution_outcome,
    s.result && s.result.understanding && s.result.understanding.order_id,
    s.result && s.result.reply && s.result.reply.customer_text,
  ].filter(Boolean).join(" ").toLowerCase();
  return q.toLowerCase().split(/\s+/).filter(Boolean).every((w) => hay.indexOf(w) >= 0);
}

function qitemHtml(s) {
  const cfg = STATUS_TEXT[sessStatus(s)];
  const fu = fuOf(s);
  const fuTarget = fuKey(s) || s.id;
  const fuTag = fu
    ? '<button type="button" class="fu-tag" data-goto-fu="' + esc(fuTarget) + '" title="打开这条的人工跟进">' + esc(FU_STATUS_TEXT[fu.status] || "跟进中") + '</button>'
    : (s.result && needsFollowUp(s.result)
      ? '<button type="button" class="fu-tag" data-goto-fu="' + esc(fuTarget) + '" title="这条等你接手">待接手</button>'
      : "");
  const foot = s.error
    ? "未跑通 · 点开可原样重试"
    : fu
      ? (fu.owner ? "跟进人 " + sanitize(fu.owner) : "待接手") + " · " + (fu.log || []).length + " 条记录"
      : (s.result && s.result.reply && s.result.reply.follow_up_required ? "需人工跟进" : (s.pending ? "处理中…" : "自主结单"));
  const time = s.at ? new Date(s.at).toTimeString().slice(0, 5) : "";
  return '<div class="qitem ' + (st.cur === s.id ? "active " : "") + (st.qCursor === s.id ? "kb" : "") +
    '" data-q="' + esc(s.id) + '" role="listitem" tabindex="0" aria-selected="' + (st.cur === s.id ? "true" : "false") + '">' +
    '<div class="r1"><span class="name">' + S(s.title) + '</span><span class="chip ' + cfg.cls + '">' + cfg.txt + '</span>' + fuTag + '</div>' +
    '<div class="r2">' + S(s.text) + '</div>' +
    '<div class="r3">' + (time ? '<span class="time">' + esc(time) + '</span>' : "") + '<span>' + esc(foot) + '</span></div></div>';
}

function renderQueue() {
  const all = st.sessions;
  const q = (st.q || "").trim();
  let rows = st.filter ? all.filter((s) => sessStatus(s) === st.filter) : all;
  if (q) rows = rows.filter((s) => matchesQuery(s, q));
  $("qCount").textContent = rows.length;
  const d = METRIC_DEFS.find((x) => x.key === st.filter);
  $("qSub").textContent = st.filter || q
    ? "筛选自 " + all.length + " 条记录"
    : (all.length ? "共 " + all.length + " 条，均由 Agent 自主推进" : "贴入客户原话即可自动处理");
  $("qFilter").innerHTML =
    (d || q
      ? (d ? '<span class="pill">' + esc(d.label) + " " + rows.length + '</span>' : "") +
        (q ? '<span class="pill">搜索 ' + esc(q) + " " + rows.length + '</span>' : "") +
        '<button class="clr" data-clear-filter="1">清除筛选</button>'
      : "");

  if (!all.length) {
    $("qList").innerHTML = '<div class="empty-side pad-narrow"><div class="big">◍</div>还没有处置记录<br>下方输入框贴一句客户原话试试</div>';
    return;
  }
  if (!rows.length) {
    $("qList").innerHTML = '<div class="empty-side pad-narrow"><div class="big">◌</div>没有符合条件的记录<br>换个词，或点「清除筛选」看全部</div>';
    return;
  }
  /* 分组只在「没筛也没搜」时出现：一旦人明确说了要看什么，就别再拿分组打断他。
     分组本身是有用信息 —— 这个产品的日常是「有事要你动手」和「它自己办完了」两堆。 */
  if (!st.filter && !q) {
    const NOW = ["pending", "blocked", "rejected", "clarify", "fail"];
    const groups = [
      { t: "等你处理", list: rows.filter((s) => NOW.indexOf(sessStatus(s)) >= 0) },
      { t: "正在处理", list: rows.filter((s) => sessStatus(s) === "run") },
      { t: "已自动完成", list: rows.filter((s) => sessStatus(s) === "done") },
    ].filter((g) => g.list.length);
    $("qList").innerHTML = groups.map((g) =>
      '<div class="queue-group">' + esc(g.t) + " " + g.list.length + '</div>' + g.list.map(qitemHtml).join("")).join("");
    return;
  }
  $("qList").innerHTML = rows.map(qitemHtml).join("");
}

/* ═══════════ 渲染：主区 ═══════════ */
// 首屏 = 工作台：只说当下有什么、要你做什么，不介绍自己
function boardHtml() {
  const stats = (st.sources && st.sources.datasets) || [];
  const mcp = (st.sources && st.sources.mcp) || null;
  // 失败的那条也要出现在这里：工作台首屏是唯一「不看队列也能知道出事了」的地方，
  // 把它滤掉就等于让「刚才那一下没跑通」在落地页上静默消失。
  const sessions = st.sessions;
  const todo = st.approvals;

  const srcChips = stats.length
    ? '<div class="dschips">' + stats.map((d) =>
        '<button class="dschip" data-goto-sources="1"><span class="dot"></span>' + esc(d.label) +
        ' <b>' + d.rows + '</b></button>').join("") + '</div>'
    : '<div class="empty-line">数据源读取中…</div>';

  const todoRows = todo.length
    ? todo.slice(0, 4).map((t) =>
        '<div class="brow click" data-goto-appr="1"><span class="nm">' + S(t.case_name) + '</span>' +
        '<span class="tx">' + esc(sanitize(t.stop_reason)) + '</span>' +
        '<span class="amt amt-warn">' + yuan(t.amount) + '</span></div>').join("")
      + (todo.length > 4 ? '<div class="empty-line">还有 ' + (todo.length - 4) + ' 条…</div>' : "")
    : '<div class="empty-line">没有等你拍板的事 —— 在它权限内的处置它已经自己执行完了。</div>';

  // 「等你接手」：Agent 交不出来、必须有人接的案子。这是工作台上唯一需要人动手的第三类事。
  const fuOpen = sessions.filter((s) => needsFollowUp(s.result) && (!fuOf(s) || fuOf(s).status !== "closed"));
  const fuRows = fuOpen.length
    ? fuOpen.slice(0, 5).map((s) => {
        const fu = fuOf(s);
        return '<div class="brow click" data-q="' + esc(s.id) + '"><span class="nm">' + S(s.title) + '</span>' +
          '<span class="tx">' + S(s.text) + '</span>' +
          '<span class="fu-tag">' + esc(fu ? (FU_STATUS_TEXT[fu.status] || "待跟进") : "待接手") + '</span></div>';
      }).join("")
    : "";

  const recentRows = sessions.length
    ? sessions.slice(0, 5).map((s) => {
        const cfg = STATUS_TEXT[sessStatus(s)];
        return '<div class="brow click" data-q="' + esc(s.id) + '"><span class="nm">' + S(s.title) + '</span>' +
          '<span class="tx">' + S(s.text) + '</span><span class="chip ' + cfg.cls + '">' + cfg.txt + '</span></div>';
      }).join("")
    : '<div class="empty-line">还没有处置记录 —— 在下面输入框贴一句客户原话即可。</div>';

  return '<div class="board fade-in">' +
    '<div class="board-top"><h1>处置台</h1><span class="sub">' +
      (mcp && mcp.ready ? "MCP 已联通 · " + mcp.tools.length + " 个数据工具" : "数据源未联通，正在以本地文件通路取数") +
    '</span></div>' +
    '<div class="bsec"><div class="bt"><span>数据已接入</span><span class="sp"></span>' +
      '<button class="btn sm" data-goto-sources="1">接入数据</button></div>' + srcChips + '</div>' +
    '<div class="bsec focus"><div class="bt"><span>等你拍板</span><span class="sp"></span>' +
      (todo.length ? '<span class="chip wait">' + todo.length + ' 条</span>' : "") + '</div>' + todoRows + '</div>' +
    (fuOpen.length
      ? '<div class="bsec focus"><div class="bt"><span>等你接手</span><span class="sp"></span>' +
        '<span class="chip mute">' + fuOpen.length + ' 条</span></div>' + fuRows +
        '<div class="empty-line">这些是它拦下或没问清的 —— 点进去就能接手、记跟进、或补上客户给的事实让它重跑。</div></div>'
      : "") +
    '<div class="bsec"><div class="bt"><span>最近的处置</span><span class="sp"></span></div>' + recentRows + '</div>' +
    '</div>';
}

/* ═══════════ 渲染：数据源页 ═══════════ */
function srcStatusChip(c, mcpReady) {
  if (c.kind !== "mcp") return '<span class="chip mute">' + (c.kind === "file" ? "按需导入" : "入站口就绪") + '</span>';
  if (!mcpReady) return '<span class="chip mute">本地文件通路</span>';
  const live = c.tools.filter((t) => (t.op === "list" || t.op === "get") && t.live).length;
  const total = c.tools.filter((t) => t.op === "list" || t.op === "get").length;
  return '<span class="chip ' + (live === total ? "ok" : "wait") + '">' + (live === total ? "已联通" : "部分联通") + ' ' + live + "/" + total + '</span>';
}

function srcCardHtml(c, mcpReady) {
  const busy = st.srcBusy === c.id;
  const note = st.srcNote[c.id];
  const datasets = c.datasets.length
    ? '<div class="src-meta">' + c.datasets.map((d) => '<span class="dschip">' + esc(d.label) + ' <b>' + d.rows + '</b> 条</span>').join("") +
      '<span class="dschip off">来源 ' + esc(c.platforms.join(" / ")) + '</span></div>'
    : '<div class="src-meta"><span class="dschip off">来源 ' + esc(c.platforms.join(" / ")) + '</span></div>';

  const act = c.kind === "mcp"
    ? '<button class="btn sm' + (busy ? "" : "") + '" data-pull="' + esc(c.id) + '"' + (busy ? " disabled" : "") + '>' + (busy ? "拉取中…" : "拉取数据") + '</button>'
    : c.kind === "file"
      ? '<button class="btn sm" data-goto-import="1">去导入</button>'
      : '<button class="btn sm" data-goto-wx="1">去投递</button>';

  const tools = c.tools.map((t) => {
    const mark = (t.op === "list" || t.op === "get")
      ? ' <span class="' + (t.live ? "tool-on" : "tool-off") + '">' + (t.live ? "●" : "○") + '</span>'
      : "";
    return '<code>' + esc(t.fq) + '</code> ' + esc(t.title) + mark;
  }).join("<br>");

  return '<div class="src-card' + (busy ? " busy" : "") + '">' +
    '<div class="src-head"><span class="bdg ' + (c.kind === "mcp" ? "" : c.kind === "file" ? "file" : "hook") + '">' + esc(c.badge) + '</span>' +
      '<span class="nm">' + esc(c.name) + '</span>' + srcStatusChip(c, mcpReady) +
      '<span class="sp"></span>' + act + '</div>' +
    '<div class="src-body"><div class="src-desc">' + esc(sanitize(c.desc)) + '</div>' + datasets +
      '<div class="src-tools">' + tools + '</div>' +
      (note ? '<div class="src-note' + (note.bad ? " bad" : "") + '">' + note.html + '</div>' : "") +
    '</div></div>';
}

function impPanelHtml() {
  const ds = (st.sources && st.sources.datasets) || [];
  const tabs = ds.map((d) =>
    '<button class="imp-tab' + (st.impDataset === d.dataset ? " on" : "") + '" data-imp-ds="' + esc(d.dataset) + '">' +
    esc(d.label) + '<b>' + d.rows + '</b></button>').join("");

    ? '<div class="rep' + (st.impReport.bad ? " bad" : "") + '">' + st.impReport.html + '</div>' : "";
  return '<div class="panel" id="impPanel">' +
    '<div class="panel-head"><b>导入表格</b><span class="sub">CSV / TSV / JSON · 按主键合并，重复导入只更新不重复</span></div>' +
    '<div class="panel-body"><div class="imp-tabs">' + tabs + '</div>' +
    '<textarea class="imp-box" id="impText" spellcheck="false" placeholder="把表头和数据一起粘进来，例如：&#10;order_id,buyer_id,sku_id,qty,paid_amount,currency,paid_at,status,sales_channel&#10;O20261015-5501,U-9951,SKU-9901,1,268.00,CNY,2026-10-15T09:20:00+08:00,paid,微信小店">' +
      esc(st.impText) + '</textarea>' +
    '<div class="imp-act"><label class="btn sm">选择文件<input type="file" id="impFile" accept=".csv,.tsv,.json,.txt" class="hidden"></label>' +
      '<button class="btn sm" data-imp-sample="1">' + (st.impText ? "清空" : "填示例") + '</button>' +
      '<span class="sp"></span>' +
      '<button class="btn primary sm" data-imp-run="1">导入</button></div>' + rep +
    '</div></div>';
}

function wxPanelHtml() {
  const log = st.inbound.length
    ? st.inbound.map((e) => {
        const chip = e.status === "duplicate" ? '<span class="chip mute">已去重</span>'
          : e.status === "pending" ? '<span class="chip wait">已转审批</span>' : '<span class="chip ok">已处置</span>';

    '<div class="panel-head"><b>微信客户消息</b><span class="chip ok">入站口已就绪</span>' +
      '<span class="sub">消息进来即触发处置，结论按原路回写</span></div>' +
    '<div class="panel-body"><div class="wx-grid">' +
      '<div class="wx-form">' +
        '<input id="wxFrom" placeholder="客户（例如：客户 李先生）" value="' + esc(st.wxFrom) + '">' +
        '<input id="wxChannel" placeholder="来源（微信小店 / 公众号 / 小程序客服）" value="' + esc(st.wxChannel) + '">' +
        '<textarea id="wxText" placeholder="粘贴客户发来的那句话…">' + esc(st.wxText) + '</textarea>' +
        '<div class="wx-act"><button class="btn primary sm" data-wx-run="1"' + (st.wxBusy ? " disabled" : "") + '>' +
          (st.wxBusy ? "处理中…" : "投递一条") + '</button>' +
          '<button class="btn sm" data-wx-sample="1">填一条示例</button></div>' +
        '<div class="wx-hint">本地入站口 <code>POST /api/inbound</code>；同一 message_id 重复投递自动去重，不会跑第二遍。</div>' +
      '</div>' +
      '<div class="wx-log"><div class="wx-log-h">最近入站</div><div class="wx-log-b">' + log + '</div></div>' +
    '</div>' +
    '<details class="hintdet"><summary>接真实微信需要配什么</summary><div class="bd">' +
      '本页的入站口是本地演示口。接真实微信时，在微信侧把消息回调指向你自己的地址，再把回调报文转发到这个口即可：' +
      '<ol><li>微信小店 / 公众号后台 → 服务器配置：填回调 URL、Token、EncodingAESKey；</li>' +
      '<li>服务端校验签名并解密报文，取出 <code>FromUserName</code> 与 <code>Content</code>；</li>' +
      '<li>以 <code>{ text, from, channel, msg_id }</code> 调 <code>POST /api/inbound</code>（<code>msg_id</code> 用微信的 <code>MsgId</code>，用于去重）；</li>' +
      '<li>把返回的客户回复按微信客服消息接口回写。</li></ol>' +
      '凭据只放本地 <code>.env</code>，不进任何前端与文档。</div></details>' +
    '</div></div>';
}

function sourcesHtml() {
  const s = st.sources;
  if (!s) {
    return '<div class="wrap2 fade-in"><div class="phead"><h1>数据源</h1></div>' +
      '<div class="empty-line loading-line">读取中…</div></div>';
  }
  const mcpReady = !!(s.mcp && s.mcp.ready);
  const statline = '<div class="statline"><span>库内已有</span>' +
    s.datasets.map((d) => '<span class="dschip">' + esc(d.label) + ' <b>' + d.rows + '</b></span>').join("") +
    '<span class="sp grow"></span></div>';

  const mcpChip = mcpReady
    ? '<span class="chip ok">MCP 服务端已联通 · ' + s.mcp.tools.length + ' 个工具</span>'
    : '<span class="chip wait">MCP 未联通 · 走本地文件通路</span>';

  return '<div class="wrap2 fade-in">' +
    '<div class="phead"><h1>数据源</h1>' + mcpChip +
      '<span class="sp"></span>' +
      '<button class="btn sm" data-pull="*">全部拉取</button>' +
      '<button class="btn sm primary" data-goto-import="1">导入表格</button>' +
    '</div>' + statline +
    mcpPanelHtml(s.mcp) +
    s.connectors.map((c) => srcCardHtml(c, mcpReady)).join("") +

/**
 * 数据通道状态。
 *
 * 上一版这一页只有一句「MCP 未联通 · 走本地文件通路」，把「不通」当成结论就结束了 ——
 * 人看不出是不通还是慢、是通道坏了还是数据没有、点哪里能修。
 * 这一块把探测到的事实逐条摆出来（都是真测的），并给一个「重连」，
 * 不通时还要说清一件事：数据照样能取，只是换了一条路。
 */
function mcpPanelHtml(mcp) {
  const m = mcp || { ready: false, problem: "还没有读到通道状态", tools: [] };
  const info = m.serverInfo || {};
  // 单文件版没有进程可拉：不摆一个点了必然失败的按钮（与接口设置页同一条纪律）
  const canRetry = m.can_reconnect !== false;
  const rows = [
    ["连接方式", canRetry ? "MCP · 本地进程通道" : "MCP · 本形态无进程，走文件通路"],
    ["服务端", esc(info.name || "—")],
    ["工具前缀", "<code>" + esc(m.namespace || "—") + ".</code>"],
    ["在线工具", m.ready ? m.tools.length + " 个" : "0 个"],
    ["握手耗时", m.ready && m.handshakeMs ? m.handshakeMs + " 毫秒" : "—"],
    ["单次调用上限", m.timeoutMs ? Math.round(m.timeoutMs / 1000) + " 秒" : "—"],
    ["尝试连接", canRetry ? (m.attempts || 0) + " 次" : "这一形态不适用"],
  ].map(([k, v]) => '<div class="kvlist"><span class="k">' + esc(k) + '</span><span class="v">' + v + '</span></div>').join("");

  const problem = !m.ready && m.problem
    ? '<div class="src-note bad chan-problem"><b>为什么不通：</b>' + esc(sanitize(m.problem)) + '</div>' +
      '<div class="chan-fallback">这不影响取数 —— 点「拉取数据」会改走本地文件通路，' +
      '读到的是同一份数据、走同一套校验，条数与在线时一致。</div>'
    : "";

  return '<div class="panel">' +
    '<div class="panel-head"><b>数据通道</b>' +
      (m.ready ? '<span class="chip ok">联通</span>' : '<span class="chip wait">未联通</span>') +
      '<span class="sub">' + (m.ready ? "正在用 MCP 协议从连接器取数" + (info.version ? "（服务端 " + esc(info.version) + "）" : "") : "当前以本地文件通路取数") + '</span>' +
      '<span class="sp"></span>' +
      (canRetry
        ? '<button class="btn sm" data-mcp-reconnect="1"' + (st.mcpBusy ? " disabled" : "") + '>' +
          (st.mcpBusy ? "重连中…" : "重连") + '</button>'
        : '<span class="chan-static">单文件版没有可重连的进程</span>') +
    '</div>' +
    '<div class="panel-body"><div class="chan-grid">' + rows + '</div>' + problem + '</div></div>';
}

/**
 * 正在跑的那一条：只说明「在跑、跑了多久、可以不等了」。
 *
 * 上一版这里放六行骨架 + 一条不定进度线 —— 骨架只能表达「在跑」，表达不了跑到哪。
 * 现在过程由真实事件驱动、就在下方时间线里逐条长出来，骨架反而成了多余的噪声：
 * 有真东西看的时候，就不该再摆一个假形状。
 */
function pendingCardHtml(s) {
  const slow = st.mode === "model";
  return '<div class="msg agent"><div class="who"><span class="av" aria-hidden="true">A</span>' +
    '<span class="nm">售后 Agent</span><span class="chip run">处理中</span></div>' +
    '<div class="bubble run-line"><span class="spin" aria-hidden="true"></span>' +
    '<span>' + (slow ? "正在跑这条链路（智能判定一条约 20–30 秒）" : "正在跑这条链路") + '</span>' +
    '<span class="el" data-elapsed="' + esc(s.id) + '" aria-live="polite">0 秒</span>' +
    '<button class="btn sm" data-cancel-run="' + esc(s.id) + '">取消等待</button></div></div>';
}

/**
 * 没跑通的样子。
 *
 * 上一版的写法是把这条记录直接删掉、只弹一句 toast —— 于是「刚才跑的是什么、
 * 为什么没成、还能不能再试一次」三件事一起消失，而这三件事恰好是失败的
 * 时候唯一还值得看的东西。这里就地留下：原因、下一步、以及一个原样重试的入口。
 *
 * 不写「请稍后再试」这种空话；只给这一条现在真的能做的事。
 */
function failCardHtml(s) {
  const e = s.error || {};
  const reason = sanitize(e.msg || "服务没有返回结果");
  const hint = e.hint ? sanitize(e.hint) : "";
  const cfgBtn = e.kind === "model" ? '<button class="btn sm" data-goto-config="1">去接口设置</button>' : "";
  return '<div class="msg agent"><div class="who"><span class="av">A</span>售后 Agent' +
      '<span class="chip bad">未跑通</span></div>' +
    '<div class="bubble fail-bubble">' +
      '<div class="fb-t">这一条没有跑通</div>' +
      '<div class="fb-r">' + esc(reason) + '</div>' +
      (hint ? '<div class="fb-h">' + esc(hint) + '</div>' : "") +
      '<div class="fb-act">' +
        // 重试是这张卡唯一的主操作，用正常字号而不是 sm：11.5px 下中文合成加粗会糊成一团
        '<button class="btn primary" data-retry-run="' + esc(s.id) + '">重试这一条</button>' + cfgBtn +
        '<span class="fb-note">原话已保留，重试会把流程重走一遍</span>' +
      '</div>' +
      '<div class="fb-h">失败不留任何处置动作 —— 这条没有被执行，也没有动过客户的钱。</div>' +
    '</div></div>';
}

/* ═══════════ 接口设置（模型通道） ═══════════
   模型通道是本工程唯一的外部依赖，原先只写在项目根的 .env 里。
   对会开终端的人不算事，但「换一个密钥」不该要求人先去翻文件 ——
   这一页就是把那四行搬进界面：改完立刻生效，不用重启。

   边界写在代码旁边，因为越界一次就会出事：
     · 密钥只回尾 4 位。接口、界面、日志都不出现完整值。
     · 密钥框留空 = 保持原值。要清空得单独勾 —— 不能让「没填」等于「清掉」。
     · 保存后重载配置缓存。否则文件改了、进程里还是旧值，
       表现为「保存成功但不生效」，是最难查的一类问题。
     · 单文件版没有服务端，这一页如实说明，不渲染一个填了也存不下去的死表单。 */

function cfgProblemText(p) {
  const t = String(p || "");
  if (!t) return "";
  if (/占位/.test(t)) return "访问密钥还是占位文字，需要换成一个真实可用的密钥。";
  if (/缺少/.test(t)) return "接口地址、模型名称、访问密钥三项都必填，现在还没填齐。";
  return t;
}

/** 只取主机名给人看 —— 完整地址太长，状态卡里放不下也没必要 */
function cfgHost(u) {
  const m = String(u || "").match(/^https?:\/\/([^/]+)/i);
  return m ? m[1] : String(u || "").replace(/^https?:\/\//i, "");
}

function cfgHtml() {
  const c = st.cfg;
  /* 「填齐了」和「真的连得上」是两件事。没验过之前不说可用 ——
     只填齐就宣称可用，等于替服务商打包票。 */
  const chipCls = !c ? "" : (!c.usable ? "wait" : (st.cfgTested ? "ok" : "wait"));
  const chipTxt = !c ? "" : (!c.editable ? "此形态不可配置" : (!c.usable ? "模型通道未就绪" : (st.cfgTested ? "连通已验证" : "模型通道已填齐")));
  const head = '<div class="phead"><h1>接口设置</h1>' +
    (c ? '<span class="chip ' + chipCls + '">' + chipTxt + '</span>' : "") +
    '<span class="sp"></span></div>';

  if (!c) {
    return '<div class="wrap2 fade-in">' + head + '<div class="cfg-wrap">' +
      '<div class="empty-line loading-line">读取中…</div></div></div>';
  }

  /* 单文件版：没有进程可以写回配置。如实说清，不给一个填了也存不下去的表单 */
  if (!c.editable) {
    return '<div class="wrap2 fade-in">' + head + '<div class="cfg-wrap">' +
      '<div class="cfg-state bad"><span class="k">当前形态不能在这里改。</span>' +
        '<span>' + esc(c.reason || "这一页需要本地服务端才能保存配置。") + '</span></div>' +
      '<div class="cfg-card"><div class="cfg-note">' +
        '<b>要换模型接口，请用本地服务模式打开这一页：</b>' +
        '<div class="cfg-cmd">node desktop/server.mjs</div>' +
        '<div class="cfg-cmd">然后打开 http://127.0.0.1:8787/</div>' +
        '<div class="mt-10">单文件版双击即用、不用装任何东西，代价是它只有一个离线规则引擎，' +
          '<b>没有进程可以写回配置</b>。两种形态的判定结论口径完全一致。</div>' +
      '</div></div></div></div>';
  }

  const stateCard = cfgStateHtml(c);

  /* 环境变量会盖掉配置文件。不说，就会出现「改了没反应」而又查不出原因 */
  const shadow = (c.shadowed || []).length
    ? '<div class="cfg-warn"><span>!</span><span>这台机器上有环境变量正在覆盖配置文件（' +
      esc((c.shadowed || []).join("、")) + '）。写进文件的值对它们不起作用，' +
      '要让这里的修改生效，得先把对应的环境变量去掉。</span></div>'
    : "";

  return '<div class="wrap2 fade-in">' + head + '<div class="cfg-wrap">' +
    stateCard +
    '<div class="cfg-card">' +
      '<div class="cfg-row"><label for="cfgBase">接口地址</label>' +
        '<input id="cfgBase" type="text" spellcheck="false" autocomplete="off" value="' + esc(c.baseUrl) + '" placeholder="https://…">' +
        '<div class="hint">模型服务的基础地址，程序会在末尾自动拼上 /chat/completions。</div></div>' +
      '<div class="cfg-grid2">' +
        '<div class="cfg-row"><label for="cfgModel">模型名称</label>' +
          '<input id="cfgModel" type="text" spellcheck="false" autocomplete="off" value="' + esc(c.model) + '" placeholder="例如 glm-4-flash"></div>' +
        '<div class="cfg-row"><label for="cfgTimeout">单次超时（秒）</label>' +
          '<input id="cfgTimeout" type="number" min="1" max="600" step="1" value="' + esc(String(c.timeout || 60)) + '"></div>' +
      '</div>' +
      '<div class="cfg-row"><label for="cfgKey">访问密钥</label>' +
        '<input id="cfgKey" type="password" spellcheck="false" autocomplete="new-password" placeholder="' + esc(c.key_mask || "未设置") + '">' +
        '<div class="hint" id="cfgKeyHint">' + cfgKeyHintHtml(c) + '</div></div>' +
      '<label class="cfg-clear"><input type="checkbox" id="cfgClearKey"> 清除已保存的密钥</label>' +
      shadow +
      '<div class="cfg-acts">' +
        '<button class="btn primary" id="cfgSave">保存并生效</button>' +
        '<button class="btn" id="cfgTest">测试连通</button>' +
        '<span class="hint">保存后立刻生效，不用重启服务</span>' +
      '</div>' +
      '<div class="cfg-out" id="cfgOut">' + esc(st.cfgOut || "") + '</div>' +
      '<div class="cfg-note mt-10">「测试连通」用的是已经<b>保存</b>的配置 —— 改完先保存再测。</div>' +
    '</div>' +
    '<div class="cfg-card"><div class="cfg-note">' +
      '<b>这些值存在哪。</b>存在项目根目录的 <code>.env</code> 里，只留在本机、不上传到任何地方。' +
      '保存时只改这四行，文件里的注释与其余内容原样保留。' +
      '界面上任何时候都只显示密钥末 4 位，完整值不会回传。' +
    '</div></div>' +
  '</div></div>';
}

/* 状态卡与密钥提示拆成独立函数：保存 / 测试连通之后只换这两块，
   不去重画整张表单 —— 重画就会把光标冲掉（输入到一半被抢焦点是最恼人的那种）。 */
function cfgStateHtml(c) {
  return c.usable
    ? '<div class="cfg-state ok" id="cfgState"><span class="k">' + (st.cfgTested ? "已就绪。" : "已填齐。") + '</span><span>' +
      esc(cfgHost(c.baseUrl) || "接口地址") + ' · ' + esc(c.model || "") + " —— " +
      (st.cfgTested
        ? "刚刚试过，连通正常，可以用智能模型判定，一条大约 20–30 秒。"
        : "三项都填好了，但还没验过它能不能真连上 —— 点「测试连通」确认一下。") +
      "</span></div>"
    : '<div class="cfg-state bad" id="cfgState"><span class="k">还差一步。</span><span>' +
      esc(cfgProblemText(c.problem)) + "</span></div>";
}

function cfgKeyHintHtml(c) {
  return c.key_set
    ? "已保存一个密钥（末 4 位 <b>" + esc(c.key_mask || "****") + "</b>）。留空表示沿用，要换就整条填新的。"
    : "还没有可用的密钥。填一条完整密钥后保存。";
}

/**
 * 只刷新配置页的可变部分：状态卡、密钥提示、回执区、按钮态。
 * **不动输入框里的值，也不动光标位置** —— 这是分片渲染在配置页上的全部意义。
 */
function patchCfg() {
  const c = st.cfg;
  const busy = !!st.cfgBusy;
  const s = $("cfgState");
  if (s && c && c.editable) s.outerHTML = cfgStateHtml(c);
  const kh = $("cfgKeyHint");
  if (kh && c && c.editable) kh.innerHTML = cfgKeyHintHtml(c);
  const out = $("cfgOut");
  if (out) out.textContent = st.cfgOut || "";
  const sb = $("cfgSave");
  if (sb) { sb.disabled = busy; sb.textContent = busy === "save" ? "保存中…" : "保存并生效"; }
  const tb = $("cfgTest");
  if (tb) { tb.disabled = busy; tb.textContent = busy === "test" ? "连接中…" : "测试连通"; }
}

async function loadConfig() {
  st.cfgBusy = "load";
  st.cfgTested = false;   // 换了页面就重来：上一次的验证结论不代表这一次
  try {
    st.cfg = await api("/api/config");
  } catch (e) {
    st.cfg = { ok: false, editable: false, reason: "读取配置失败：" + e.message };
  }
  st.cfgBusy = "";
  if (st.view === "config") renderOnly("stage");
}

/** 表单值一律读 DOM 当前值。st.cfg 里的副本只用于渲染，
    拿它当提交内容会在「改了但没重渲染」时默默地提交旧值 */
function cfgVal(id) {
  const el = $(id);
  return el ? String(el.value || "").trim() : "";
}

async function saveConfig() {
  if (st.cfgBusy) { toast("上一次还没结束，稍等一下", ""); return; }
  const base = cfgVal("cfgBase");
  const model = cfgVal("cfgModel");
  const timeout = cfgVal("cfgTimeout");
  const key = cfgVal("cfgKey");
  const clear = !!($("cfgClearKey") && $("cfgClearKey").checked);

  if (!/^https?:\/\/.+/i.test(base)) { toast("接口地址要以 http:// 或 https:// 开头", "bad"); if ($("cfgBase")) $("cfgBase").focus(); return; }
  if (!model) { toast("模型名称不能为空", "bad"); if ($("cfgModel")) $("cfgModel").focus(); return; }
  const t = Number(timeout);
  if (!(t >= 1 && t <= 600)) { toast("超时请填 1–600 秒之间的数字", "bad"); if ($("cfgTimeout")) $("cfgTimeout").focus(); return; }

  const body = { baseUrl: base, model: model, timeout: t };
  if (key) body.apiKey = key;
  if (clear) body.clear_key = true;   // 留空 ≠ 清空，要清空必须走这个开关

  st.cfgBusy = "save";
  const b = $("cfgSave");
  if (b) { b.disabled = true; b.textContent = "保存中…"; }
  try {
    st.cfg = await api("/api/config", body);
    st.cfgTested = false;   // 刚改过，之前验过的结论作废，要用新值重验
    // 保存完必须把「现在到底能用什么」重新问一遍：
    // 否则顶栏还挂着旧的判定方式，界面与真实配置对不上
    st.boot = await api("/api/bootstrap");
    let pref = "";
    try { pref = localStorage.getItem("aftersales.mode") || ""; } catch (e) { /* 忽略 */ }
    if (!st.cfg.usable) st.mode = "offline";
    else st.mode = pref === "offline" ? "offline" : "model";  // 用户自己选过规则判定就别替他改
    st.cfgOut = "";
    setEngineTag();
    toast(st.cfg.usable
      ? (st.mode === "model" ? "已保存并生效，当前用智能模型判定" : "已保存。当前仍在用内置规则判定，顶栏可随时切换")
      : "已保存。但通道还不完整，先用内置规则判定", st.cfg.usable ? "ok" : "");
  } catch (e) {
    toast("保存失败：" + e.message, "bad");
  } finally {
    st.cfgBusy = "";
    // 只刷新状态卡 / 提示 / 按钮与右栏，不重画表单：刚填完的输入框与光标都留着
    patchCfg();
    renderOnly("side", "chrome");
  }
}

/** 试一次真实的模型调用 —— 不伪造结果：连不上就照实说连不上 */
async function testConfig() {
  if (st.cfgBusy) { toast("上一次还没结束，稍等一下", ""); return; }
  st.cfgBusy = "test";
  const b = $("cfgTest");
  const out = $("cfgOut");
  if (b) { b.disabled = true; b.textContent = "连接中…"; }
  if (out) out.textContent = "正在请求一次极短的补全，通常 1–3 秒…";
  const t0 = Date.now();
  let lines;
  try {
    const r = await api("/api/config/test", {});
    lines = [
      "连通正常 · 用时 " + (r.latency_ms != null ? r.latency_ms : (Date.now() - t0)) + " ms",
      "模型：" + (r.model || ""),
      "返回：" + (r.reply || "（空）"),
    ];
    st.cfgTested = true;
    toast("模型通道连通正常", "ok");
  } catch (e) {
    lines = [
      "没有连上 · 用时 " + (Date.now() - t0) + " ms",
      e.message,
      "",
      "常见原因：地址或模型名不对、密钥无效或已过期、本机访问不到这个地址。",
    ];
    st.cfgTested = false;
    toast("连接失败：" + e.message, "bad");
  }
  st.cfgOut = lines.join("\n");
  st.cfgBusy = "";
  // 重渲染一次才能把角标从「已填齐」换成「连通已验证」，顺带把按钮恢复成可点；
  // 但只换这几块，输入框与光标不动
  if (st.view === "config") { patchCfg(); renderOnly("side"); }
}

/** 客户原话气泡。位上只有一个来源（手贴/样例/微信入站），显示上也只有一种样子 */
function custBubble(text, who) {
  return '<div class="msg cust"><div class="who"><span class="av" aria-hidden="true">客</span>' +
    '<span class="nm">' + esc(who || "客户原话") + '</span></div>' +
    '<div class="bubble">' + S(text) + '</div></div>';
}

/**
 * 停在审批的这条：审批卡**就地**出现在对话流里（审批做成消息块，而不是把人打发到另一个页面）。
 * 三件事必须成立，否则这张卡不如不放：
 *   ① 单子还在手上（st.approvals 里有它）才给「批准/驳回」—— 句柄没了就只剩重跑；
 *   ② 批准后由 Agent 自己续办结单，不需要人再点第二次；
 *   ③ 拿不准的地方照样列出来，别让人对着结论盖章。
 */
function inlineApprovalHtml(s) {
  const pa = s.result && s.result.pending_approval;
  if (!pa) return "";
  const live = (st.approvals || []).find((x) => x.id === pa.id);
  const card = live || Object.assign({}, pa, {
    stale: true,
    stale_reason: "这条处置流程的续办句柄已经不在了（服务重启或页面重开）",
    msg_id: s.msgId || null,
  });
  return '<div class="msg agent"><div class="who"><span class="av" aria-hidden="true">A</span>' +
    '<span class="nm">售后 Agent</span><span class="chip wait">等你拍板</span></div>' +
    approvalCardHtml(card, true) + '</div>';
}

function stageHtml() {
  if (st.view === "config") return cfgHtml();
  if (st.view === "approvals") return approvalPageHtml();
  if (st.view === "sources") return sourcesHtml();
  const s = st.sessions.find((x) => x.id === st.cur);
  if (!s) return boardHtml();
  return '<div class="wrap fade-in"><div class="thread">' +
    custBubble(s.text) +
    (s.error ? failCardHtml(s) : "") +
    (!s.error && s.pending
      ? pendingCardHtml(s) + '<div id="tlLive">' + renderWork(null, "run", s.run) + '</div>'
      : "") +
    // 结论在前、过程在后：先回答「这事办完了没有」，想看它怎么走到这一步的往下翻。
    // 「停办等人」的案子还要更进一步：审批卡必须紧跟在结论下面 ——
    // 它等的就是人，让人再往下滚一屏才找到裁定按钮，等于没做这件事。
    (s.result ? verdictHtml(s.result, s) : "") +
    (s.result ? inlineApprovalHtml(s) : "") +
    (s.result ? renderWork(s.result, "done", s.run) : "") +
    (s.result ? renderResult(s.result, s) : "") +
    '</div></div>';
}

/**
 * 结论卡：这条案子最后到底怎么样了 —— 一句话 + 金额 + 唯一该点的那个动作。
 *
 * 它被单独拆出来，是因为它必须排在执行过程**前面**：
 * 一屏之内先给答案，想看过程的往下翻。上一版把结论压在 430px 的时间线下面，
 * 打开一条案子第一眼看到的是「第 2 步做了什么」，而不是「这事办完了没有」。
 */
/** 结论的那一句话。抽出来是因为它有两个消费方：结论卡本身，和读屏播报 */
function verdictHead(r) {
  const rv = r.review || {};
  const verdictTxt = sanitize(rv.verdict || "");
  if (r.pending_approval) {
    return { cls: "wait", icon: "!", title: "已停办，等你拍板", sub: "该笔处置超出 Agent 的自动处置范围。批准后它会立即执行并结单，不需要你再操作一次。" };
  }
  if (r.auth && r.auth.approval_decision === "REJECTED" && !r.executed_tool) {
    return { cls: "bad", icon: "⊘", title: "审批未通过，未执行任何处置", sub: "该笔处置经人工复核后未予通过，Agent 没有动过客户的钱，已转交专人向客户说明并跟进。" };
  }
  if (verdictTxt.indexOf("未通过") === 0) {
    return { cls: "bad", icon: "✕", title: "已拦截，未执行任何处置", sub: "合规复核未通过：" + verdictTxt.replace(/^未通过：?/, "") + "。已按规则转为向客户核实或转交专人。" };
  }
  if (rv.verdict === "CLARIFY_NEEDED") {
    return { cls: "mute", icon: "?", title: "需客户补充信息", sub: "诉求信息不足，Agent 没有猜，而是先向客户追问。" };
  }
  if (r.executed_tool) {
    return { cls: "ok", icon: "✓", title: "已自主完成处置", sub: "Agent 独立走完全流程并完成了处置，未打扰任何人。过程与依据见下方。" };
  }
  return { cls: "mute", icon: "•", title: "已处理", sub: sanitize(r.execution_outcome) };
}

/** 读屏播报：视觉上不出现一个字，但结果与状态变化会被念出来 */
function liveSay(text) {
  const el = $("srLive");
  if (el) el.textContent = String(text || "");
}

function verdictHtml(r, s) {
  const fk = s ? (fuKey(s) || s.id) : "";
  const auth = r.auth;
  const head = verdictHead(r);
  return '<div class="verdict ' + head.cls + '" role="status">' +
    '<div class="vd-icon" aria-hidden="true">' + head.icon + '</div>' +
    '<div class="vd-main"><div class="vd-title">' + esc(head.title) + '</div>' +
      '<div class="vd-sub">' + esc(head.sub) + '</div></div>' +
    (auth && auth.amount ? '<div class="vd-amt"><b>' + yuan(auth.amount) + '</b><span>处置金额</span></div>' : "") +
    '<div class="vd-act">' +
      (r.pending_approval
        ? '<button class="btn sm primary" data-goto-appr="1">去审批中心</button>'
        : (needsFollowUp(r) ? '<button class="btn sm" data-goto-fu="' + esc(fk) + '">去跟进</button>' : "")) +
    '</div>' +
  '</div>';
}

function renderResult(r, s) {
  // 这条案子的跟进地址。按钮必须带上它 —— 不带就只能「跳去第一条待接手」，那不叫去跟进
  const fk = s ? (fuKey(s) || s.id) : "";
  const cfg = STATUS_TEXT[statusOf(r)];
  const auth = r.auth;
  const j = r.judge || {};
  const rv = r.review || {};
  const cls = r.classification || {};
  const verdictTxt = sanitize(rv.verdict || "");

  const basisRows = [];
  if (cls.case_name) basisRows.push(["案件类型", sanitize(cls.case_name)]);
  if (cls.because) basisRows.push(["分类依据", sanitize(cls.because)]);
  if (j.decision) basisRows.push(["处置建议", sanitize(j.decision) + (j.amount ? "　金额 " + yuanShort(j.amount) : "")]);
  const crit = (j.criteria || []).map((c) => sanitize(c.statement));
  if (crit.length) basisRows.push(["判断依据", crit.join("；")]);
  if ((rv.findings || []).length) basisRows.push(["复核意见", rv.findings.map((f) => sanitize(f.because)).join("；")]);

  const authRows = [];
  if (auth) {
    authRows.push(["授权档位", sanitize(auth.label) + "（" + sanitize(auth.tier) + "）"]);
    authRows.push(["分档理由", sanitize(auth.because)]);
    if (auth.approver) authRows.push(["审批人", sanitize(auth.approver)]);
    if (auth.approval_decision) authRows.push(["审批结论", sanitize(auth.approval_decision)]);
  } else {
    authRows.push(["授权档位", "无需审批"]);
    authRows.push(["说明", "本次不涉及资金或不可逆动作"]);
  }
  authRows.push(["执行结果", sanitize(r.execution_outcome)]);

  return '<div class="result">' +
    '<div class="result-head"><span class="chip ' + cfg.cls + '">' + cfg.txt + '</span>' +
      '<span class="t">' + S(cls.case_name || "") + '</span></div>' +
    '<div class="result-sec"><div class="st">处理结论</div>' +
      '<div class="kvlist"><span class="k">复核结论</span><span class="v">' + S(verdictTxt || "—") + '</span></div>' +
      basisRows.map((x) => '<div class="kvlist"><span class="k">' + esc(x[0]) + '</span><span class="v">' + S(x[1]) + '</span></div>').join("") +
    '</div>' +
    '<div class="result-sec"><div class="st">授权与执行</div>' +
      authRows.map((x) => '<div class="kvlist"><span class="k">' + esc(x[0]) + '</span><span class="v">' + S(x[1]) + '</span></div>').join("") +
    '</div>' +
    '<div class="result-sec"><div class="st">给客户的回复</div>' +
      '<div class="reply-box" id="replyText">' + S(r.reply ? r.reply.customer_text : "") + '</div>' +
      '<div class="reply-foot"><button class="btn sm" id="btnCopy">复制回复</button>' +
      (r.reply && r.reply.follow_up_required
        ? '<button class="chip wait chip-btn" data-goto-fu="' + esc(fk) + '">需人工跟进 · 去跟进</button>'
        : '<span class="chip ok">已结单</span>') +
      '</div></div></div>';
}

/* ═══════════ 渲染：右栏 = 处置详情 ═══════════ */

/**
 * 人工跟进台账 —— 只在「Agent 交不出来、要人接」的案子上出现。
 * 它存在的理由：「已转交专人跟进」如果只是文案，人就真没地方接手。
 */
function fuHtml(s) {
  const fu = fuOf(s) || { owner: "", status: "todo", log: [] };
  const stTxt = FU_STATUS_TEXT[fu.status] || "待跟进";
  const chipCls = fu.status === "closed" ? "ok" : (fu.status === "todo" ? "mute" : "wait");
  const rows = (fu.log || []).slice().reverse().map((e) => {
    const t = String(e.at || "").replace("T", " ").slice(5, 16);
    const note = e.note ? '<div class="l2">' + S(e.note) + '</div>' : "";
    const extra = e.action === "reassign" && e.target ? " → " + S(e.target) : "";
    return '<li><div class="l1">' + S(e.label || FU_ACTION_TEXT[e.action] || "跟进") + extra +
      '<span class="t">' + S(e.by || "") + " · " + t + '</span></div>' + note + '</li>';
  }).join("");
  return '<div class="fu" id="fuPanel">' +
    '<div class="fu-h"><span class="st2">人工跟进</span>' +
      '<span class="chip ' + chipCls + '">' + esc(stTxt) + '</span>' +
      '<span class="who">' + (fu.owner ? "跟进人 " + S(fu.owner) : "还没有人接手") + '</span></div>' +
    '<div class="fu-b">' +
      '<div class="fu-line"><input id="fuBy" placeholder="跟进人署名" value="' + esc(st.fuBy || st.approver || "") + '"></div>' +
      '<div class="fu-acts">' +
        '<button class="btn sm" data-fu="claim"' + (st.fuBusy ? " disabled" : "") + '>接手跟进</button>' +
        '<button class="btn sm" data-fu="wait"' + (st.fuBusy ? " disabled" : "") + '>已联系客户，等补充</button>' +
        '<button class="btn sm" data-fu="close"' + (st.fuBusy ? " disabled" : "") + '>核实完毕，结单</button>' +
      '</div>' +
      '<div class="fu-line"><textarea id="fuNote" placeholder="跟进记录；或把客户补充到的事实写在这里，再点「按补充事实重新处置」">' + esc(st.fuNote || "") + '</textarea></div>' +
      '<div class="fu-acts">' +
        '<button class="btn sm" data-fu="note"' + (st.fuBusy ? " disabled" : "") + '>记一条</button>' +
        '<button class="btn sm primary" data-fu="rerun"' + (st.fuBusy ? " disabled" : "") + '>按补充事实重新处置</button>' +
      '</div>' +
      '<div class="fu-line split"><input id="fuTo" placeholder="转交给谁" value="' + esc(st.fuTo || "") + '">' +
        '<button class="btn sm" data-fu="reassign"' + (st.fuBusy ? " disabled" : "") + '>转交</button></div>' +
      ((fu.log || []).length
        ? '<ul class="fu-log">' + rows + '</ul>'
        : '<div class="fu-empty">还没有跟进记录。填上署名点「接手跟进」，这条就归你；客户补到新事实时，写进上面的框里点「按补充事实重新处置」，它会带着新事实重跑一遍链路。</div>') +
    '</div></div>';
}

/**
 * 同类案子过去怎么处理的 —— 只作参考，不影响本条的判断。
 *
 * 两件事必须做到：
 *   ① 每条都说清「为什么是它」（同案型 / 金额接近 / 措辞相近），
 *      而不是甩一个相似度分数 —— 售后结论要能被追问。
 *   ② 标题上就写「只作参考」，末尾再说一遍。记忆一旦被当成判定依据，
 *      它就成了绕过审批的后门：金额档位只认订单账本，不认经验。
 */
function memHtml(hits) {
  const rows = hits.map((h) => {
    // 裁决码统一走净化层（不另立一份文案表：同一业务口径只允许有一处）
    const vt = sanitize(h.verdict || "");
    const v = /^未通过/.test(vt) ? { t: esc(vt), cls: "stop" }
      : (vt === "复核通过" ? { t: esc(vt), cls: "ok" } : { t: esc(vt || "未注明结果"), cls: "wait" });
    const t = String(h.at || "").replace("T", " ").slice(5, 16);
    const amt = h.amount != null ? yuanShort(h.amount) : "无金额";
    return '<li class="mem-li">' +
        '<div class="m1"><span class="mn">' + S(h.case_name || "同类诉求") + '</span>' +
          '<span class="chip ' + v.cls + '">' + v.t + '</span>' +
          '<span class="mt">' + esc(t) + " · " + esc(amt) + '</span></div>' +
        '<div class="m2">' + S((h.why || []).join("；")) + '</div>' +
      '</li>';
  }).join("");
  return '<div class="sec"><div class="st">同类案子过去怎么处理的 <span class="hint">' + hits.length + ' 条 · 只作参考</span></div>' +
      '<ul class="mem-ul">' + rows + '</ul>' +
      '<div class="mem-note">这是过去处理同类诉求留下的记录，用来了解常见的处理方式。本条仍按这次调取的资料与政策来判断，不受这些记录左右。</div>' +
    '</div>';
}

/** 今天等你动手的三件事：数字即入口，点哪个就跳到哪 */
function openFollowUpCount() {
  return st.sessions.filter((s) => needsFollowUp(s.result) && (!fuOf(s) || fuOf(s).status !== "closed")).length;
}

/** 右栏默认态：没选中案子时，这一栏给今天的概览与眼下能做的事，而不是一句「请选一条」 */
/** 配置页的右栏。不重复左边的表单，只补三件左边放不下的事：
    这四项影响什么、两种判定方式的取舍、密钥怎样被对待 */
function sideConfigHtml() {
  const c = st.cfg;
  const ok = !!(c && c.usable);
  const conns = (st.sources && st.sources.connectors) || [];
  return '<div class="sec"><div class="st">这一页改的是什么</div>' +
      '<div class="fu-empty">本工程只有一处外部依赖：判定时调用的模型。左边四项就是它的地址与凭据。' +
      '改完立刻生效，不需要重启。</div></div>' +
    '<div class="sec"><div class="st">两种判定方式</div>' +
      '<div class="kvlist"><span class="k">智能模型判定</span><span class="v">一条约 20–30 秒，能读懂没写清的口语描述' +
        (ok ? "" : "（通道不通时不可用）") + '</span></div>' +
      '<div class="kvlist"><span class="k">内置规则判定</span><span class="v">秒级出结果，结论口径与模型判定一致</span></div>' +
    '</div>' +
    '<div class="sec"><div class="st">密钥怎样对待</div>' +
      '<div class="fu-empty">只存在本机的配置文件里。界面上只显示末 4 位，完整值不回传、不写日志、不进任何导出与文档。</div></div>' +
    '<div class="sec"><div class="st">接着去哪</div>' +
      '<button class="sact" data-focus-input="1"><span>贴一句客户原话</span><span class="sp"></span><span class="cnt">回车</span></button>' +
      '<button class="sact" data-goto-sources="1"><span>看数据源连接</span><span class="sp"></span><span class="cnt">' + conns.length + ' 个</span></button>' +

function sideHomeHtml() {
  const c = counts();
  const fuOpen = openFollowUpCount();
  const tiles = [
    { n: c.done, k: "已自动处理", cls: "ok", metric: "done", hint: "看它自己处理完的这些" },
    { n: c.pending, k: "待你拍板", cls: "wait", metric: "pending", hint: "等你拍板，点开就能裁决" },

      '<button class="sact" data-focus-input="1"><span>贴一句客户原话</span><span class="sp"></span><span class="cnt">回车</span></button>' +

function renderSide() {

  if (st.view === "config") { $("sideBody").innerHTML = sideConfigHtml(); return; }

    return;
  }
  const r = s.result;
  const rv = r.review || {};
  const j = r.judge || {};
  const cfg = STATUS_TEXT[statusOf(r)];
  const findings = (rv.findings || []).map((f) => sanitize(f.because));
  const amb = (j.ambiguous || []).map(sanitize);
  const conflicts = (j.conflicts || []).map(sanitize);

  $("sideBody").innerHTML =
    '<div class="sec"><div class="st">本条的处置</div>' +
      '<div class="kvlist"><span class="k">当前状态</span><span class="v"><span class="chip ' + cfg.cls + '">' + cfg.txt + '</span></span></div>' +
      '<div class="kvlist"><span class="k">案件类型</span><span class="v">' + S(r.classification ? r.classification.case_name : "—") + '</span></div>' +
      '<div class="kvlist"><span class="k">处置结果</span><span class="v">' + S(r.execution_outcome) + '</span></div>' +
      (r.executed_tool ? '<div class="kvlist"><span class="k">已执行动作</span><span class="v">' + S(r.executed_tool) + '</span></div>' : "") +
    '</div>' +
    (r.pending_approval ? '<div class="banner wait gap"><span class="bi">!</span><span>这条正在等人工审批，切到「人工审批」页签即可处理。</span></div>' : "") +
    '<div class="sec"><div class="st">合规复核 <span class="hint">' + findings.length + ' 条意见</span></div>' +
      (findings.length ? '<ul class="appr-ul">' + findings.map((f) => '<li>' + S(f) + '</li>').join("") + '</ul>'
        : '<div class="note-plain">复核通过，无异常项。</div>') +
    '</div>' +
    ((amb.length || conflicts.length) ? '<div class="sec"><div class="st">它拿不准的地方</div>' +
      (amb.length ? '<div class="appr-q">不确定项</div><ul class="appr-ul warn-li">' + amb.map((x) => '<li>' + S(x) + '</li>').join("") + '</ul>' : "") +
      (conflicts.length ? '<div class="appr-q">信息冲突</div><ul class="appr-ul warn-li">' + conflicts.map((x) => '<li>' + S(x) + '</li>').join("") + '</ul>' : "") +
    '</div>' : "") +
    '<div class="sec"><div class="st">自主边界</div>' +
